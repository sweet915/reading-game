叶子变成了细细的刺。刺的表面积很小，水分就不容易跑掉了。而且刺还能保护仙人掌，不被沙漠里的动物吃掉。", "仙人掌的绿色茎干里有厚厚的水分储存组织，像一个小水库。即使没有雨水，它也能靠储存的水活很长时间。"], "collectWords": ["仙人掌", "沙漠", "恶劣", "蒸发", "储存", "水库"], "quiz": [{"q": "仙人掌生活在哪里？", "opts": ["森林", "草原", "沙漠"], "ans": 2, "why": "原文第1段写道：「仙人掌生活在沙漠里……」"}, {"q": "仙人掌的刺是什么变的？", "opts": ["根", "茎", "叶子"], "ans": 2, "why": "原文第2段写道：「其实这些刺就是叶子变的！」"}, {"q": "仙人掌为什么要把叶子变成刺？", "opts": ["为了好看", "为了减少水分蒸发", "为了扎人"], "ans": 1, "why": "原文第3段说明大叶子容易蒸发水分，第4段说明刺表面积小，水分不容易跑掉。"}, {"q": "仙人掌把水分储存在哪里？", "opts": ["刺里", "根里", "绿色茎干里"], "ans": 2, "why": "原文最后一段写道：「仙人掌的绿色茎干里有厚厚的水分储存组织，像一个小水库。」"}]}, {"id": "M74", "title": "星星为什么会眨眼睛", "theme": "生活", "paras": ["夜晚仰望星空，很多星星一闪一闪的，好像在眨眼睛。星星真的会眨眼睛吗？", "其实不是星星在眨眼睛。星星是巨大的星球，它们一直在稳定地发光，并不会闪烁。", "我们看到的「眨眼」，是因为地球周围有大气层。大气层里有空气，空气的温度和密度不均匀，就像一层层透明的薄纱。", "星光穿过这些不均匀的空气时，光线就会不断地发生折射，方向也微微改变。传到我们眼睛里时，亮度就时强时弱，看起来星星就在一闪一闪了。", "月亮和行星离我们比较近，看起来比较大，这种闪烁就不明显。而遥远的恒星看起来只是一个光点，所以「眨眼」就特别清楚。"], "collectWords": ["眨眼睛", "星球", "大气层", "折射", "恒星", "亮度"], "quiz": [{"q": "星星真的会眨眼睛吗？", "opts": ["会", "不会", "有时候会"], "ans": 1, "why": "原文第2段写道：「其实不是星星在眨眼睛。星星是巨大的星球，它们一直在稳定地发光，并不会闪烁。」"}, {"q": "我们为什么看到星星一闪一闪？", "opts": ["因为星星在动", "因为大气层让光线折射", "因为眼睛有问题"], "ans": 1, "why": "原文第3、4段说明，星光穿过不均匀的大气层时发生折射，传到眼睛里亮度时强时弱。"}, {"q": "什么让大气层的温度和密度不均匀？", "opts": ["风", "空气", "云"], "ans": 1, "why": "原文第3段写道：「大气层里有空气，空气的温度和密度不均匀……」"}, {"q": "为什么月亮不明显「眨眼」？", "opts": ["因为月亮不会发光", "因为月亮离我们近、看起来大", "因为月亮没有大气层"], "ans": 1, "why": "原文最后一段写道：「月亮和行星离我们比较近，看起来比较大，这种闪烁就不明显。」"}]}, {"id": "M75", "title": "含羞草为什么会害羞", "theme": "生活", "paras": ["含羞草是一种很特别的植物。你只要轻轻一碰它的叶子，两片小叶子就会迅速合拢，好像很害羞的样子。过一会儿，它又会慢慢张开。", "含羞草的这种「害羞」，其实是它保护自己的方式。它的老家在热带，那里经常有暴风雨。", "当雨水打在叶子上时，叶子迅速合拢，可以减少被大雨打伤的机会。这是一种聪明的自我保护。", "含羞草的叶柄和叶子基部有一个特殊的结构，叫做「叶枕」。叶枕里充满了水分，支撑着叶片张开。", "受到触碰时，叶枕里的水分会快速流走，叶片就失去了支撑，于是合拢了。等水分重新回来，叶子又会展开。大自然里的植物也有自己的小智慧呢！"], "collectWords": ["含羞草", "合拢", "叶枕", "自我保护", "支撑", "热带"], "quiz": [{"q": "含羞草的老家在哪里？", "opts": ["寒带", "温带", "热带"], "ans": 2, "why": "原文第2段写道：「它的老家在热带……」"}, {"q": "含羞草「害羞」是为了什么？", "opts": ["为了好玩", "保护自己", "为了开花"], "ans": 1, "why": "原文第2段写道：「含羞草的这种「害羞」，其实是它保护自己的方式。」"}, {"q": "含羞草叶柄和叶子基部的特殊结构叫什么？", "opts": ["叶枕", "叶脉", "叶柄"], "ans": 0, "why": "原文第4段写道：「含羞草的叶柄和叶子基部有一个特殊的结构，叫做「叶枕」。」"}, {"q": "受到触碰时叶枕里的水分会怎么样？", "opts": ["变多", "快速流走", "结冰"], "ans": 1, "why": "原文第5段写道：「受到触碰时，叶枕里的水分会快速流走，叶片就失去了支撑，于是合拢了。」"}]}, {"id": "H01", "title": "会飞的木屋", "theme": "童话", "paras": ["老木匠爷爷在森林边盖了一座小木屋。奇怪的是，这座木屋的屋顶上绑着一对巨大的翅膀，那是爷爷用一百块最轻的杉木板做的。村里人都笑他：「木屋又不是鸟，要翅膀干什么？」爷爷只是笑笑，继续在屋檐下挂满彩色的风铃。", "一天夜里，山洪暴发了。洪水像发怒的巨兽，冲进村庄，冲垮了石桥。爷爷赶紧把村里的孩子们都叫进木屋，然后拉动了墙角的一根粗麻绳。只听「呼啦啦」一声巨响，木屋的翅膀缓缓展开，带着一屋子的人飞上了夜空。", "木屋在云层里穿行，孩子们又害怕又兴奋。最小的朵朵吓得直哭，爷爷把她抱到窗边，指着下面的洪水说：「别怕，你看，我们的村子虽然被水淹了，可是人都在这儿，一个也不少。只要人在，家就能重新建起来。」", "三天后，洪水退了。木屋轻轻落回村子旁边的高坡上。村民们围着木屋，再也没有人笑话爷爷了。朵朵拉着爷爷的手问：「爷爷，您怎么知道会发洪水呀？」爷爷摸着她得头说：「我年轻的时候见过一次山洪，从那以后就天天做准备。孩子，真正的勇敢，是在危险还没来的时候，就悄悄做好准备。」", "后来，村里人都学着爷爷的样子，给自家房子做了加固。那座会飞的木屋，成了村子里最受人尊敬的房子。"], "collectWords": ["风铃", "暴发", "缓缓", "尊敬", "勇敢", "准备"], "quiz": [{"q": "村里人一开始为什么笑话爷爷？", "opts": ["爷爷的木匠活不好", "木屋绑翅膀看起来很可笑", "爷爷不爱说话"], "ans": 1, "why": "原文说「木屋又不是鸟，要翅膀干什么？」"}, {"q": "木屋的翅膀在什么时候派上了用场？", "opts": ["山洪暴发的夜里", "朵朵过生日的时候", "村里比赛的时候"], "ans": 0, "why": "山洪暴发时，爷爷拉动麻绳，木屋带人飞上夜空。"}, {"q": "「只要人在，家就能重新建起来」这句话是谁说的，说明了什么？", "opts": ["朵朵说的，说明她很勇敢", "爷爷说的，说明他看重生命胜过财产", "村民说的，说明大家想重建家园"], "ans": 1, "why": "爷爷安慰朵朵时说的，体现他把人的安全放在第一位。"}, {"q": "这个故事告诉我们什么道理？", "opts": ["房子一定要会飞才安全", "真正的勇敢是在危险没来之前就做好准备", "老年人比年轻人聪明"], "ans": 1, "why": "结尾爷爷的话点明了道理。"}]}, {"id": "H02", "title": "月亮邮局", "theme": "童话", "paras": ["在云朵上面，有一座月亮邮局。邮局长是一只银色的猫头鹰，它负责把孩子们的梦送到天上，再把星星的祝福送回人间。", "可是最近，猫头鹰局长很烦恼。因为地上有个叫小豆的女孩，每天晚上都寄来同一个梦：「我想要妈妈早点下班回家。」小豆的妈妈在很远的城市工作，一个月才能回来一次。", "猫头鹰局长翻遍了邮局的规则手册，也没有找到「把妈妈变回家」这种魔法。它想了想，给小豆回了一封信：「亲爱的小豆，月亮不能替你留住妈妈，但我可以帮你把想念变成星星。你每想妈妈一次，就往窗外看一眼，那颗最亮的星星就是妈妈也在想你的证据。」", "从那以后，小豆每天睡前都会看看窗外最亮的星星。她还在作业本上画了一颗星星，旁边写着：「妈妈，我今天自己系好了鞋带。」渐渐地，小豆学会了做饭、洗衣服、照顾生病的奶奶。她的梦不再是「妈妈快回来」，而是「妈妈，我又长大了」。", "年底，妈妈回家探亲，看到墙上贴满了小豆的奖状和画，眼睛湿润了。而月亮邮局里，猫头鹰局长把小豆的故事编进了《星星周刊》的头条，题目就叫：有一种想念，会让人长大。"], "collectWords": ["邮局", "烦恼", "想念", "湿润", "渐渐", "长大"], "quiz": [{"q": "小豆最初的梦是什么？", "opts": ["想要很多玩具", "想要妈妈早点下班回家", "想要飞到月亮上去"], "ans": 1, "why": "原文说小豆每天寄同一个梦「我想要妈妈早点下班回家」。"}, {"q": "猫头鹰局长是怎么帮助小豆的？", "opts": ["用魔法把妈妈变回家", "让小豆搬到月亮上住", "告诉她最亮的星星是妈妈想念她的证据"], "ans": 2, "why": "猫头鹰回信说「那颗最亮的星星就是妈妈也在想你的证据」。"}, {"q": "小豆后来的梦为什么变了？", "opts": ["她不想妈妈了", "她在想念中学会了独立和成长", "她忘记了妈妈"], "ans": 1, "why": "小豆学会做饭洗衣照顾奶奶，梦变成了「妈妈，我又长大了」。"}, {"q": "「有一种想念，会让人长大」这句话的含义是什么？", "opts": ["想念别人没有用", "想念可以转化为让自己变好的力量", "长大了就不会想念"], "ans": 1, "why": "小豆把想念变成进步的动力，这就是长大的含义。"}]}, {"id": "H03", "title": "丢失颜色的彩虹", "theme": "童话", "paras": ["彩虹姐姐有七条漂亮的颜色围巾：红、橙、黄、绿、青、蓝、紫。每天傍晚，她就披着围巾在天空中散步，地上的人们看到她，都会露出笑容。", "可是有一天，彩虹姐姐醒来，发现围巾上的颜色全都不见了，只剩下灰蒙蒙的一片。她着急地哭了起来。住在她隔壁的太阳公公说：「别急，颜色不是丢了，是你太久没有关心它们，它们躲起来了。你得一个一个把它们找回来。」", "彩虹姐姐先来到苹果园。红苹果们说：「红色躲在我们这里呢！你以前总夸苹果甜，红色听得高兴，才愿意待在你围巾上。」彩虹姐姐连忙夸奖苹果，红色「嗖」地一下飞回了围巾。接着，她夸奖了橘子、稻谷、小草、天空和大海，橙、黄、绿、青、蓝也一个接一个回来了。", "最后只剩下紫色。彩虹姐姐找遍了花园和山坡，都没有找到。直到她听见一阵微弱的哭声——原来是墙角的牵牛花，它觉得自己太普通，从来没人注意过它。彩虹姐姐轻轻地说：「牵牛花，你的紫色是世界上最安静、最温柔的颜色，我的围巾不能没有你。」紫色听了，红着脸飞回了围巾。", "七条颜色又聚齐了。彩虹姐姐明白了：每一种颜色都需要被看见、被珍惜。就像每个人都有自己的闪光点，再普通的人，也值得一句真诚的夸奖。"], "collectWords": ["围巾", "灰蒙蒙", "微弱", "温柔", "珍惜", "闪光点"], "quiz": [{"q": "彩虹的颜色为什么会消失？", "opts": ["被乌云偷走了", "彩虹太久没有关心它们", "被雨水冲掉了"], "ans": 1, "why": "太阳公公说「你太久没有关心它们，它们躲起来了」。"}, {"q": "紫色躲在哪里？", "opts": ["苹果园里", "葡萄架上", "墙角的牵牛花那里"], "ans": 2, "why": "彩虹在墙角的牵牛花那里听到了哭声，找到了紫色。"}, {"q": "牵牛花为什么哭？", "opts": ["它觉得自己太普通，没人注意", "它口渴了", "它被风吹疼了"], "ans": 0, "why": "原文说牵牛花「觉得自己太普通，从来没人注意过它」。"}, {"q": "这个故事想告诉我们什么？", "opts": ["彩虹有七种颜色", "再普通的人也有自己的闪光点，值得被看见和珍惜", "牵牛花是最美的花"], "ans": 1, "why": "结尾点明「再普通的人，也值得一句真诚的夸奖」。"}]}, {"id": "H04", "title": "补星星的小裁缝", "theme": "童话", "paras": ["夜空中有一颗小星星掉了一个角，光芒变得暗淡。星星们都很着急，因为每颗星星的光，都会照进一个孩子的梦里。", "地上有个小裁缝，叫米娅，她的眼睛特别亮，能看见夜空最细微的变化。她发现了那颗缺角的星星，连夜用金线和月光布缝了一块小小的补丁。可是补丁怎么送上天呢？米娅爬上最高的钟楼，把补丁绑在一千只萤火虫的翅膀上。萤火虫们排着队，像一条发光的小河，把补丁送到了星星身边。", "星星补好了角，重新亮了起来。为了感谢米娅，它每晚都在她窗前多停留一会儿。米娅也因此成为最有名的裁缝，人们都说她做的衣服带着星光。", "有人问米娅成功的秘诀，她说：「我不过是看见了别人没看见的东西，又做了别人没去做的事。」"], "collectWords": ["暗淡", "细微", "连夜", "秘诀", "光芒", "停留"], "quiz": [{"q": "小星星的光为什么会照进孩子的梦里？", "opts": ["星星喜欢孩子", "每颗星星的光都会照进一个孩子的梦里", "星星会唱歌"], "ans": 1, "why": "第一段原文说明。"}, {"q": "米娅用什么办法把补丁送上夜空？", "opts": ["绑在风筝上", "绑在一千只萤火虫的翅膀上", "用弹弓射上去"], "ans": 1, "why": "原文说补丁绑在萤火虫翅膀上，排成发光的小河送上天。"}, {"q": "米娅成功的秘诀是什么？", "opts": ["她有魔法金线", "看见别人没看见的，做别人没去做的", "她住在钟楼里"], "ans": 1, "why": "结尾米娅的原话。"}, {"q": "这个故事告诉我们什么？", "opts": ["星星也需要缝补", "善于发现并付诸行动，就能做成别人做不到的事", "裁缝都能补星星"], "ans": 1, "why": "故事通过米娅的行动说明发现+行动的重要。"}]}, {"id": "H05", "title": "爱迟到的雪孩子", "theme": "童话", "paras": ["雪孩子每年冬天都要去北方旅行，给孩子们带去雪人和冰凌。可是这一年，他迟到了整整一个月。北方的孩子们等啊等，屋檐上连一根冰凌都没有。", "原来，雪孩子在路上遇到了南方的榕树爷爷。榕树爷爷从来没见过雪，叶子都羡慕得发抖。雪孩子心一软，就在南方停留了很久，给榕树爷爷讲雪的样子，还用仅有的一点雪末，给榕树爷爷的叶子镶了一道银边。", "等雪孩子赶到北方，春天都快来了。孩子们有点生气：「你怎么才来呀？」雪孩子不好意思地讲了路上的事。孩子们听完，不但不生气了，还鼓起掌来：「你把雪分给了没见过雪的人，这比堆雪人更了不起！」", "那天晚上，北方下了一场不大不小的雪。孩子们堆了一个小小的雪人，给它取名「榕树」。他们说，要把没见过雪的朋友，永远记在心里。"], "collectWords": ["迟到", "羡慕", "银边", "了不起", "旅行"], "quiz": [{"q": "雪孩子为什么迟到了一个月？", "opts": ["他在路上睡着了", "他在南方陪没见过雪的榕树爷爷", "他迷路了"], "ans": 1, "why": "原文说他给榕树爷爷讲雪、镶银边，停留了很久。"}, {"q": "孩子们听完原因后为什么鼓掌？", "opts": ["雪孩子终于来了", "他们认为把雪分给没见过雪的人更了不起", "他们可以不上学了"], "ans": 1, "why": "孩子们说「这比堆雪人更了不起」。"}, {"q": "孩子们给雪人取名「榕树」，表达了什么？", "opts": ["他们喜欢榕树这种树", "把没见过雪的朋友记在心里", "雪人长得像榕树"], "ans": 1, "why": "原文说「要把没见过雪的朋友，永远记在心里」。"}, {"q": "这个故事告诉我们什么？", "opts": ["做事不能迟到", "善意和分享比守规矩更珍贵", "南方不会下雪"], "ans": 1, "why": "雪孩子的迟到源于善意分享，得到了理解。"}]}, {"id": "H06", "title": "蜗牛的快递公司", "theme": "童话", "paras": ["森林里的动物们都嘲笑蜗牛慢慢：「你爬得这么慢，连邮件都送不了！」慢慢听了不生气，反而开了一家「蜗牛快递公司」。", "开业第一天，兔子蹦蹦跳跳来寄信：「帮我把信送给山那边的刺猬，明天就要到！」慢慢摇摇头：「我送不了那么快，但我保证，信到我手里，一个字都不会少，一片叶子都不会压坏。」兔子半信半疑地把信交给了他。", "慢慢上路了。他走得很慢，但他认得每一条路，知道哪片草丛有露水会打湿信纸，哪段树根会绊脚。他用十天时间，把信完完整整地送到了刺猬手里。信里夹着的花瓣，还和出发时一样新鲜。", "渐渐地，动物们发现了慢慢的好处：急件找兔子，重要的、易碎的、需要用心对待的东西，都找慢慢。有人说：「快有快的用处，慢有慢的价值。」慢慢的快递公司，成了森林里最令人安心的公司。"], "collectWords": ["嘲笑", "半信半疑", "完整", "安心", "价值", "渐渐"], "quiz": [{"q": "动物们一开始为什么嘲笑慢慢？", "opts": ["他爬得太慢，不像能送邮件的样子", "他的公司名字难听", "他的信太贵"], "ans": 0, "why": "第一段动物们嘲笑他爬得慢送不了邮件。"}, {"q": "慢慢送信用了十天，为什么刺猬没有抱怨？", "opts": ["刺猬不在家", "信和花瓣都完好新鲜，值得等待", "刺猬不知道信寄出了"], "ans": 1, "why": "原文说信完整送到，花瓣还和出发时一样新鲜。"}, {"q": "「快有快的用处，慢有慢的价值」是什么意思？", "opts": ["快比慢好", "不同特点各有适合的用途", "慢比快好"], "ans": 1, "why": "急件找兔子，重要的找慢慢，说明各有价值。"}, {"q": "这个故事告诉我们什么？", "opts": ["做事一定要快", "不要因为自己的特点不如别人就自卑，找到适合自己的位置就能发光", "开快递公司很赚钱"], "ans": 1, "why": "慢慢把「慢」变成了可靠的优势。"}]}, {"id": "H07", "title": "影子剧院", "theme": "童话", "paras": ["小男孩安安有一个秘密：他的影子会演戏。每天晚上台灯一亮，他的影子就在墙上变来变去，一会儿是展翅的老鹰，一会儿是摇尾巴的小狗。", "可是安安很胆小，从不敢在人前表演。班里的联欢会要出节目，安安躲得远远的。他的影子急了，晚上在墙上对他说：「你不敢上台，是因为怕自己演不好。可是你知道吗？老鹰的翅膀也是练了很多次才展开的。」", "安安决定试一试。他每天对着墙练习，影子就一遍一遍陪他纠正动作。联欢会那天，安安关了大灯，只留一盏台灯。墙上，老鹰展翅、骏马奔跑、巨龙腾空，同学们看得目瞪口呆，掌声像雨点一样落下来。", "演出结束后，安安对着自己的影子鞠了一躬。从那以后他明白：勇气不是不害怕，而是带着害怕，还愿意一遍一遍地练习。"], "collectWords": ["秘密", "胆小", "纠正", "目瞪口呆", "勇气", "练习"], "quiz": [{"q": "安安的影子有什么特别之处？", "opts": ["会变魔术偷东西", "会在墙上表演各种形象", "会离开安安自己跑"], "ans": 1, "why": "原文说影子在墙上变老鹰、小狗等形象。"}, {"q": "安安一开始为什么不敢参加联欢会？", "opts": ["他不喜欢表演", "他怕自己演不好", "他生病了"], "ans": 1, "why": "影子说「你不敢上台，是因为怕自己演不好」。"}, {"q": "「掌声像雨点一样落下来」用了什么修辞手法？", "opts": ["比喻", "拟人", "排比"], "ans": 0, "why": "把掌声比作雨点，是比喻。"}, {"q": "这个故事告诉我们勇气是什么？", "opts": ["不害怕任何事", "带着害怕还愿意一遍遍练习", "上台表演"], "ans": 1, "why": "结尾原句点明。"}]}, {"id": "H08", "title": "风的图书馆", "theme": "童话", "paras": ["风有一个图书馆，里面没有一本书，却收藏着全世界的声音：清晨的鸟叫、海边的浪声、奶奶摇扇子的风声、翻书页的沙沙声。", "有个小女孩圆圆，耳朵听不清，世界对她来说是安静的。风很难过，决定为圆圆办一场「特别的借阅」。它把声音们召集起来：「我们不能让她听见，但可以让她看见、摸到、感受到。」", "第二天，风吹动圆圆窗前的风铃，圆圆虽然听不见铃声，却看见阳光里风铃在跳舞；风把蒲公英的种子吹到她的手心，痒痒的，圆圆笑了；风又掀动画室里的画纸，圆圆拿起笔，把心里「听见」的声音全画了下来：鸟叫是蓝色的，浪声是白色的，翻书声是温暖的黄色。", "圆圆的画在学校展览，名字叫《我听见的世界》。看画的人都说：「原来声音不只住在耳朵里，也住在眼睛里、手心里、心里。」"], "collectWords": ["收藏", "借阅", "召集", "温暖", "展览", "感受"], "quiz": [{"q": "风的图书馆里收藏的是什么？", "opts": ["很多书", "全世界的声音", "各种风"], "ans": 1, "why": "原文说「没有一本书，却收藏着全世界的声音」。"}, {"q": "风是怎样帮助听不见的圆圆的？", "opts": ["治好她的耳朵", "让她看见、摸到、感受到声音", "送她一个助听器"], "ans": 1, "why": "风召集声音们决定「让她看见、摸到、感受到」。"}, {"q": "圆圆把「翻书声」画成了什么颜色？", "opts": ["蓝色", "白色", "温暖的黄色"], "ans": 2, "why": "原文「翻书声是温暖的黄色」。"}, {"q": "「声音不只住在耳朵里，也住在眼睛里、手心里、心里」这句话让你体会到什么？", "opts": ["耳朵不重要", "感受世界的方式有很多种，用心就能体会美好", "圆圆的画很奇怪"], "ans": 1, "why": "圆圆通过看、摸、画感受到了声音。"}]}, {"id": "H09", "title": "沙漠里的最后一滴水", "theme": "童话", "paras": ["一片沙漠快渴死了。它的沙粒一天比一天干裂，连最后一条蜥蜴都搬走了。沙漠里只剩下一滴水，藏在仙人掌的根部。", "这滴水很害怕。它知道，只要自己一出来，就会被太阳喝掉。仙人掌对它说：「你躲在这里，能保住自己；可是你如果肯出来，也许能救活一粒种子。」水滴问：「一粒种子有什么用呢？」仙人掌说：「一粒种子可以长成一株植物，一株植物可以留住更多雨水，更多雨水能让沙漠重新变绿。」", "水滴想了很久。一天夜里，它顺着仙人掌的根，慢慢渗进沙土，找到了那粒沉睡多年的种子。种子喝到了水，裂开外壳，探出嫩芽。嫩芽的根越扎越深，居然找到了一条地下暗河。", "几年后，这片沙漠长出了一小片绿洲。蜥蜴搬回来了，鸟儿也飞来了。没有人记得那滴水，但每一株植物都知道：是那一滴水的勇气，换来了整片绿洲。"], "collectWords": ["干裂", "沉睡", "嫩芽", "绿洲", "勇气", "渗进"], "quiz": [{"q": "沙漠里最后的一滴水藏在哪里？", "opts": ["沙粒下面", "仙人掌的根部", "蜥蜴洞里"], "ans": 1, "why": "原文「藏在仙人掌的根部」。"}, {"q": "仙人掌劝水滴出来时，说了什么道理？", "opts": ["出来会死得很惨", "一滴水能救种子，种子能带来更多改变", "太阳很可怕"], "ans": 1, "why": "仙人掌说种子长成植物能留住雨水让沙漠变绿。"}, {"q": "「裂开外壳，探出嫩芽」写出了种子怎样的变化？", "opts": ["死亡", "苏醒生长", "枯萎"], "ans": 1, "why": "种子喝水后发芽生长。"}, {"q": "这个故事告诉我们什么？", "opts": ["沙漠里没有水", "小小的奉献也能带来巨大的改变", "仙人掌会说话"], "ans": 1, "why": "一滴水的勇气换来整片绿洲。"}]}, {"id": "H10", "title": "会数数的山羊", "theme": "童话", "paras": ["山羊爷爷是牧场里最会数数的动物。每天傍晚，他都要把小羊们一只一只数清楚才放心回家。", "有一天，山羊爷爷数来数去都是九只，少了最小的雪团。山羊爷爷急得团团转，沿着牧场找了半天，最后在小河边找到了雪团。雪团正对着水面发呆：「爷爷，水里的那只小羊是谁？它为什么一直跟着我？」山羊爷爷笑了：「那是你的倒影呀！水像镜子一样，把你照出来了。」", "雪团又问：「那镜子里也有另一个我吗？」山羊爷爷带他回家照镜子，雪团对着镜子做鬼脸，镜子里的雪团也做鬼脸，把大家逗得哈哈大笑。", "回家的路上，山羊爷爷说：「孩子，世界上有很多奇妙的现象，倒影、影子、回声……只要你肯问为什么，肯去找答案，每一天都能学到新东西。」雪团记住了这句话，后来他成了牧场里最爱问为什么的小羊。"], "collectWords": ["倒影", "奇妙", "鬼脸", "现象", "放心", "答案"], "quiz": [{"q": "山羊爷爷为什么急得团团转？", "opts": ["他数不清羊", "最小的雪团不见了", "天要下雨了"], "ans": 1, "why": "数来数去少了雪团，山羊爷爷着急寻找。"}, {"q": "雪团在水边发现的「另一只小羊」是什么？", "opts": ["新来的小羊", "他自己的倒影", "一只白羊"], "ans": 1, "why": "山羊爷爷解释那是倒影，水像镜子。"}, {"q": "雪团后来成了怎样的小羊？", "opts": ["最爱睡觉的", "最爱问为什么的", "跑得最快的"], "ans": 1, "why": "结尾说他成了最爱问为什么的小羊。"}, {"q": "这个故事告诉我们什么？", "opts": ["山羊都会数数", "遇到不懂的现象要敢于提问、寻找答案", "不能在河边玩"], "ans": 1, "why": "山羊爷爷的话点明主旨：肯问肯找答案就能学到新东西。"}]}, {"id": "H11", "title": "扫帚星的好运气", "theme": "童话", "paras": ["天上有一颗小彗星，拖着长长的尾巴，大家都叫他「扫帚星」。传说中，扫帚星出现就会有坏运气，所以谁也不喜欢他。扫帚星很伤心，越飞越远。", "飞着飞着，他来到了一个缺水的小村庄上空。村里晒得冒火的土地上，孩子们正抬着木桶去很远的地方打水。扫帚星看着心疼，想起自己的尾巴里藏着很多宇宙尘埃和冰粒。他使劲一抖尾巴，冰粒化成雨点落了下来，村庄下了一场及时雨。", "村民们又惊又喜。庄稼喝饱了水，挺直了腰。孩子们仰着头喊：「谢谢你，带来雨水的星星！」扫帚星第一次觉得，自己的尾巴原来这么有用。", "从那以后，扫帚星每到干旱的地方，就抖一抖尾巴。人们不再叫他扫帚星，而是叫他「及时雨星」。他明白了：别人怎么说你不重要，重要的是你用自己的力量做了什么。"], "collectWords": ["传说", "伤心", "及时雨", "干旱", "力量", "惊又喜"], "quiz": [{"q": "大家为什么不喜欢扫帚星？", "opts": ["他飞得太快", "传说他出现就有坏运气", "他的尾巴太脏"], "ans": 1, "why": "第一段说传说扫帚星出现会有坏运气。"}, {"q": "扫帚星怎么帮助了缺水的村庄？", "opts": ["带村民找到了水井", "抖尾巴让冰粒化成雨点落下", "把云推到村庄上空"], "ans": 1, "why": "原文说他抖尾巴，冰粒化成雨点。"}, {"q": "人们后来为什么改叫他「及时雨星」？", "opts": ["他的名字好听", "他总给干旱的地方带来雨水", "他喜欢下雨"], "ans": 1, "why": "他每到干旱处就抖尾巴下雨。"}, {"q": "这个故事告诉我们什么？", "opts": ["彗星会下雨", "别人怎么评价不重要，重要的是自己做了什么", "扫帚星是坏星星"], "ans": 1, "why": "结尾点明：别人怎么说不重要，重要的是你用自己的力量做了什么。"}]}, {"id": "H12", "title": "丢失的鼓点", "theme": "童话", "paras": ["森林鼓队的小猴闹闹，总是敲不对鼓点，不是快半拍就是慢半拍。队长老象说：「鼓点就像队伍的心跳，你乱了，大家就乱了。」闹闹很羞愧，偷偷离开了鼓队。", "回家的路上，闹闹听见啄木鸟「笃、笃、笃」地敲树干，不快不慢，特别稳。他停下来听了一下午，忽然明白了：原来节奏不是用力敲，而是用心听。", "从那以后，闹闹每天跟着啄木鸟、雨点、溪水的声音练节奏。他的手心磨出了茧，鼓点却越来越稳。三个月后，鼓队比赛缺人，老象找到了闹闹。这一次，闹闹的鼓点稳稳地托住了整个队伍，他们得了第一名。", "领奖时，老象问闹闹有什么感想。闹闹挠挠头说：「以前我总想敲得比别人响，现在我知道了，敲得稳，比敲得响更重要。」"], "collectWords": ["羞愧", "节奏", "感想", "鼓点", "托住"], "quiz": [{"q": "闹闹为什么离开鼓队？", "opts": ["他不喜欢打鼓", "他总敲错鼓点，感到羞愧", "老象开除了他"], "ans": 1, "why": "原文说他敲不对鼓点，「很羞愧，偷偷离开了」。"}, {"q": "闹闹从啄木鸟那里明白了什么？", "opts": ["敲鼓要更用力", "节奏不是用力敲，而是用心听", "树干比鼓好听"], "ans": 1, "why": "原文「原来节奏不是用力敲，而是用心听」。"}, {"q": "闹闹成功的关键是什么？", "opts": ["换了一面好鼓", "刻苦练习，把鼓点练稳", "比赛运气好"], "ans": 1, "why": "他每天跟着自然声音练节奏，手心磨出茧。"}, {"q": "「敲得稳，比敲得响更重要」告诉我们什么？", "opts": ["打鼓不用力", "扎实的基本功比表面的热闹更重要", "响鼓不好听"], "ans": 1, "why": "闹闹从追求响到追求稳，说明扎实比花哨重要。"}]}, {"id": "H13", "title": "玻璃海上的灯塔", "theme": "童话", "paras": ["大海深处有一座玻璃海，海水平静得像一面镜子。镜子中央立着一座灯塔，灯塔里住着守塔人阿海爷爷。", "玻璃海太平静了，十年都没有一艘船迷路。年轻的渔夫们说：「这座灯塔没用了，拆掉吧！」阿海爷爷只是摇摇头，每天黄昏还是准时点亮灯。他说：「平静的时候，灯塔是多余的；可是风暴来的时候，它就是命。」", "这年冬天，一场百年不遇的风暴突然来了。巨浪像山一样扑过来，三条渔船在海上打转，找不到回家的方向。就在大家绝望的时候，一道光穿透了暴风雨——是灯塔！阿海爷爷顶着大风，把灯拧到最亮。三条船顺着灯光，一前一后回到了港口。", "第二天，人们围着灯塔，谁也不再提拆塔的事。年轻的渔夫红着脸说：「爷爷，我们懂了，有些东西平时看着没用，是因为它一直在替我们挡着危险。」"], "collectWords": ["平静", "风暴", "绝望", "准时", "危险", "红着脸"], "quiz": [{"q": "年轻渔夫为什么想拆灯塔？", "opts": ["灯塔太旧了", "玻璃海十年没船迷路，他们觉得灯塔没用", "灯塔挡住了路"], "ans": 1, "why": "原文「十年都没有一艘船迷路」，渔夫觉得没用。"}, {"q": "阿海爷爷为什么坚持每天点灯？", "opts": ["他喜欢灯光", "他知道风暴来临时灯塔能救命", "点灯是他的工作习惯"], "ans": 1, "why": "爷爷说「风暴来的时候，它就是命」。"}, {"q": "三条渔船最后是怎么回到港口的？", "opts": ["风暴自己停了", "顺着灯塔的光", "凭渔夫的经验"], "ans": 1, "why": "原文说三条船顺着灯光回到港口。"}, {"q": "这个故事告诉我们什么？", "opts": ["灯塔很漂亮", "有些看似多余的东西，其实在默默守护我们", "渔民不该出海"], "ans": 1, "why": "结尾渔夫的话点明：看似没用的东西在替我们挡危险。"}]}, {"id": "H14", "title": "蘑菇伞下的约定", "theme": "童话", "paras": ["小蚂蚁粒粒在森林里迷了路，天又下起了大雨。他正着急，发现一朵大蘑菇像伞一样撑开着。粒粒钻进蘑菇伞下，发现里面已经躲着一只小瓢虫和一只小蚂蚱。", "三个小伙伴挤在一起。小瓢虫说：「雨停了，我就回家。」小蚂蚱说：「我家就在前面草丛。」粒粒叹了口气：「我家在很远的大树下，我一个人不敢回去。」蘑菇伞轻轻晃了晃，原来蘑菇也会说话：「别怕，我可以帮你们。」", "蘑菇让粒粒把一根细线系在自己身上，另一头系在粒粒家的方向——那是蚂蚁路上留下的气味线。雨停后，蘑菇请风婆婆帮忙，顺着气味线，把粒粒一路送回了家。", "分别时，三个小伙伴约定：明年雨季，还到蘑菇伞下见面。后来每年夏天，森林里多了一个节日——「蘑菇伞节」，小动物们都来分享自己帮助别人的故事。"], "collectWords": ["约定", "气味", "分享", "节日", "帮助"], "quiz": [{"q": "粒粒在蘑菇伞下遇到了谁？", "opts": ["小兔和小鸟", "小瓢虫和小蚂蚱", "小松鼠"], "ans": 1, "why": "原文说蘑菇伞下已有小瓢虫和小蚂蚱。"}, {"q": "蘑菇是怎么帮助粒粒回家的？", "opts": ["背着他走", "顺着蚂蚁的气味线请风送他", "给他画地图"], "ans": 1, "why": "蘑菇让粒粒系气味线，雨停后请风婆婆送他回家。"}, {"q": "三个小伙伴的约定是什么？", "opts": ["一起找食物", "明年雨季还到蘑菇伞下见面", "一起搬家"], "ans": 1, "why": "原文「约定：明年雨季，还到蘑菇伞下见面」。"}, {"q": "「蘑菇伞节」是一个分享什么的节日？", "opts": ["蘑菇", "自己帮助别人的故事", "雨伞"], "ans": 1, "why": "结尾说小动物们来分享帮助别人的故事。"}]}, {"id": "H15", "title": "不睡觉的夜来香", "theme": "童话", "paras": ["花园里，别的花都在白天开放，只有夜来香总在夜里悄悄绽放。小蜜蜂不理解：「白天阳光多好，你为什么夜里开呢？夜里又没有蜜蜂蝴蝶来陪你。」", "夜来香轻轻地说：「你看那边的小楼。」小蜜蜂一看，楼里有一位上夜班的护士阿姨，每天深夜才回家。阿姨推开窗，闻到夜来香的香味，疲惫的脸上就露出笑容。夜来香说：「白天有很多花陪大家，可是夜里，总得有一朵花醒着，陪陪晚归的人。」", "小蜜蜂听了，心里很感动。第二天，他把这件事告诉了蝴蝶、蜻蜓和所有的小伙伴。", "从那以后，每到夜晚，花园里的小动物们都不吵不闹，让夜来香安安静静地开放。而夜来香的香味，也陪着一位又一位晚归的人，走过了一段又一段安静的路。"], "collectWords": ["绽放", "疲惫", "感动", "安静", "夜班"], "quiz": [{"q": "夜来香为什么在夜里开放？", "opts": ["它怕太阳", "它想在夜里陪伴晚归的人", "它白天睡觉"], "ans": 1, "why": "夜来香说「夜里，总得有一朵花醒着，陪陪晚归的人」。"}, {"q": "护士阿姨闻到花香后有什么变化？", "opts": ["立刻睡着了", "疲惫的脸上露出笑容", "开始唱歌"], "ans": 1, "why": "原文「疲惫的脸上就露出笑容」。"}, {"q": "小动物们知道夜来香的故事后怎么做？", "opts": ["夜里开派对", "夜晚不吵不闹让它安静开放", "给它浇水"], "ans": 1, "why": "原文「不吵不闹，让夜来香安安静静地开放」。"}, {"q": "这个故事赞美了怎样的品质？", "opts": ["夜里开花很特别", "默默付出、为别人着想的品质", "花的香味很浓"], "ans": 1, "why": "夜来香选择在没人注意的夜里陪伴他人。"}]}, {"id": "H16", "title": "狐狸和葡萄（新编）", "theme": "寓言", "paras": ["一只狐狸路过葡萄园，看见架上挂着一串串紫红的葡萄，馋得直咽口水。他跳起来摘，够不着；退后几步再跳，还是够不着。折腾了半天，一颗葡萄也没吃到。", "狐狸擦擦汗，自我安慰说：「这些葡萄肯定是酸的，送给我也不吃！」说完，昂着头走了。树上的麻雀听见了，笑道：「你尝都没尝，怎么知道是酸的？」", "狐狸脸一红，停下了脚步。他想了想，搬来一块石头垫在脚下，又请路过的山羊帮忙托了一把，终于摘到了葡萄。咬一口，甜极了。", "狐狸不好意思地对麻雀说：「你说得对。得不到就贬低它，是在骗自己。真正聪明的办法，是承认自己够不着，然后想办法。」"], "collectWords": ["葡萄园", "自我安慰", "贬低", "折腾", "承认", "想办法"], "quiz": [{"q": "狐狸一开始为什么说葡萄是酸的？", "opts": ["葡萄真的酸", "他摘不到，用酸来安慰自己", "他闻到了酸味"], "ans": 1, "why": "狐狸摘不到葡萄，用「肯定是酸的」自我安慰。"}, {"q": "麻雀的话让狐狸明白了什么？", "opts": ["葡萄架很高", "没尝过就说酸是在骗自己", "麻雀想吃葡萄"], "ans": 1, "why": "狐狸承认「得不到就贬低它，是在骗自己」。"}, {"q": "狐狸最后怎么摘到葡萄的？", "opts": ["爬上树", "垫石头并请山羊帮忙", "等葡萄掉下来"], "ans": 1, "why": "原文「搬来一块石头垫在脚下，又请路过的山羊帮忙」。"}, {"q": "这个寓言告诉我们什么？", "opts": ["葡萄都很甜", "做不到就找借口不如承认不足再想办法", "狐狸很聪明"], "ans": 1, "why": "结尾狐狸的话点明道理。"}]}, {"id": "H17", "title": "井底之蛙（新编）", "theme": "寓言", "paras": ["一口古井里住着一只青蛙，他每天都骄傲地对井沿的蜗牛说：「我的世界又大又好，井壁上有清凉的泉水，抬头就能看到天，天也就井口这么大。」", "一天，一只从海边来的海龟路过井边。青蛙问：「大海有我的井大吗？」海龟想了想，说：「大海辽阔得望不到边，浪头比你的井还高。你在井里看到的天，只是天的很小一块。」", "青蛙不服气，奋力往上一跳，跳出了井口。他看到了无边无际的田野、高高的山峰，还有大得吓人的天空。青蛙愣了半天，红着脸对海龟说：「原来不是天只有井口大，是我一直待在井里。」", "海龟笑了：「待在井里不丢人，丢人的是待在井里还以为看见了全世界。」青蛙决定跟着海龟去旅行，去看更大的世界。"], "collectWords": ["骄傲", "辽阔", "无边无际", "奋力", "旅行"], "quiz": [{"q": "青蛙为什么觉得天只有井口大？", "opts": ["天真的很小", "他一直待在井里，只能看到井口大的天", "他在骗蜗牛"], "ans": 1, "why": "青蛙一直待在井里，抬头只能看到井口大的天空。"}, {"q": "海龟告诉青蛙大海是什么样的？", "opts": ["和井一样大", "辽阔得望不到边", "比井小"], "ans": 1, "why": "海龟说大海「辽阔得望不到边」。"}, {"q": "青蛙跳出井口后明白了什么？", "opts": ["井里更舒服", "不是天小，是自己一直待在井里", "海龟在吹牛"], "ans": 1, "why": "青蛙说「原来不是天只有井口大，是我一直待在井里」。"}, {"q": "海龟最后那句话是什么意思？", "opts": ["井底很好", "眼界小不可怕，可怕的是眼界小还自以为是", "青蛙不该旅行"], "ans": 1, "why": "海龟指出问题不在待在井里，而在以为看见了全世界。"}]}, {"id": "H18", "title": "拔苗助长（新编）", "theme": "寓言", "paras": ["宋国有个农夫，性子特别急。他天天跑到田边，看自己的禾苗有没有长高。可是禾苗好像一点也不着急，今天和昨天差不多高。", "农夫越看越急，心想：「我帮帮它们吧！」于是他从早忙到晚，把每一棵禾苗都往上拔高了一截。看着田里「长高」的禾苗，农夫满意地回家了，还对家人说：「今天可把我累坏了，我帮禾苗长高了一大截！」", "他的儿子听了，赶紧跑到田里去看——禾苗全都蔫了，一棵棵耷拉着脑袋，快要枯死了。", "农夫这才知道自己做了蠢事。邻居对他说：「禾苗有禾苗的生长规律，浇水、施肥、除草，样样都要做到，可是急不得。你想替它们长高，反而害了它们。」农夫牢牢记住了这个教训。"], "collectWords": ["规律", "满意", "蔫了", "教训", "禾苗"], "quiz": [{"q": "农夫为什么要把禾苗往上拔？", "opts": ["禾苗生病了", "他嫌禾苗长得慢，想帮它们长高", "他在除草"], "ans": 1, "why": "农夫性子急，嫌禾苗长得慢，想帮忙。"}, {"q": "禾苗被拔之后怎么样了？", "opts": ["长得更高了", "全都蔫了，快要枯死", "和原来一样"], "ans": 1, "why": "原文「禾苗全都蔫了……快要枯死了」。"}, {"q": "「耷拉着脑袋」用了什么写法，写出了禾苗什么状态？", "opts": ["拟人，写出禾苗枯萎没精神", "比喻，写出禾苗很重", "夸张，写出禾苗很高"], "ans": 0, "why": "把禾苗当作人来写（耷拉脑袋），是拟人。"}, {"q": "这个故事告诉我们什么？", "opts": ["种田很辛苦", "做事要尊重规律，急于求成反而坏事", "要多帮助植物"], "ans": 1, "why": "邻居的话点明：生长有规律，急不得。"}]}, {"id": "H19", "title": "画蛇添足（新编）", "theme": "寓言", "paras": ["楚国有一户人家祭祀祖先，赏给帮忙的门客们一壶酒。门客们商量：「这壶酒一个人喝正好，几个人分着喝不过瘾。不如大家比赛画蛇，谁先画好，酒就归谁。」", "大家都同意了。有个人画得最快，一转眼就把蛇画好了。他得意地拿起酒壶，正准备喝，看见别人还在一笔一笔地画，心想：「我还有的是时间，给蛇再添上几只脚，显得我画技更高！」", "他左手举着酒壶，右手给蛇画脚。脚还没画完，另一个人已经画好了，一把抢过酒壶说：「蛇本来就没有脚，你画的不是蛇！这酒该归我。」说完仰起头，把酒喝了个精光。", "画蛇的人愣在原地，后悔极了。旁观的人说：「事情做好了就该停手，多此一举，反而把到手的东西弄丢了。」"], "collectWords": ["祭祀", "商量", "得意", "多此一举", "后悔", "画技"], "quiz": [{"q": "门客们用什么办法决定酒归谁？", "opts": ["猜拳", "谁先画好蛇酒归谁", "轮流喝"], "ans": 1, "why": "原文「谁先画好，酒就归谁」。"}, {"q": "画得最快的人为什么反而没喝到酒？", "opts": ["他画得不像", "他画完又添了蛇脚，被别人抢先", "他把酒打翻了"], "ans": 1, "why": "他给蛇画脚时，别人画好了并抢走了酒。"}, {"q": "「蛇本来就没有脚，你画的不是蛇」这句话说明什么？", "opts": ["蛇没有脚", "画蛇添脚违背事实，等于白画", "那人不懂画"], "ans": 1, "why": "添脚后画的不再是蛇，所以输了。"}, {"q": "这个寓言告诉我们什么？", "opts": ["画画要快", "事情做好了就该停手，多此一举反而坏事", "比赛要抢"], "ans": 1, "why": "结尾点明「多此一举，反而把到手的东西弄丢了」。"}]}, {"id": "H20", "title": "亡羊补牢（新编）", "theme": "寓言", "paras": ["从前有个人养了一圈羊。一天早上，他发现羊少了一只，仔细一看，羊圈破了一个大窟窿，准是夜里狼钻进来叼走了羊。", "邻居劝他：「快把窟窿堵上吧！」他却满不在乎：「羊都已经丢了，补圈有什么用呢？」第二天，他发现又少了一只羊——狼还是从那个窟窿钻进来的。", "这回他后悔了，赶紧找来木板和锤子，把羊圈的窟窿堵得严严实实，还把整个羊圈都加固了一遍。从那以后，他的羊再也没有丢过。", "邻居对他说：「出了问题及时补救，还不算晚；怕的是明明知道有问题，却装作没看见。」他连连点头。后来村里谁家遇到麻烦，都会想起这句话：窟窿要趁早补。"], "collectWords": ["窟窿", "满不在乎", "补救", "加固", "严严实实"], "quiz": [{"q": "羊为什么会丢？", "opts": ["羊自己跑了", "羊圈破了窟窿，狼钻进来叼走了", "被偷走了"], "ans": 1, "why": "原文「羊圈破了一个大窟窿，准是夜里狼钻进来叼走了羊」。"}, {"q": "他一开始为什么不补羊圈？", "opts": ["他不会修", "他觉得羊已经丢了，补圈没用", "他没有木板"], "ans": 1, "why": "他说「羊都已经丢了，补圈有什么用呢」。"}, {"q": "「满不在乎」写出了他当时怎样的态度？", "opts": ["很着急", "不把问题当回事", "很伤心"], "ans": 1, "why": "他不听劝告，不把羊圈的窟窿当回事。"}, {"q": "这个故事告诉我们什么？", "opts": ["羊圈要结实", "出了问题及时补救还不算晚，最怕明知有问题却装没看见", "狼很狡猾"], "ans": 1, "why": "邻居的话点明主旨。"}]}, {"id": "H21", "title": "杯弓蛇影（新编）", "theme": "寓言", "paras": ["晋朝有个叫乐广的人，一天请朋友来家里喝酒。朋友端起酒杯，忽然看见杯子里有一条小蛇在游动，心里一阵恶心，可又不好推辞，硬着头皮把酒喝了下去。", "回到家，朋友越想越害怕，总觉得那条蛇在自己肚子里作怪，不久就病倒了。乐广听说后很纳闷，到朋友家探望，才知道是因为酒杯里的「蛇」。", "乐广回家仔细查看，发现墙上挂着一张弓，弓的影子正好映在酒杯里，弯弯曲曲的，活像一条小蛇。他连忙把朋友请来，让他坐在原位，指着杯子问：「你再看，杯子里的蛇是什么？」朋友一看，恍然大悟——原来是弓的影子！", "朋友的病一下子就好了。乐广笑着说：「心里有疑团，就要查个明白。自己吓自己，才是最伤人的。」"], "collectWords": ["恶心", "纳闷", "恍然大悟", "疑团", "作怪"], "quiz": [{"q": "朋友为什么生病？", "opts": ["酒里有毒", "他以为喝下了蛇，吓出病来", "着凉了"], "ans": 1, "why": "朋友总觉得蛇在肚子里作怪，不久就病倒了。"}, {"q": "杯子里的「蛇」其实是什么？", "opts": ["真蛇", "弓的影子", "水草"], "ans": 1, "why": "乐广发现墙上弓的影子映在酒杯里像小蛇。"}, {"q": "「恍然大悟」说明朋友怎样的心情？", "opts": ["更害怕了", "一下子明白了真相", "很生气"], "ans": 1, "why": "恍然就是突然明白的样子。"}, {"q": "这个故事告诉我们什么？", "opts": ["酒杯要干净", "遇到疑虑要查明真相，疑神疑鬼只会伤害自己", "不能挂弓"], "ans": 1, "why": "乐广最后的话点明道理。"}]}, {"id": "H22", "title": "愚公移山（新编）", "theme": "寓言", "paras": ["北山脚下的愚公快九十岁了，家门口挡着太行、王屋两座大山，出门要绕很远的路。他召集全家商量：「我们把这两座山挖走，让门前直通大路，好不好？」家人都赞成，只有妻子担心：「就凭咱们的力气，能挖得动吗？挖下的土石又放到哪里去？」大家说：「土石运到渤海边上！」", "于是，愚公带着子孙们天天挖山，挖下的土石用筐挑到海边，一年才能往返一趟。邻居智叟笑话他：「你都这把年纪了，能挖几天？别白费力气了！」", "愚公长长地叹了口气，说：「我死了有儿子，儿子死了有孙子，子子孙孙没有穷尽；可是山不会再长高，挖一点就少一点，怎么会挖不平呢？」智叟听了，一句话也答不上来。", "愚公一家人挖山不止的精神感动了天帝。天帝派大力神的两个儿子背走了两座山。从此，愚公家门前再也没有大山挡路了。这个故事告诉人们：认准了目标，只要坚持不放弃，再大的困难也能被搬走。"], "collectWords": ["召集", "赞成", "坚持", "感动", "目标"], "quiz": [{"q": "愚公为什么要移走两座大山？", "opts": ["山里有妖怪", "大山挡在家门口，出行要绕远路", "他想种地"], "ans": 1, "why": "原文「家门口挡着太行、王屋两座大山，出门要绕很远的路」。"}, {"q": "智叟为什么笑话愚公？", "opts": ["愚公挖得慢", "他觉得愚公年纪大，挖不完山", "他和愚公有仇"], "ans": 1, "why": "智叟说「你都这把年纪了，能挖几天」。"}, {"q": "愚公用什么理由反驳智叟？", "opts": ["他力气很大", "子孙无穷尽而山不再长高，挖一点少一点", "天帝会帮忙"], "ans": 1, "why": "愚公说子孙无穷尽，山不会再长高。"}, {"q": "这个故事告诉我们什么？", "opts": ["老年人很有力气", "认准目标坚持不放弃，再大的困难也能克服", "神仙会帮助所有人"], "ans": 1, "why": "结尾点明坚持不放弃的精神。"}]}, {"id": "H23", "title": "滥竽充数（新编）", "theme": "寓言", "paras": ["战国时候，齐宣王喜欢听三百人一起吹竽，场面越大越好。南郭先生根本不会吹竽，却混在乐队里，装模作样地鼓着腮帮，照样领赏钱。", "就这样混了好几年，南郭先生过得舒舒服服。可是齐宣王去世后，齐湣王即位。湣王也喜欢听竽，但他喜欢听一个人一个人地独奏。", "消息传来，南郭先生吓得连夜收拾包袱逃跑了。有人问他为什么跑，他只好承认：「混在人堆里还能装装样子，一个一个地吹，我就要露馅了。」", "这件事传开后，人们都说：没有真本事，靠蒙混过日子，总有一天会露馅。与其提心吊胆地混，不如踏踏实实地学。"], "collectWords": ["装模作样", "舒舒服服", "露馅", "蒙混", "踏实", "独奏"], "quiz": [{"q": "南郭先生为什么能混在乐队里好几年？", "opts": ["他吹得很好", "三百人一起吹，看不出他不会", "齐宣王喜欢他"], "ans": 1, "why": "合奏时人多，他的不会吹看不出来。"}, {"q": "南郭先生为什么逃跑？", "opts": ["他想家了", "湣王要听独奏，他会露馅", "赏钱太少了"], "ans": 1, "why": "湣王要一个一个听，他怕露馅所以逃跑。"}, {"q": "「装模作样」在文中指什么？", "opts": ["认真吹竽", "假装吹竽的样子", "整理衣服"], "ans": 1, "why": "南郭先生鼓着腮帮假装吹竽。"}, {"q": "这个寓言告诉我们什么？", "opts": ["吹竽很难学", "没有真本事靠蒙混总有一天会露馅，不如踏实学习", "合奏比独奏好听"], "ans": 1, "why": "结尾点明主旨。"}]}, {"id": "H24", "title": "刻舟求剑（新编）", "theme": "寓言", "paras": ["楚国有个人坐船过江。船到江心，他的宝剑「扑通」一声掉进了水里。旁人都替他着急，他却不慌不忙，掏出小刀在船舷上刻了一个记号，说：「剑是从这里掉下去的，我记着呢。」", "船靠岸后，他从刻着记号的地方跳下水去捞剑。捞了半天，什么也没捞到。旁边的人笑得直不起腰：「船一直在往前走，剑沉在江底可不会跟着走。你在船上刻记号，怎么能找到剑呢？」", "这个人愣住了，半晌才明白过来：江水在流，船在行，只有他的记号一动不动——原来是他自己把「会动的东西」当成了「不会动的」。", "从那以后，人们用「刻舟求剑」来提醒那些看问题死板、不知道跟着情况变化的人：世界一直在变，办法也要跟着变。"], "collectWords": ["不慌不忙", "记号", "愣住", "死板", "变化", "提醒"], "quiz": [{"q": "宝剑掉进江里后，那人做了什么？", "opts": ["立刻跳下去捞", "在船舷上刻了个记号", "请渔夫帮忙"], "ans": 1, "why": "他在船舷刻记号，说剑是从这里掉下去的。"}, {"q": "他为什么捞不到剑？", "opts": ["水太深了", "船在前进，剑沉在江底不动，记号却跟着船走了", "剑被鱼叼走了"], "ans": 1, "why": "船行而剑不动，刻记号的位置早就不是剑掉下去的位置。"}, {"q": "「半晌才明白过来」中「半晌」是什么意思？", "opts": ["半天，形容时间长", "很快", "中午"], "ans": 0, "why": "半晌指好一会儿。"}, {"q": "这个故事讽刺了什么样的人？", "opts": ["丢东西的人", "看问题死板、不懂得情况在变的人", "会刻记号的人"], "ans": 1, "why": "结尾说用来提醒「看问题死板、不知道跟着情况变化的人」。"}]}, {"id": "H25", "title": "狐假虎威（新编）", "theme": "寓言", "paras": ["大森林里，老虎抓住了一只狐狸，正要吃掉他。狐狸眼珠一转，说：「你不能吃我！天帝派我做百兽之王，你要是吃了我，就是违抗天帝的命令。」老虎半信半疑。", "狐狸接着说：「不信？你跟我到森林里走一圈，看看是不是所有动物见了我都害怕。」老虎同意了，跟在狐狸后面走进了森林。", "果然，野兔、小鹿、山羊看见他们，全都撒腿就跑。狐狸得意洋洋：「怎么样？我没骗你吧！」老虎信以为真，恭恭敬敬地放走了狐狸。", "其实动物们怕的哪里是狐狸——是狐狸身后的老虎啊！这个故事讽刺了那些自己没有真本事、却借着别人的威风吓唬人的人。"], "collectWords": ["半信半疑", "撒腿就跑", "得意洋洋", "威风", "恭敬", "讽刺"], "quiz": [{"q": "狐狸被抓住后是怎么脱身的？", "opts": ["跑得很快", "骗老虎说自己是天帝派的百兽之王", "送给老虎食物"], "ans": 1, "why": "狐狸谎称自己是天帝派的百兽之王。"}, {"q": "动物们见了狐狸为什么逃跑？", "opts": ["怕狐狸", "怕狐狸身后的老虎", "要回家吃饭"], "ans": 1, "why": "动物们怕的是狐狸身后的老虎。"}, {"q": "「狐假虎威」中「假」是什么意思？", "opts": ["假装", "借", "虚假"], "ans": 1, "why": "假=借，狐狸借老虎的威风。"}, {"q": "这个寓言讽刺了什么人？", "opts": ["老虎", "自己没本事却借别人威风吓唬人的人", "胆小的动物"], "ans": 1, "why": "结尾点明讽刺对象。"}]}, {"id": "H26", "title": "磨杵成针（新编）", "theme": "寓言", "paras": ["李白小时候不爱读书，常常偷偷跑出去玩。一天，他溜到一条小溪边，看见一位老婆婆正蹲在石头上，磨一根胳膊粗的铁棒。", "李白好奇地问：「老婆婆，您磨铁棒做什么呀？」老婆婆头也不抬：「我要把它磨成一根绣花针。」李白吃了一惊：「这么粗的铁棒，怎么能磨成针呢？」", "老婆婆停下手，看着他说：「孩子，只要功夫深，铁杵也能磨成针。一天磨一点，十年二十年，还怕磨不成吗？」", "李白听了，心里像被什么敲了一下。他想到自己读书总怕苦、总想逃，脸一下子红了。从那以后，他每天用功读书，再也没有逃过学。后来他成了唐代最伟大的诗人之一，人们叫他「诗仙」。"], "collectWords": ["好奇", "功夫", "用功", "诗人", "铁杵"], "quiz": [{"q": "李白在溪边看到老婆婆在做什么？", "opts": ["洗衣服", "磨一根粗铁棒", "绣花"], "ans": 1, "why": "原文「蹲在石头上，磨一根胳膊粗的铁棒」。"}, {"q": "老婆婆磨铁棒是为了什么？", "opts": ["磨成绣花针", "磨锋利切菜", "锻炼身体"], "ans": 0, "why": "老婆婆说要磨成绣花针。"}, {"q": "李白听了老婆婆的话为什么脸红？", "opts": ["天气太热", "他想到自己读书怕苦想逃，感到惭愧", "他被太阳晒的"], "ans": 1, "why": "李白想到自己逃学，心里受到触动。"}, {"q": "「只要功夫深，铁杵磨成针」告诉我们什么？", "opts": ["铁棒可以做针", "只要有恒心肯坚持，再难的事也能做成", "老婆婆力气大"], "ans": 1, "why": "这句谚语说明坚持的力量。"}]}, {"id": "H27", "title": "南辕北辙（新编）", "theme": "寓言", "paras": ["从前有个人要坐车去楚国。楚国在南边，他却赶着马车往北走。", "他的朋友看见了，连忙拦住他：「你走错方向了！楚国在南边，你怎么往北走呢？」那人满不在乎地说：「没关系，我的马跑得可快了！」朋友急了：「马跑得再快，方向不对也到不了楚国啊！」", "那人又说：「我带的路费多着呢！」朋友说：「路费再多，方向错了，只会越走越远。」那人还是不听：「我的车夫赶车技术特别好！」说完，一扬鞭子，马车跑得更快了。", "朋友望着远去的马车，叹了口气：「马越好、钱越多、车夫越棒，他离楚国就越远啊！」这个故事告诉我们：如果方向错了，条件越好，离目标就越远。做事之前，先要看清方向。"], "collectWords": ["方向", "满不在乎", "路费", "目标", "扬鞭"], "quiz": [{"q": "那人去楚国为什么往北走还不着急？", "opts": ["他不知道路", "他仗着马快、钱多、车夫好", "他想去看北方"], "ans": 1, "why": "他三次提到马快、路费多、车夫技术好。"}, {"q": "朋友三次劝告，那人的态度怎样？", "opts": ["虚心接受", "满不在乎，不听劝", "生气了"], "ans": 1, "why": "原文「满不在乎」「还是不听」。"}, {"q": "「条件越好，离目标越远」是因为什么？", "opts": ["条件不重要", "方向错了，好条件只会让错误越走越远", "楚国太远了"], "ans": 1, "why": "方向错时，马越快离楚国越远。"}, {"q": "这个故事告诉我们什么？", "opts": ["马车要跑得快", "做事前要先看清方向，方向错了条件再好也没用", "要多带路费"], "ans": 1, "why": "结尾点明：先看方向。"}]}, {"id": "H28", "title": "盲人摸象（新编）", "theme": "寓言", "paras": ["从前有几个盲人，从来没有见过大象，很想知道大象长什么样子。有人牵来一头大象，请他们摸一摸。", "摸到象牙的盲人说：「大象像一根又光又滑的萝卜！」摸到耳朵的说：「不对不对，大象明明像一把大扇子！」摸到腿的说：「你们都错了，大象像一根粗柱子！」摸到尾巴的急了：「大象明明是一根绳子嘛！」", "四个人争得面红耳赤，谁也不服谁。牵象人笑了：「你们每个人都只摸到了大象的一部分，就以为知道了全部，当然说不对啦！」", "盲人们这才安静下来。他们明白了：看事情不能只看到一部分就下结论，那样很容易闹笑话。要了解事物的全貌，得多听、多问、多从几个角度去看。"], "collectWords": ["角度", "面红耳赤", "部分", "全貌", "结论"], "quiz": [{"q": "盲人们为什么对大象的样子说法不一？", "opts": ["大象会变", "他们各自只摸到了大象的一部分", "他们在撒谎"], "ans": 1, "why": "每人摸到不同部位，感受完全不同。"}, {"q": "摸到腿的盲人说大象像什么？", "opts": ["萝卜", "扇子", "粗柱子"], "ans": 2, "why": "摸到腿的说像粗柱子。"}, {"q": "「面红耳赤」写出了盲人们什么状态？", "opts": ["很害羞", "争论得非常激烈", "很热的"], "ans": 1, "why": "他们争得谁也不服谁。"}, {"q": "这个故事告诉我们什么？", "opts": ["大象很大", "不能只凭局部就下结论，要从多个角度了解全貌", "盲人不聪明"], "ans": 1, "why": "结尾点明：不能以偏概全。"}]}, {"id": "H29", "title": "对牛弹琴（新编）", "theme": "寓言", "paras": ["古代有个音乐家叫公明仪，琴弹得特别好。一天，他带着琴到郊外散步，看见一头黄牛在草地上吃草，兴致来了，说：「牛啊牛，我给你弹一支最好听的曲子吧！」", "他坐下来，认认真真地弹了一首高雅的曲子。琴声优美极了，连树叶都轻轻摇晃。可是黄牛呢？低着头继续吃草，连看都不看他一眼。", "公明仪很纳闷：「我的琴艺难道退步了？」这时，一位放牛的老爷爷笑着说：「不是你的琴不好，是牛根本听不懂这种曲子啊！」", "公明仪想了想，弹起了一段像蚊子叫、小牛哞哞的声音。这回，黄牛竖起耳朵，摇着尾巴，好像真的在听了。公明仪哈哈大笑：「原来不是牛不懂音乐，是我没选对它听得懂的音乐！」这个故事提醒我们：说话做事要看对象，用对方能接受的方式，才能被理解。"], "collectWords": ["高雅", "纳闷", "认真", "对象", "理解", "方式"], "quiz": [{"q": "公明仪第一次弹琴，黄牛为什么没反应？", "opts": ["琴声太小", "牛听不懂高雅的曲子", "牛睡着了"], "ans": 1, "why": "放牛爷爷说牛根本听不懂这种曲子。"}, {"q": "公明仪第二次弹了什么，黄牛才有反应？", "opts": ["更高雅的曲子", "像蚊子叫、小牛哞哞的声音", "摇滚乐"], "ans": 1, "why": "他弹了牛熟悉的声音，黄牛竖起耳朵摇尾巴。"}, {"q": "「对牛弹琴」这个成语本来的意思后来也用来批评什么？", "opts": ["牛不喜欢音乐", "对不懂道理的人讲深奥道理，白费口舌", "弹琴要看地方"], "ans": 1, "why": "成语后来也指说话不看对象。"}, {"q": "这个故事提醒我们什么？", "opts": ["牛很笨", "说话做事要看对象，用对方能接受的方式", "不要给牛弹琴"], "ans": 1, "why": "结尾点明主旨。"}]}, {"id": "H30", "title": "水滴石穿（新编）", "theme": "寓言", "paras": ["山崖下有一块大石头，石头上方的崖壁上挂着一滴一滴的山泉。水滴落下来，正好打在石头的同一个地方。", "一天，石头骄傲地对水滴说：「你这么小、这么软，落到我身上就碎了，还想跟我斗？」小水滴平静地说：「我一次打不动你，就打一百次；一百次不行，就打一万次、十万次。我不急，我有的是耐心。」", "石头哈哈大笑，不再理会水滴。一年过去了，石头身上出现了一个浅浅的小坑；十年过去了，小坑变成了深洞；一百年过去了，大石头竟然被水滴打穿了。", "路过的老人指着石头对孩子们说：「看见了吗？水是最柔的，石头是最硬的，可是柔能胜刚。学习也是这样，每天进步一点点，日子久了，再难的知识也能学会。」"], "collectWords": ["骄傲", "平静", "耐心", "柔能胜刚", "进步"], "quiz": [{"q": "小水滴落在石头的什么地方？", "opts": ["随意乱落", "同一个地方", "石头背面"], "ans": 1, "why": "原文「正好打在石头的同一个地方」。"}, {"q": "石头一开始对水滴的态度是怎样的？", "opts": ["害怕", "骄傲看不起", "很友好"], "ans": 1, "why": "石头骄傲地说水滴又小又软。"}, {"q": "水滴最后把石头怎么样了？", "opts": ["没有变化", "打穿了", "劈成两半"], "ans": 1, "why": "一百年后石头被水滴打穿。"}, {"q": "老人借这个故事告诉孩子们什么道理？", "opts": ["石头不结实", "只要坚持，柔弱的力量也能战胜困难，学习贵在每天进步", "水会腐蚀石头"], "ans": 1, "why": "结尾老人的话点明。"}]}, {"id": "H31", "title": "为什么会打雷闪电", "theme": "科普", "paras": ["夏天的午后，天空常常忽然暗下来，紧接着一道刺眼的亮光划破天空，「轰隆隆」的雷声滚滚而来。这就是打雷闪电。它们到底是怎么来的呢？", "原来，雷雨云里的小水滴和小冰晶不停地上下翻滚、互相摩擦，就像我们冬天脱毛衣时会产生静电一样。摩擦让云层的一部分带上了正电，另一部分带上了负电。当两种电越积越多，空气再也挡不住它们时，就会「啪」地一下放电，产生巨大的火花——这就是我们看到的闪电。", "闪电的温度高得惊人，能达到三万摄氏度，比太阳表面还要热好几倍。这么高的温度让周围的空气瞬间膨胀，发出巨大的声响，这就是雷声。", "因为光的传播速度比声音快得多——光一秒钟能跑三十万千米，声音一秒钟只能跑三百四十米——所以我们总是先看到闪电，后听到雷声。下次看到闪电时，你可以数一数秒数：从看到闪电到听到雷声隔了几秒，再除以三，就能大致算出闪电离你有多远（单位是千米）。"], "collectWords": ["翻滚", "摩擦", "放电", "膨胀", "传播", "刺眼"], "quiz": [{"q": "雷雨云里产生电的原因是什么？", "opts": ["太阳照射", "小水滴和冰晶翻滚摩擦产生静电", "风把电吹来的"], "ans": 1, "why": "原文说水滴冰晶互相摩擦产生静电。"}, {"q": "闪电的温度大约有多高？", "opts": ["一百摄氏度", "一千摄氏度", "三万摄氏度"], "ans": 2, "why": "原文说「能达到三万摄氏度，比太阳表面还要热好几倍」。"}, {"q": "我们先看到闪电后听到雷声，是因为什么？", "opts": ["眼睛比耳朵灵", "光比声音传播快得多", "闪电先发生，雷声后发生"], "ans": 1, "why": "光速每秒三十万千米，声速每秒三百四十米。"}, {"q": "从看到闪电到听到雷声隔了6秒，闪电大约离你多远？", "opts": ["2千米", "6千米", "18千米"], "ans": 0, "why": "原文教的方法：秒数除以三约等于距离千米数，6÷3=2千米。"}]}, {"id": "H32", "title": "心脏：永不停歇的泵", "theme": "科普", "paras": ["你的身体里有一台机器，从你还没出生的时候就开始工作，一天跳动约十万次，一年大约跳四千万次，而且从来不休息——这就是你的心脏。", "心脏大约有你自己的拳头那么大，分成四个「小房间」。它的工作像一个水泵：把带着氧气和养分的新鲜血液压出去，沿着血管送到全身；再把用过的血液收回来，送到肺部换上新鲜的氧气，然后再次出发。血液就这样在你身体里日夜不停地旅行，把营养送到每一个角落，把废物运走。", "你跑步的时候，肌肉需要更多氧气，心脏就会跳得更快，像踩了油门；你睡觉的时候，身体需要的氧气少了，心脏就跳得慢一些，稍微「省点力」。", "心脏这么辛苦，我们该怎么爱护它呢？医生给出了三个办法：多运动，让心脏更有力；不挑食，少吃太油太咸的食物；保证睡眠，让心脏也能「歇口气」。爱护心脏，就是爱护我们自己的生命发动机。"], "collectWords": ["血液", "氧气", "血管", "养分", "发动机", "爱护"], "quiz": [{"q": "心脏一天大约跳动多少次？", "opts": ["一百次", "一万次", "约十万次"], "ans": 2, "why": "原文「一天跳动约十万次」。"}, {"q": "心脏的工作像什么？", "opts": ["像一个水泵，推动血液在全身循环", "像一个风扇", "像一个闹钟"], "ans": 0, "why": "原文用「水泵」比喻心脏压送血液的工作。"}, {"q": "跑步时心脏跳得更快，是因为什么？", "opts": ["心脏害怕了", "肌肉需要更多氧气，心脏加速供血", "跑步时心脏生气了"], "ans": 1, "why": "跑步时肌肉需氧多，心脏像踩油门一样加速。"}, {"q": "爱护心脏的办法不包括哪一个？", "opts": ["多运动", "多吃太油太咸的食物", "保证睡眠"], "ans": 1, "why": "医生建议少吃太油太咸的食物，多吃是错的。"}]}, {"id": "H33", "title": "月亮为什么会变脸", "theme": "科普", "paras": ["有时候月亮圆圆的像玉盘，有时候弯弯的像小船，有时候干脆不见了。月亮难道真的会「变脸」吗？其实，月亮本身不发光，我们看到的月光，是它反射的太阳光。", "月亮围着地球转，大约二十九天半转一圈。在这个过程里，太阳照亮月亮的角度不断变化。当月亮转到地球和太阳中间时，被照亮的那一面背对着我们，我们就几乎看不见月亮，这叫「新月」；当地球在月亮和太阳中间时，月亮被照亮的一面正对着我们，我们就看到圆圆的「满月」。", "在新月和满月之间，我们能看到月亮的半边脸，叫「上弦月」或「下弦月」；看到大半个脸，叫「盈凸月」。月亮的圆缺变化，古人叫作「月相」，还根据它制定了农历。", "中秋节赏月时，你可以想一想：那轮明月其实一直在那里，只是我们和太阳、月亮的相对位置变了，看到的「脸」才不一样。宇宙里没有魔法，只有规律。"], "collectWords": ["反射", "月相", "新月", "满月", "规律", "农历"], "quiz": [{"q": "月亮本身会发光吗？", "opts": ["会，它是小太阳", "不会，月光是反射的太阳光", "有时会"], "ans": 1, "why": "原文「月亮本身不发光，我们看到的月光，是它反射的太阳光」。"}, {"q": "我们看不到月亮的时候，月亮在什么位置？", "opts": ["地球和太阳中间，亮面背对我们", "躲到地球后面", "熄灭了"], "ans": 0, "why": "新月时月亮在地球和太阳之间，亮面背对地球。"}, {"q": "月亮大约多少天绕地球转一圈？", "opts": ["一天", "七天", "二十九天半"], "ans": 2, "why": "原文「大约二十九天半转一圈」。"}, {"q": "「宇宙里没有魔法，只有规律」这句话告诉我们什么？", "opts": ["宇宙很神奇", "月亮圆缺等现象背后都有科学规律", "农历是魔法"], "ans": 1, "why": "月相变化是太阳、地球、月亮位置变化的规律。"}]}, {"id": "H34", "title": "骆驼的沙漠生存术", "theme": "科普", "paras": ["沙漠里又热又干，很多动物待不了几天就受不了，骆驼却能一连走十几天不喝水。它到底有什么本领呢？", "首先，骆驼的驼峰里存的不是水，而是脂肪。这些脂肪在需要时可以转化成能量和水分，就像随身带着「干粮袋」。其次，骆驼特别会「省水」：它的鼻孔能回收呼出的水汽，出汗也比别的动物少得多，连粪便都是干干的，几乎不浪费一滴水。", "骆驼还有一身「防晒衣」：厚厚的驼毛能挡住毒辣的阳光，让热量慢些传到身体。它的体温可以在34℃到41℃之间变化，白天让体温升高，少出汗，夜里再降下来——别的动物体温这样忽高忽低早就生病了，骆驼却安然无恙。", "最神奇的是，当骆驼终于找到水时，它一次能喝下一百多升水，相当于满满两大桶。靠着这些本领，骆驼成了「沙漠之舟」，在丝绸之路上驮着货物，一走就是上千年。"], "collectWords": ["脂肪", "转化", "防晒", "安然无恙", "沙漠之舟", "神奇"], "quiz": [{"q": "骆驼的驼峰里存的是什么？", "opts": ["水", "脂肪", "食物"], "ans": 1, "why": "原文「驼峰里存的不是水，而是脂肪」。"}, {"q": "骆驼「省水」的本领不包括哪一个？", "opts": ["鼻孔回收水汽", "大量出汗", "粪便干干的"], "ans": 1, "why": "原文说骆驼出汗比别的动物少得多，大量出汗是错的。"}, {"q": "骆驼的体温可以在34℃到41℃之间变化，这样做的好处是什么？", "opts": ["显得很厉害", "白天体温升高就少出汗，减少水分流失", "可以更暖和"], "ans": 1, "why": "体温白天升高就少出汗，夜里再降，是省水策略。"}, {"q": "骆驼为什么被称为「沙漠之舟」？", "opts": ["它长得像船", "它能在沙漠中长期行走、驮运货物", "它会游泳"], "ans": 1, "why": "骆驼靠各种本领在沙漠长途驮运，像沙漠里的船。"}]}, {"id": "H35", "title": "种子旅行的N种方式", "theme": "科普", "paras": ["植物不会走路，可它们的种子却能跑到很远的地方安家。种子们都有哪些「交通工具」呢？", "蒲公英的种子撑着一把白色的小伞，风一吹，就飘向远方——这是「风力旅行」。苍耳的种子浑身带刺，谁从旁边走过，它就挂在谁的裤脚或皮毛上，免费搭车——这是「动物运输」。", "椰子更聪明，它的外壳里有一层蓬松的纤维，能浮在水上。成熟的椰子掉进海里，随着海水漂上几天几夜，到达新的海岸生根发芽——这是「水上漂流」。凤仙花的办法最热闹：果实一成熟，外壳突然爆裂，把种子像子弹一样弹出去——这叫「弹射出发」。", "植物妈妈们的办法千奇百怪，目的却只有一个：让孩子离开自己，到更开阔的地方去。因为如果种子都落在妈妈脚下，大家挤在一起，谁也长不好。大自然的每一个设计，都藏着生存的智慧。"], "collectWords": ["交通工具", "蓬松", "爆裂", "千奇百怪", "智慧", "生存"], "quiz": [{"q": "蒲公英的种子靠什么旅行？", "opts": ["水", "风力", "动物"], "ans": 1, "why": "蒲公英种子撑小伞，靠风飘向远方。"}, {"q": "苍耳的种子旅行方式是什么？", "opts": ["挂在小动物或人的身上搭车", "弹出去", "漂在水上"], "ans": 0, "why": "苍耳带刺，挂在裤脚或皮毛上。"}, {"q": "凤仙花传播种子的方式叫什么？", "opts": ["水上漂流", "风力旅行", "弹射出发"], "ans": 2, "why": "凤仙花果实爆裂，把种子像子弹一样弹出去。"}, {"q": "植物让种子到远方去的原因是什么？", "opts": ["种子喜欢旅行", "避免种子挤在一起，能到开阔地方好好生长", "种子在家会被吃掉"], "ans": 1, "why": "原文「如果种子都落在妈妈脚下，大家挤在一起，谁也长不好」。"}]}, {"id": "H36", "title": "恐龙灭绝之谜", "theme": "科普", "paras": ["大约六千六百万年前，恐龙是地球上的霸主，最大的恐龙比三层楼还高。可是，这些威风凛凛的庞然大物，却在很短的时间里几乎全部消失了。它们是怎么灭绝的？", "科学家在墨西哥附近发现了一个巨大的陨石坑，直径约一百八十千米。据此，大多数科学家认为：当时一颗直径约十千米的小行星撞上了地球。撞击的威力比几十亿颗原子弹还大，激起了漫天的灰尘。", "灰尘遮住了太阳，地球变得又黑又冷，时间长达数年。植物得不到阳光，大批枯死；吃植物的恐龙先断了粮，接着吃肉的恐龙也没了食物。食物链一环一环地断裂，恐龙就这样走向了灭绝。", "不过，恐龙的灭绝也给了哺乳动物机会。我们的祖先——那些小小的、毛茸茸的动物——在恐龙消失的空白里迅速壮大，最后才有了人类。科学家说，研究恐龙灭绝，不只是为了满足好奇心，更是为了提醒我们：地球的环境一旦剧变，再大的霸主也可能倒下，保护环境，就是保护我们自己。"], "collectWords": ["霸主", "陨石坑", "威力", "食物链", "灭绝", "剧变"], "quiz": [{"q": "恐龙大约是什么时候灭绝的？", "opts": ["六千六百年前", "六千六百万年前", "六百年前"], "ans": 1, "why": "原文「大约六千六百万年前」。"}, {"q": "大多数科学家认为恐龙灭绝的直接原因是什么？", "opts": ["小行星撞击地球", "火山爆发", "气候变暖"], "ans": 0, "why": "墨西哥附近的巨大陨石坑是撞击证据。"}, {"q": "撞击后恐龙灭绝的过程是怎样的？", "opts": ["直接被砸死", "灰尘遮太阳→植物枯死→食物链断裂→恐龙灭绝", "被哺乳动物赶走"], "ans": 1, "why": "原文详细描述了灰尘遮光导致食物链断裂的过程。"}, {"q": "研究恐龙灭绝对我们今天的意义是什么？", "opts": ["满足好奇心", "提醒我们环境剧变会让强者倒下，要保护环境", "找到陨石坑"], "ans": 1, "why": "结尾点明：保护环境就是保护我们自己。"}]}, {"id": "H37", "title": "为什么要知道二十四节气", "theme": "科普", "paras": ["立春、雨水、惊蛰、春分……这些好听的名字，是我们祖先发明的「二十四节气」。两千多年前，中国人就把一年分成二十四段，每段大约十五天，用来安排种地和生活。", "节气是怎么定出来的？地球围着太阳转，阳光照在地球上的角度不断变化，才有了春夏秋冬。古人观察太阳的位置，把一年里最热的大暑、最冷的大寒、白天最长的夏至、黑夜最长的冬至都标了出来，又把播种、插秧、收割的最佳时间编成节气歌：「春雨惊春清谷天，夏满芒夏暑相连……」", "跟着节气种地，庄稼就长得好。比如「清明前后，种瓜点豆」，说的是清明时节最适合播种；「白露早，寒露迟，秋分种麦正当时」，说的是种麦子的好时候。节气就像大自然的闹钟，提醒人们什么时候该做什么事。", "2016年，二十四节气被联合国列入人类非物质文化遗产名录。外国朋友称它为「中国的第五大发明」。这份来自两千多年前的智慧，至今还在指导着我们的生活，真值得我们骄傲和珍惜。"], "collectWords": ["节气", "祖先", "遗产", "智慧", "骄傲", "观察"], "quiz": [{"q": "二十四节气是谁发明的？", "opts": ["外国人", "两千多年前的中国祖先", "现代科学家"], "ans": 1, "why": "原文「我们祖先发明的」。"}, {"q": "节气是根据什么定出来的？", "opts": ["月亮圆缺", "太阳照射地球的角度变化", "风向"], "ans": 1, "why": "地球绕太阳转，阳光角度变化形成四季，古人据此定节气。"}, {"q": "「清明前后，种瓜点豆」说明节气有什么用？", "opts": ["提醒人们什么时候做什么事，比如播种", "告诉天气", "是节日名称"], "ans": 0, "why": "节气像大自然的闹钟，指导农事安排。"}, {"q": "二十四节气在国际上被称作什么？", "opts": ["中国的第五大发明", "世界奇迹", "农业日历"], "ans": 0, "why": "原文说外国朋友称它为「中国的第五大发明」。"}]}, {"id": "H38", "title": "蜜蜂的「8字舞」为什么了不起", "theme": "科普", "paras": ["一只蜜蜂找到了一片开满鲜花的地方，它怎么把这个好消息告诉同伴呢？喊，蜜蜂没有嗓子；画地图，蜜蜂没有笔。它们用的是一种奇妙的办法——跳舞。", "科学家发现，回巢的蜜蜂会在蜂巢上爬出一个「8」字形。舞蹈的方向藏着秘密：如果它朝正上方爬，表示花儿在太阳的方向；朝左偏，花儿就在太阳偏左的方向。爬行的速度藏着另一个秘密：爬得越慢，说明花儿越远。同伴们围在旁边，用触角「读」懂这支舞，然后准确地飞向花丛。", "发现这个秘密的科学家叫弗里施。他为了看懂蜜蜂的舞蹈，观察了几十年，给几千只蜜蜂做了记号，记录了无数次舞蹈，最后解开了这个谜，还因此获得了诺贝尔奖。", "小小的蜜蜂都能用舞蹈传递这么复杂的信息，大自然还有多少秘密等着我们去发现呢？只要你像弗里施那样耐心地观察、不停地提问，也许下一个解开自然之谜的人，就是你。"], "collectWords": ["奇妙", "触角", "耐心", "诺贝尔奖", "传递", "观察"], "quiz": [{"q": "蜜蜂发现花丛后，用什么办法告诉同伴？", "opts": ["大喊", "跳「8字舞」", "写字"], "ans": 1, "why": "原文说蜜蜂回巢爬出「8」字形。"}, {"q": "蜜蜂舞蹈里藏着哪两个秘密？", "opts": ["颜色和声音", "方向和距离", "时间和天气"], "ans": 1, "why": "舞蹈方向指示方位，爬行速度指示距离。"}, {"q": "弗里施是怎样解开蜜蜂舞蹈之谜的？", "opts": ["猜出来的", "几十年耐心观察、做记号、记录", "问了蜜蜂"], "ans": 1, "why": "原文说他观察几十年、给几千只蜜蜂做记号。"}, {"q": "这篇短文想鼓励我们做什么？", "opts": ["去养蜜蜂", "像科学家那样耐心观察、不断提问", "学跳舞"], "ans": 1, "why": "结尾鼓励观察提问，解开自然之谜。"}]}, {"id": "H39", "title": "人为什么会做梦", "theme": "科普", "paras": ["几乎人人都做过梦：梦见飞上天，梦见考试迟到，梦见很久不见的朋友……梦是怎么来的呢？", "科学家发现，人睡着以后，大脑并没有完全「下班」。睡眠分成好几个阶段，其中有一个阶段，人的眼球会快速转动，大脑也像醒着一样忙——大多数梦，就发生在这个「快速眼动睡眠」阶段。", "梦有什么用呢？一种看法是，梦是大脑在「整理文件」：白天学到的知识、遇到的事情，大脑会在夜里分类归档，重要的留下，不重要的清理掉。所以睡个好觉，有助于记住白天学的功课。另一种看法是，梦是大脑在「排演」：把让人紧张的事情先在梦里演练一遍，真遇到时就不那么慌了。", "虽然科学家还没有完全解开梦的全部秘密，但有一点是肯定的：做梦是正常又有益的事。按时睡觉、睡足十个小时，让大脑好好「整理文件」，第二天才能精神满满地学习。"], "collectWords": ["快速眼动", "整理", "归档", "排演", "有益", "精神满满"], "quiz": [{"q": "大多数梦发生在哪个睡眠阶段？", "opts": ["刚睡着时", "快速眼动睡眠阶段", "快醒时"], "ans": 1, "why": "原文说梦大多发生在「快速眼动睡眠」阶段。"}, {"q": "关于梦的作用，文中提到了哪两种看法？", "opts": ["预知未来和回忆过去", "大脑整理文件和排演紧张事情", "休息和娱乐"], "ans": 1, "why": "原文介绍「整理文件」和「排演」两种看法。"}, {"q": "为什么说做梦是有益的？", "opts": ["梦很好玩", "梦帮助大脑整理知识、消化情绪", "做梦能长个子"], "ans": 1, "why": "整理知识有助于记住功课，排演让人遇事不慌。"}, {"q": "短文建议小学生睡多长时间？", "opts": ["六个小时", "八个小时", "十个小时"], "ans": 2, "why": "结尾说「睡足十个小时」。"}]}, {"id": "H40", "title": "彩虹是怎么画出来的", "theme": "科普", "paras": ["下过雨的太阳天，天空有时会挂起一座七色的「桥」。这座桥不是谁画上去的，而是阳光和小雨滴一起合作的杰作。", "阳光看起来是白色的，其实里面藏着红、橙、黄、绿、青、蓝、紫七种颜色。当阳光钻进圆圆的小雨滴时，会先拐一个弯，这叫「折射」；然后在雨滴的内壁上反射一次；钻出雨滴时，再折射一次。不同颜色的光，拐弯的程度不一样，就这样被分开了。", "千万个小雨滴一起做同样的事，七色光就在天空排成了一条弯弯的彩带——彩虹出现了。所以，看见彩虹要满足两个条件：空气里要有足够的小水滴，太阳要从你的背后照过来。这就是为什么我们总是在雨过天晴、背对太阳的时候看见彩虹。", "想自己造一条彩虹吗？很简单：背对太阳站好，拿喷壶朝空中喷一片水雾，看，你的专属彩虹就出现了！"], "collectWords": ["折射", "反射", "合作", "彩带", "雨过天晴", "专属"], "quiz": [{"q": "阳光里藏着几种颜色？", "opts": ["三种", "五种", "七种"], "ans": 2, "why": "原文「红、橙、黄、绿、青、蓝、紫七种颜色」。"}, {"q": "彩虹形成的两个条件是什么？", "opts": ["有大风和大雨", "空气里有小水滴，太阳从背后照过来", "有云和闪电"], "ans": 1, "why": "原文明确给出两个条件。"}, {"q": "光在雨滴里经历了什么才被分成七色？", "opts": ["折射—反射—再折射", "一直直线走", "被吸收"], "ans": 0, "why": "原文描述了光进雨滴折射、内壁反射、出来再折射的过程。"}, {"q": "自己造彩虹要怎么做？", "opts": ["面对太阳喷水", "背对太阳向空中喷水雾", "用手电筒照"], "ans": 1, "why": "结尾说背对太阳站好喷水雾。"}]}, {"id": "H41", "title": "候鸟的万里导航", "theme": "科普", "paras": ["每年秋天，大雁排着「人」字形的队伍飞向南方；第二年春天，它们又准时飞回北方。没有地图，没有手机导航，候鸟是怎么飞越千山万水也不迷路的呢？", "科学家的研究让人惊叹：候鸟有好几件「秘密武器」。第一件是「太阳罗盘」——它们能根据太阳的位置判断方向；阴天看不见太阳怎么办？它们还有第二件武器「星空地图」，能认出夜空里的星座。最神奇的是第三件：候鸟的眼睛或脑袋里好像有「磁力感应器」，能感觉地球磁场的方向，就像随身带着一个指南针。", "光有武器还不够。候鸟出发前一两个月，会拼命吃东西，把自己吃得圆滚滚的，因为长途飞行太耗体力，中途常常找不到吃的。有些候鸟一口气能飞几千千米，连飞几天几夜不落地。", "科学家还发现，很多候鸟年复一年飞的是同一条路线，甚至回到同一个旧巢。这份对「家」的记忆和坚守，让人们在感叹科学神奇的同时，也读出了一份执着。"], "collectWords": ["导航", "罗盘", "磁场", "惊叹", "执着", "千山万水"], "quiz": [{"q": "候鸟认路的「秘密武器」不包括哪一件？", "opts": ["太阳罗盘", "星空地图", "手机导航"], "ans": 2, "why": "候鸟用太阳、星座、地磁导航，没有手机。"}, {"q": "候鸟出发前为什么要拼命吃东西？", "opts": ["嘴馋", "长途飞行耗体力，中途常找不到食物", "为了变胖好看"], "ans": 1, "why": "原文说长途飞行太耗体力，中途常常找不到吃的。"}, {"q": "「磁力感应器」让候鸟能感觉到什么？", "opts": ["地球的磁场方向", "天气", "同伴的位置"], "ans": 0, "why": "原文说能感觉地球磁场方向，像随身带指南针。"}, {"q": "从候鸟身上，作者还读出了什么品质？", "opts": ["懒惰", "对家的记忆和坚守的执着", "聪明"], "ans": 1, "why": "结尾说读出「对家的记忆和坚守」。"}]}, {"id": "H42", "title": "为什么铁会生锈", "theme": "科普", "paras": ["家里的铁门、自行车的链条，放久了会蒙上一层红棕色的东西，摸一摸还掉渣——这就是铁锈。铁好好的，为什么会生锈呢？", "原来，铁是一个「活泼分子」，特别喜欢和空气里的氧气、水里的水汽「交朋友」。铁、氧气和水碰到一起，就会发生一种叫「氧化」的变化，生成松松软软的铁锈。如果空气又湿又热，或者水里带着盐分，生锈的速度就更快——这就是为什么海边的铁器锈得特别厉害。", "铁锈和铁可不一样：铁又硬又结实，铁锈却又松又脆。更糟糕的是，铁锈不会保护里面的铁，反而像海绵一样吸水，让里面的铁继续生锈，一层锈一层，最后整块铁都会烂掉。", "人们想了很多办法对付生锈：给铁门刷上油漆，把空气和水挡在外面；给铁锅擦干再收起来；还有一种更聪明的办法，在铁里掺进别的金属，炼成不容易生锈的不锈钢。小小一层锈，藏着这么多学问呢！"], "collectWords": ["生锈", "氧化", "糟糕", "对付", "学问"], "quiz": [{"q": "铁生锈需要哪两个条件？", "opts": ["阳光和风", "氧气和水", "高温"], "ans": 1, "why": "原文说铁和氧气、水汽一起发生氧化才生锈。"}, {"q": "海边的铁器为什么锈得特别快？", "opts": ["海风大", "水里带盐分会加快生锈", "海边太热"], "ans": 1, "why": "原文「水里带着盐分，生锈的速度就更快」。"}, {"q": "铁锈为什么会「连累」里面的铁？", "opts": ["铁锈很重", "铁锈像海绵吸水，让里面的铁继续生锈", "铁锈有毒"], "ans": 1, "why": "原文说铁锈吸水，让里面的铁继续锈。"}, {"q": "下列哪个不是防锈的好办法？", "opts": ["刷油漆", "铁锅用完不擦干", "掺金属炼不锈钢"], "ans": 1, "why": "铁锅要擦干收起来，不擦干容易生锈。"}]}, {"id": "H43", "title": "眼睛是怎样看见东西的", "theme": "科普", "paras": ["闭上眼睛，世界就消失了；睁开眼睛，花草树木一下子跳进眼帘。眼睛是怎么「看见」东西的呢？", "原来，我们看到的每样东西，都在反射光线。这束光先穿过眼睛前面透明的「玻璃窗」——角膜，再经过一个叫「晶状体」的小凸透镜。晶状体可神奇了，它能变厚变薄：看近处时变厚，看远处时变薄，始终把画面清清楚楚地投在眼球后面的「屏幕」——视网膜上。", "视网膜上有上亿个感光细胞，它们把光变成电信号，通过视神经一路送进大脑。大脑收到信号，「唰」地一下，我们就「看见」了。整个过程快得不到一秒钟。", "眼睛这么精密，我们一定要好好保护：看书写字保持一尺距离，看半小时远处要望一望，少看手机和电视，多到户外晒太阳。眼睛是心灵的窗户，擦亮了，才能看一辈子的好风景。"], "collectWords": ["角膜", "晶状体", "视网膜", "信号", "精密", "保护"], "quiz": [{"q": "我们能看到东西，第一步是因为物体在做什么？", "opts": ["发光", "反射光线", "发出声音"], "ans": 1, "why": "原文「我们看到的每样东西，都在反射光线」。"}, {"q": "晶状体的神奇之处是什么？", "opts": ["能变颜色", "能变厚变薄，把画面清楚投在视网膜上", "能转动"], "ans": 1, "why": "原文说晶状体看近变厚看远变薄。"}, {"q": "视网膜上的感光细胞负责做什么？", "opts": ["把光变成电信号送进大脑", "挡住灰尘", "让眼睛变漂亮"], "ans": 0, "why": "原文说感光细胞把光变电信号，经视神经送进大脑。"}, {"q": "下列哪个做法不利于保护眼睛？", "opts": ["看书保持一尺距离", "长时间盯着手机看", "多到户外活动"], "ans": 1, "why": "要少看手机电视，长时间盯手机有害。"}]}, {"id": "H44", "title": "垃圾分类的秘密", "theme": "科普", "paras": ["每天，我们都会扔出很多垃圾。如果所有垃圾都埋在一起，一吨垃圾要占好大一块地，还会污染土壤和地下水。科学家算过，一个三口之家一年产生的垃圾，需要大约三棵树长二十年才能「消化」掉它带来的污染。", "其实，垃圾里有三分之二都是宝贝。废纸能再造成新纸，少砍很多树；塑料能变成新的塑料制品，少用很多石油；剩菜剩饭能做成肥料；旧金属回炉，比从矿石里炼新金属省百分之九十以上的能源。垃圾分类，就是把混在一起的宝贝重新分开。", "我国的垃圾一般分四类：蓝色的可回收物，比如纸张、塑料瓶、易拉罐；绿色的厨余垃圾，如果皮、剩菜；红色的有害垃圾，像旧电池、过期药品，必须单独处理；灰色的其他垃圾，比如用过的纸巾。", "下次扔垃圾前，多花三秒钟想一想：它该进哪个桶？这三秒钟，就是送给地球的一件小礼物。"], "collectWords": ["污染", "回收", "能源", "分类", "处理", "礼物"], "quiz": [{"q": "垃圾全部埋在一起有什么害处？", "opts": ["不好看", "占地多，污染土壤和地下水", "味道难闻"], "ans": 1, "why": "原文说占地大，污染土壤和地下水。"}, {"q": "垃圾里大约有多少是可以回收利用的宝贝？", "opts": ["三分之一", "三分之二", "十分之一"], "ans": 1, "why": "原文「垃圾里有三分之二都是宝贝」。"}, {"q": "旧电池应该放进哪一类垃圾桶？", "opts": ["蓝色可回收物", "红色有害垃圾", "绿色厨余垃圾"], "ans": 1, "why": "旧电池是有害垃圾，必须单独处理。"}, {"q": "「三秒钟的小礼物」指的是什么？", "opts": ["扔垃圾前想一想该进哪个桶", "送礼物给环卫工人", "捡地上的垃圾"], "ans": 0, "why": "结尾说扔垃圾前花三秒想分类。"}]}, {"id": "H45", "title": "声音为什么不能在太空传播", "theme": "科普", "paras": ["电影里，宇宙飞船爆炸时总是「轰」的一声巨响。可是科学家说，真实的太空里，再大的爆炸也是安安静静的。这是为什么呢？", "要弄明白这个问题，先要知道声音是怎么旅行的。声音其实是一种振动：敲鼓时，鼓面振动，推动周围的空气一紧一松地传出去，像水面上的波纹一样，传到我们的耳朵里。所以，声音旅行需要「乘客」——空气、水或者别的物质。没有它们，振动就哪儿也去不了。", "太空是一个几乎什么都没有的世界，没有空气，没有水，只有接近真空的环境。爆炸再猛烈，振动也没有物质可以传递，所以太空里一片寂静。宇航员在飞船外面工作时，再近也得靠无线电通话——因为无线电波不需要空气，可以在真空里跑。", "地球上就不一样了：空气、水、大地都能传声，而且固体传声比空气还快。把耳朵贴在铁轨上，能更早听见远处的火车——不过太危险了，可不要真去试！"], "collectWords": ["振动", "真空", "寂静", "无线电", "波纹"], "quiz": [{"q": "太空里爆炸为什么听不见声音？", "opts": ["爆炸声音太小", "太空接近真空，没有物质传递振动", "离得太远"], "ans": 1, "why": "声音传播需要物质，太空几乎是真空。"}, {"q": "声音旅行的「乘客」指的是什么？", "opts": ["宇航员", "空气、水等传递振动的物质", "声波"], "ans": 1, "why": "声音靠空气、水等物质传播。"}, {"q": "宇航员在飞船外靠什么通话？", "opts": ["大声喊", "无线电", "手势"], "ans": 1, "why": "无线电波不需要空气，可以在真空传播。"}, {"q": "在地球上，声音在什么里面传播得更快？", "opts": ["空气", "真空", "固体"], "ans": 2, "why": "原文「固体传声比空气还快」。"}]}, {"id": "H46", "title": "司马光砸缸", "theme": "成语", "paras": ["北宋时期，有个叫司马光的孩子，从小爱读书，遇事特别沉着。", "一天，司马光和一群小伙伴在院子里玩捉迷藏。院子里有一口大水缸，缸里装满了水。一个小孩爬到缸沿上玩，一不小心，「扑通」一声掉进了缸里。水缸又高又深，孩子在里面拼命挣扎，眼看就要沉下去了。", "小伙伴们都吓坏了，有的哭着喊救命，有的撒腿跑去找大人。只有司马光站在原地，眼睛飞快地扫了一圈：缸太高，拉不出来；人太小，够不着。怎么办？他忽然看见墙角有块大石头，立刻跑过去抱起石头，用尽全身力气朝水缸砸去。「哐当」一声，缸破了一个大洞，水「哗哗」地流了出来，落水的孩子得救了。", "人们都夸司马光聪明。其实，司马光的聪明不只是会想，更是遇事先让自己冷静下来。急中生智的前提，是临危不乱。"], "collectWords": ["沉着", "挣扎", "急中生智", "临危不乱", "撒腿", "得救"], "quiz": [{"q": "小伙伴掉进水缸后，司马光是怎么救他的？", "opts": ["跳进缸里拉", "搬石头砸破水缸让水流出来", "喊大人来"], "ans": 1, "why": "原文说司马光抱石头砸破缸，水流出来孩子得救。"}, {"q": "其他小伙伴和司马光的反应有什么不同？", "opts": ["都去砸缸", "其他孩子哭喊跑开，司马光冷静想办法", "都吓跑了"], "ans": 1, "why": "别的孩子哭着喊救命或跑开，只有司马光冷静观察。"}, {"q": "「拼命挣扎」写出了落水孩子怎样的状态？", "opts": ["玩水很开心", "情况万分危急", "很会游泳"], "ans": 1, "why": "孩子在深水里挣扎，眼看要沉下去，十分危急。"}, {"q": "这个故事告诉我们什么？", "opts": ["水缸很危险", "遇到危险先让自己冷静，才能想出好办法", "小孩不能玩水"], "ans": 1, "why": "结尾点明「急中生智的前提，是临危不乱」。"}]}, {"id": "H47", "title": "曹冲称象", "theme": "成语", "paras": ["三国时期，有人送给曹操一头大象。曹操想知道大象有多重，可是那时候没有那么大的秤。大臣们议论纷纷：有人说造一杆顶天的大秤，有人说把大象切成一块一块地称。曹操听了直摇头。", "这时，曹操的小儿子曹冲站了出来，那年他才六七岁。曹冲说：「我有办法。把大象赶到一条大船上，看船身往下沉多少，在船舷上刻下记号。然后把大象牵回岸上，再往船上装石头，装到船沉到记号的地方为止。最后把石头一筐一筐地称出来，石头的总重量，就是大象的重量。」", "曹操一听，连连点头，马上叫人照着办。果然，称出了大象的重量。大臣们都夸曹冲聪明。", "曹冲的办法妙在哪里呢？大象太重没法直接称，他就把「称大象」换成了「称石头」——把一个大难题，变成许多小难题。遇到解决不了的困难，换个角度想一想，也许就有办法了。"], "collectWords": ["议论纷纷", "记号", "办法", "角度", "难题", "连连点头"], "quiz": [{"q": "大臣们最初想的主意为什么不行？", "opts": ["太贵了", "造大秤不现实，切大象更不行", "曹操不同意"], "ans": 1, "why": "造顶天大秤和切块称都不现实。"}, {"q": "曹冲称象的第一步是什么？", "opts": ["把大象赶上船，在船舷刻下沉记号", "往船上装石头", "称石头"], "ans": 0, "why": "先把大象赶上船，刻下船身下沉的记号。"}, {"q": "为什么石头的重量等于大象的重量？", "opts": ["石头和大象一样大", "它们让船沉到同一个记号，说明一样重", "石头比大象重"], "ans": 1, "why": "船沉到同一位置，说明两者重量相同。"}, {"q": "曹冲的办法妙在哪里？", "opts": ["船很结实", "把一个称不了的大难题换成许多能称的小难题", "他力气大"], "ans": 1, "why": "结尾点明「把称大象换成称石头」的转换思路。"}]}, {"id": "H48", "title": "孔融让梨", "theme": "成语", "paras": ["东汉末年，有个孩子叫孔融，是孔子的第二十代孙。他四岁那年的一天，家里买回一筐梨，父亲叫孩子们自己来拿。", "哥哥们一拥而上，挑的挑，拣的拣，都想拿又大又甜的。轮到孔融，他却从筐里拿了一个最小的梨。父亲很奇怪，问他：「为什么不拿大的？」", "孔融认真地回答：「我年纪小，应该吃小的，大的留给哥哥们吃。」父亲又问：「那你还有个弟弟呢，他比你更小啊！」孔融想了想，说：「弟弟比我小，我是哥哥，也应该把大的让给弟弟。」", "父亲听了，欣慰地笑了。这件事一传十、十传百，「孔融让梨」成了教育孩子懂得谦让的好故事。谦让不是吃亏，而是心里装着别人。"], "collectWords": ["谦让", "欣慰", "认真", "一拥而上", "装着别人"], "quiz": [{"q": "孔融拿了一个什么样的梨？", "opts": ["最大的", "最小的", "最红的"], "ans": 1, "why": "原文「他从筐里拿了一个最小的梨」。"}, {"q": "孔融为什么把大梨让给哥哥？", "opts": ["他不爱吃梨", "他觉得自己年纪小应该吃小的", "大的不好吃"], "ans": 1, "why": "孔融说「我年纪小，应该吃小的」。"}, {"q": "父亲问弟弟的事，孔融是怎么回答的？", "opts": ["弟弟也吃小的", "弟弟比我小，我是哥哥也应该让着他", "让弟弟自己拿"], "ans": 1, "why": "孔融说作为哥哥也应该把大的让给弟弟。"}, {"q": "这个故事告诉我们谦让是什么？", "opts": ["吃亏", "心里装着别人", "故意表现"], "ans": 1, "why": "结尾点明「谦让不是吃亏，而是心里装着别人」。"}]}, {"id": "H49", "title": "岳飞精忠报国", "theme": "成语", "paras": ["南宋时期，金兵不断侵犯中原，百姓流离失所。少年岳飞看在眼里，立志要练好本领，保卫国家。他每天天不亮就起来练武，寒冬腊月也不间断，还熟读兵书。", "岳飞参军前，母亲把他叫到跟前，问：「国家有难，你打算怎么办？」岳飞坚定地回答：「精忠报国，死而后已！」母亲听了，取过针线，在他背上刺下「精忠报国」四个大字，勉励他永远记住自己的誓言。", "岳飞没有忘记母亲的话。他带的军队纪律严明，爱护百姓，作战勇猛，被称为「岳家军」。金兵最怕岳家军，他们说：「撼山易，撼岳家军难！」意思是：摇动一座山容易，想打败岳家军，难！", "虽然后来岳飞被坏人陷害，但「精忠报国」四个字，却穿越近九百年的时光，一直活在人们心中。每当国家需要的时候，人们就会想起这四个字的分量。"], "collectWords": ["立志", "坚定", "严明", "誓言", "穿越", "分量"], "quiz": [{"q": "岳飞少年时立下了什么志向？", "opts": ["做大官", "练好本领，保卫国家", "挣大钱"], "ans": 1, "why": "原文「立志要练好本领，保卫国家」。"}, {"q": "母亲在岳飞背上刺了什么字？", "opts": ["精忠报国", "保卫家乡", "勇敢"], "ans": 0, "why": "母亲刺下「精忠报国」四个大字。"}, {"q": "「撼山易，撼岳家军难」说明岳家军怎样？", "opts": ["住在山里", "纪律严明、作战勇猛，极难被打败", "人数很多"], "ans": 1, "why": "金兵的话说明岳家军战斗力极强。"}, {"q": "这个故事最打动人的精神是什么？", "opts": ["武术高强", "对国家忠贞不渝的爱国精神", "母亲很严格"], "ans": 1, "why": "「精忠报国」四字穿越时光活在人们心中。"}]}, {"id": "H50", "title": "闻鸡起舞", "theme": "成语", "paras": ["东晋时期，有两个好朋友，一个叫祖逖，一个叫刘琨。他们住在一起，都有报效国家的志向。那时候，北方战乱不断，祖逖常常想：「国家有难，我却没有一身过硬的本领，怎么办呢？」", "一天半夜，祖逖在睡梦中听到公鸡打鸣，他一骨碌爬起来，推醒刘琨：「别人都说半夜鸡叫不吉利，我却觉得这是催我们起床练武呢！」刘琨听了，痛快地答应了。", "从此，每天一听到鸡叫，两个人就起床舞剑练武，不管刮风下雪，从不间断。春去秋来，寒来暑往，他们的武艺越来越精湛，学问也越来越大。", "后来，祖逖带兵北伐，收复了不少失地，成为人人敬仰的名将。人们用「闻鸡起舞」这个故事告诉我们：有志向的人很多，能每天坚持的却很少。梦想的实现，靠的不是一时兴起，而是日积月累。"], "collectWords": ["志向", "一骨碌", "精湛", "敬仰", "日积月累", "坚持"], "quiz": [{"q": "祖逖听到鸡叫后做了什么？", "opts": ["继续睡觉", "叫醒刘琨一起起床练武", "把鸡赶走"], "ans": 1, "why": "原文「推醒刘琨……起床舞剑练武」。"}, {"q": "别人觉得半夜鸡叫不吉利，祖逖却怎么想？", "opts": ["很害怕", "觉得是催他们起床练武", "没在意"], "ans": 1, "why": "祖逖把鸡叫当成练武的闹钟。"}, {"q": "「从不间断」说明他们怎样的品质？", "opts": ["闲不住", "有恒心，能长期坚持", "睡不着"], "ans": 1, "why": "不管刮风下雪都坚持，说明有恒心。"}, {"q": "这个故事告诉我们梦想实现靠什么？", "opts": ["好运气", "每天日积月累的坚持", "朋友的帮助"], "ans": 1, "why": "结尾点明「靠的不是一时兴起，而是日积月累」。"}]}, {"id": "H51", "title": "负荆请罪", "theme": "成语", "paras": ["战国时期，赵国有两个能人：大将廉颇和宰相蔺相如。蔺相如凭智慧两次立功，职位比廉颇还高。廉颇心里不服：「我在战场上出生入死，他光凭一张嘴，凭什么在我之上？我见到他，非让他下不来台不可！」", "蔺相如听说后，总躲着廉颇，上朝都称病不去。手下人很生气：「您的职位比他高，为什么怕他呢？」蔺相如说：「我连秦王都不怕，会怕廉将军吗？我是想，强大的秦国不敢打赵国，就是因为有我们两个人在。如果我们俩斗起来，国家就危险了。」", "这话传到廉颇耳朵里，他惭愧极了，觉得自己只想着个人恩怨，忘了国家大事。于是，他脱光上身，背着荆条，亲自到蔺相如家里请罪，说：「我是个粗人，您大人有大量，用荆条抽我吧！」", "蔺相如连忙扶起他。从此，两人成了生死之交，一起保卫赵国。人们用「负荆请罪」来称赞那些敢于认错、真心改过的人。"], "collectWords": ["不服", "惭愧", "生死之交", "改过", "恩怨", "请罪"], "quiz": [{"q": "廉颇为什么对蔺相如不服？", "opts": ["蔺相如学问差", "蔺相如靠一张嘴立功，职位却比战功赫赫的他高", "蔺相如是外乡人"], "ans": 1, "why": "廉颇觉得自己出生入死，蔺相如靠嘴职位却更高。"}, {"q": "蔺相如为什么躲着廉颇？", "opts": ["害怕挨打", "怕两人争斗让国家陷入危险", "职位低"], "ans": 1, "why": "蔺相如说两人斗起来国家就危险了。"}, {"q": "廉颇「负荆请罪」说明他怎样？", "opts": ["胆小", "敢于认错、真心改过", "不讲道理"], "ans": 1, "why": "廉颇听说后惭愧，背荆条上门请罪。"}, {"q": "这个故事流传下来，最可贵的两种品质是什么？", "opts": ["勇敢和智慧", "蔺相如的顾全大局和廉颇的知错能改", "地位和功劳"], "ans": 1, "why": "蔺相如顾大局，廉颇知错就改，两者都可贵。"}]}, {"id": "H52", "title": "凿壁偷光", "theme": "成语", "paras": ["西汉时候，有个孩子叫匡衡，家里很穷，点不起油灯。可是匡衡特别爱读书，白天要帮家里干活，只有晚上有空，天一黑却没法看书，他急得直叹气。", "一天晚上，匡衡躺在床上翻来覆去睡不着，忽然发现墙缝里透进来一丝亮光——原来是邻居家的灯光。匡衡一骨碌爬起来，盯着那道光看了半天，想出了一个办法：他找来小刀，把墙缝悄悄凿大了一些，邻居家的灯光就照了过来，正好落在他的书页上。", "就这样，匡衡每天晚上借着邻居家透过来的灯光读书，一读就是好几年。村里有个大户人家有很多书，匡衡就主动去给他家干活，不要工钱，只求能读他家的藏书。主人被感动了，把书都借给了他。", "后来，匡衡成了有名的大学问家。人们常用「凿壁偷光」来形容那些不怕困难、刻苦学习的人。"], "collectWords": ["翻来覆去", "透进来", "刻苦", "藏书", "学问家", "感动"], "quiz": [{"q": "匡衡晚上为什么不能读书？", "opts": ["他要干活", "家里穷点不起油灯", "他不爱读书"], "ans": 1, "why": "原文「家里很穷，点不起油灯」。"}, {"q": "匡衡是怎么「偷」到光的？", "opts": ["到邻居家看书", "把墙缝凿大，借邻居家透过来的灯光读书", "点蜡烛"], "ans": 1, "why": "他把墙缝凿大，让邻居家的灯光照到书页上。"}, {"q": "匡衡为什么去大户人家干活不要工钱？", "opts": ["他家不缺钱", "只求能读那家的藏书", "他喜欢干活"], "ans": 1, "why": "匡衡为读藏书，不要工钱只求借书。"}, {"q": "「凿壁偷光」用来形容什么样的人？", "opts": ["会想办法的小偷", "不怕困难、刻苦学习的人", "聪明的孩子"], "ans": 1, "why": "结尾点明成语含义。"}]}, {"id": "H53", "title": "程门立雪", "theme": "成语", "paras": ["北宋时期，有个叫杨时的读书人，已经四十多岁了，学问也很大，可他仍然虚心求教。他听说洛阳的程颐先生学问高深，就千里迢迢赶去拜师。", "一天，杨时和同学游酢一起去向程颐请教问题。到了程家，正赶上程颐坐着打瞌睡。两个人不敢打扰老师，就恭恭敬敬地站在门外等候。", "天上下起了大雪，雪花落在他们的帽子上、肩膀上，越积越厚。游酢冻得直跺脚，杨时却站得笔直，一动不动。就这样，他们在雪里站了很久很久。", "等程颐醒来，发现门外两个「雪人」，又吃惊又感动，连忙把他们请进屋，收下了这两个学生。后来杨时果然成了大学问家。「程门立雪」这个故事，讲的就是对老师的尊敬和求学的诚心。"], "collectWords": ["虚心", "恭敬", "请教", "打扰", "诚心", "尊敬"], "quiz": [{"q": "杨时已经四十多岁、学问很大，为什么还要拜师？", "opts": ["闲着没事", "他虚心求教，想学更深的学问", "程颐很有名"], "ans": 1, "why": "原文说他「仍然虚心求教」。"}, {"q": "杨时和游酢为什么站在雪里不进屋？", "opts": ["没有钥匙", "怕打扰老师休息，恭敬等候", "老师不见客"], "ans": 1, "why": "两人不敢打扰打瞌睡的程颐，站在门外等。"}, {"q": "程颐醒来后为什么又吃惊又感动？", "opts": ["门外站着两个被雪覆盖仍恭敬等候的人", "雪下得太大", "他们等了很久"], "ans": 0, "why": "两人站成了「雪人」，这份诚心让程颐感动。"}, {"q": "「程门立雪」表现了什么精神？", "opts": ["不怕冷", "尊敬老师、诚心求学", "站得久"], "ans": 1, "why": "结尾点明：对老师的尊敬和求学的诚心。"}]}, {"id": "H54", "title": "管鲍之交", "theme": "成语", "paras": ["春秋时期，管仲和鲍叔牙是一对好朋友。年轻时两人一起做生意，赚了钱，管仲总多拿一份。旁人都替鲍叔牙抱不平，鲍叔牙却说：「管仲家里穷，还要养母亲，多拿一点是应该的，我不怪他。」", "后来两人一起参军打仗。打仗的时候，管仲总躲在后面；撤退的时候，他却跑在最前面。士兵们都嘲笑他胆小，鲍叔牙又替他说话：「管仲不是怕死，他是惦记着家里的老母亲，不敢轻易丢掉性命。」", "再后来，两人分别辅佐齐国的两位公子。鲍叔牙辅佐的公子小白当上了国君，就是齐桓公。鲍叔牙本可以当大官，他却对齐桓公说：「管仲的才能比我高十倍，要想把国家治理好，您一定要重用他。」齐桓公听从了建议，拜管仲为相。管仲果然大展才华，帮齐桓公成了一代霸主。", "管仲感动地说：「生我的是父母，最懂我的是鲍叔牙啊！」人们就把这种最知心、最能理解和成全朋友的情谊，叫作「管鲍之交」。"], "collectWords": ["抱不平", "惦记", "重用", "知心", "成全", "情谊"], "quiz": [{"q": "做生意时管仲多拿钱，鲍叔牙为什么不生气？", "opts": ["他不在乎钱", "他理解管仲家里穷还要养母亲", "他钱多得花不完"], "ans": 1, "why": "鲍叔牙理解管仲的难处，不怪他。"}, {"q": "打仗时管仲总躲在后面，鲍叔牙怎么解释？", "opts": ["管仲胆小", "管仲惦记家中老母，不敢轻易送命", "管仲受伤"], "ans": 1, "why": "鲍叔牙说管仲是惦念老母亲。"}, {"q": "鲍叔牙当大官的机会来了，他做了什么？", "opts": ["自己上任", "向齐桓公推荐更有才能的管仲", "辞官回家"], "ans": 1, "why": "鲍叔牙推荐管仲为相，成全了朋友和国家。"}, {"q": "「管鲍之交」指的是怎样的友谊？", "opts": ["一起做生意", "最知心、能理解和成全朋友的情谊", "打仗的交情"], "ans": 1, "why": "结尾点明成语含义。"}]}, {"id": "H55", "title": "卧薪尝胆", "theme": "成语", "paras": ["春秋末年，吴国和越国打仗，越国大败，越王勾践被抓到吴国，给吴王夫差当马夫，受尽了屈辱。勾践表面上服服帖帖，心里却一刻也没有忘记亡国之痛。", "三年后，吴王放松了警惕，放勾践回国。回到越国，勾践怕自己贪图安逸、忘记耻辱，就做了一个惊人的决定：他把舒适的床撤掉，铺上硬邦邦的柴草睡觉；又在屋里挂了一个苦胆，每天吃饭、睡觉前，都要尝一尝苦胆的滋味，提醒自己：「你忘记会稽山的耻辱了吗？」", "勾践亲自下田耕种，夫人亲手织布，吃饭从不用肉。他还减轻百姓的赋税，奖励生育和耕种，训练军队。越国上下一条心，国力一天比一天强。", "经过二十年的准备，越国终于强大起来。勾践率领大军打败吴国，吴王夫差羞愧自杀。「卧薪尝胆」这个故事告诉我们：能忍受眼前的苦，才有可能成就将来的事。"], "collectWords": ["屈辱", "警惕", "安逸", "减轻", "一条心", "忍受"], "quiz": [{"q": "勾践回国后为什么睡柴草、尝苦胆？", "opts": ["他喜欢这样", "怕自己贪图安逸忘记耻辱，时刻提醒自己", "为了治病"], "ans": 1, "why": "他怕忘记亡国之痛，用苦胆提醒自己。"}, {"q": "「卧薪尝胆」中「薪」和「胆」分别指什么？", "opts": ["柴草和苦胆", "工钱和胆量", "食物和药物"], "ans": 0, "why": "卧薪=睡在柴草上，尝胆=尝苦胆。"}, {"q": "越国强大起来的原因不包括哪一个？", "opts": ["勾践与民同苦、奖励耕种", "全国上下一心", "吴国的帮助"], "ans": 2, "why": "越国强大靠自身努力，与吴国无关。"}, {"q": "这个故事告诉我们什么？", "opts": ["要会吃苦瓜", "能忍受眼前的苦，才可能成就将来的事", "打仗要勇猛"], "ans": 1, "why": "结尾点明主旨。"}]}, {"id": "H56", "title": "破釜沉舟", "theme": "成语", "paras": ["秦朝末年，秦军主力围困赵国，各路起义军都不敢前去救援。楚军将领项羽奉命北上救赵。面对强大的秦军，很多士兵心里发怵。", "大军渡过漳河以后，项羽下了一道让所有人目瞪口呆的命令：把渡河的船全部凿沉，把做饭的锅全部砸破，每个士兵只带三天的干粮。士兵们不明白，项羽说：「船没了，锅砸了，我们就只有一条路——向前打胜仗！后退，只有死路一条。」", "没了退路的楚军，人人抱着必胜的决心。上了战场，他们以一当十，喊杀声震天动地。其他起义军的将士在营垒上看得目瞪口呆，都不敢相信自己的眼睛。", "经过九次激战，楚军终于大破秦军，解救了赵国。这一战让项羽名震天下。「破釜沉舟」告诉我们：有时候斩断退路，下定决心勇往直前，反而能爆发出最大的力量。"], "collectWords": ["围困", "发怵", "目瞪口呆", "决心", "勇往直前", "爆发"], "quiz": [{"q": "项羽过河后下了什么命令？", "opts": ["原地休息", "把船凿沉、锅砸破，只带三天干粮", "加倍赏赐"], "ans": 1, "why": "原文「把渡河的船全部凿沉，把做饭的锅全部砸破」。"}, {"q": "项羽这样做的目的是什么？", "opts": ["节省粮食", "斩断退路，让士兵只有向前一条路", "船和锅都坏了"], "ans": 1, "why": "没了退路，士兵只能拼死向前。"}, {"q": "楚军在战场上的表现怎样？", "opts": ["溃不成军", "以一当十，大破秦军", "原地不动"], "ans": 1, "why": "原文说楚军「以一当十」，九次激战后大破秦军。"}, {"q": "「破釜沉舟」现在用来形容什么？", "opts": ["浪费东西", "下定决心、不留退路地干到底", "打仗的故事"], "ans": 1, "why": "结尾点明：斩断退路勇往直前。"}]}, {"id": "H57", "title": "三顾茅庐", "theme": "成语", "paras": ["东汉末年，天下大乱。刘备想干一番事业，听说襄阳隆中住着一位了不起的读书人诸葛亮，人称「卧龙先生」，就带着关羽、张飞前去拜访，想请他出山相助。", "第一次，诸葛亮出门去了，三人扑了个空。过了些天，刘备冒着大风雪第二次登门，诸葛亮又不在家。张飞性急，嘟囔着：「一个读书人，派个人叫来就是了，何必哥哥亲自跑一趟又一趟？」刘备认真地说：「请他出山，要有诚意。诚意，是请来的，不是命令来的。」", "第三次，刘备斋戒沐浴后再次来到草庐。这回诸葛亮在家，正在午睡。刘备不敢打扰，就拱手站在台阶下等候，一站就是好几个时辰。诸葛亮醒来，被刘备的诚意深深打动，两人谈了很久。诸葛亮为刘备分析天下形势，提出了著名的「隆中对」。", "诸葛亮出山后，尽心辅佐刘备，建立了蜀汉。「三顾茅庐」告诉我们：真诚和坚持，是打动别人最好的方式。"], "collectWords": ["拜访", "诚意", "嘟囔", "打扰", "辅佐", "真诚"], "quiz": [{"q": "刘备一共去拜访了诸葛亮几次才见到？", "opts": ["一次", "两次", "三次"], "ans": 2, "why": "三顾茅庐，第三次才见到。"}, {"q": "第二次没见到诸葛亮时，刘备的态度是？", "opts": ["放弃了", "认为请人要有诚意，决定再来", "发脾气"], "ans": 1, "why": "刘备说「请他出山，要有诚意」。"}, {"q": "第三次拜访时，刘备是怎么表现诚意的？", "opts": ["送了很多礼物", "斋戒沐浴，在台阶下拱手站了几个时辰", "大声喊门"], "ans": 1, "why": "原文描述刘备不敢打扰午睡，站了好几个时辰。"}, {"q": "「三顾茅庐」告诉我们什么？", "opts": ["诸葛亮架子大", "真诚和坚持是打动别人最好的方式", "要多睡觉"], "ans": 1, "why": "结尾点明主旨。"}]}, {"id": "H58", "title": "完璧归赵", "theme": "成语", "paras": ["战国时候，赵王得到一块稀世宝玉「和氏璧」。秦王听说后，写信给赵王，说愿意用十五座城来换这块玉。赵王左右为难：答应吧，怕秦王说话不算数；不答应吧，又怕秦国来攻打。", "大臣蔺相如站出来说：「我愿意带着和氏璧去秦国。秦王真心给城，玉就留在秦国；他要是耍赖，我一定把玉完完整整地带回来。」", "到了秦国，蔺相如献上宝玉。秦王捧着玉爱不释手，绝口不提十五座城的事。蔺相如看出秦王没有诚意，就说：「大王，这玉上有个小斑点，让我指给您看。」秦王把玉递给他。蔺相如拿到玉，退到柱子旁，怒发冲冠地说：「您根本不想给城！如果您逼我，我就让这块玉和我的头一起撞碎在这柱子上！」秦王怕玉碎，只好让步。", "蔺相如暗暗派人把和氏璧从小路送回了赵国。宝玉完好无损地回到了祖国，这就是「完璧归赵」。蔺相如的机智和勇气，从此名扬天下。"], "collectWords": ["稀世", "为难", "爱不释手", "机智", "勇气", "耍赖"], "quiz": [{"q": "赵王为什么左右为难？", "opts": ["玉太贵重", "怕秦王不给城，又怕不答应招来攻打", "不知道玉值多少钱"], "ans": 1, "why": "原文说明答应与拒绝两方面的担心。"}, {"q": "蔺相如怎么从秦王手里拿回和氏璧的？", "opts": ["偷回来", "谎称玉上有斑点要指给秦王看", "花钱买通"], "ans": 1, "why": "他用「指斑点」为由把玉拿了回来。"}, {"q": "蔺相如拿到玉后怎么威胁秦王？", "opts": ["要烧了玉", "说玉和自己的头一起撞碎在柱子上", "要扔下悬崖"], "ans": 1, "why": "原文「让这块玉和我的头一起撞碎在这柱子上」。"}, {"q": "「完璧归赵」表现了蔺相如什么品质？", "opts": ["会骗人了", "临危不乱、有勇有谋", "力气大"], "ans": 1, "why": "蔺相如凭智慧和勇气保住国宝。"}]}, {"id": "H59", "title": "悬梁刺股", "theme": "成语", "paras": ["汉朝有个叫孙敬的人，特别好学。他常常读书到深夜，可是人总会犯困，一不小心就打起瞌睡来。孙敬想了个办法：用一根绳子，一头绑在自己的头发上，另一头系在房梁上。这样，只要头一低，绳子就会猛地拽住头发，疼得他一下子清醒过来，接着继续读书。", "战国时期，还有个叫苏秦的人。他年轻时到处碰壁，连家人都瞧不起他。苏秦决心发愤读书。夜里读书困了，他就拿起一把锥子，往自己大腿上刺一下，用疼痛赶走睡意，接着再读。", "就这样，孙敬和苏秦靠着惊人的毅力刻苦学习，后来都成了有大学问、大作为的人。", "今天我们当然不需要绑头发、刺大腿，但「悬梁刺股」的故事告诉我们：学习的路上没有捷径，所有的成就，都是刻苦和坚持换来的。想取得好成绩，就要舍得下功夫。"], "collectWords": ["犯困", "清醒", "毅力", "捷径", "刻苦", "成就"], "quiz": [{"q": "孙敬用什么办法赶走瞌睡？", "opts": ["喝咖啡", "用绳子绑住头发系在房梁上", "洗冷水脸"], "ans": 1, "why": "孙敬用绳子一头绑头发一头系房梁。"}, {"q": "苏秦为什么要在腿上刺锥子？", "opts": ["他受伤了", "用疼痛赶走睡意，继续读书", "练武功"], "ans": 1, "why": "苏秦刺股是为了赶走睡意接着读。"}, {"q": "「碰壁」在文中是什么意思？", "opts": ["撞到墙上", "做事不顺利，受挫折", "碰运气"], "ans": 1, "why": "碰壁指苏秦年轻时处处受挫、被人瞧不起。"}, {"q": "这个故事告诉我们学习的秘诀是什么？", "opts": ["绑头发", "刻苦和坚持，舍得下功夫", "锥子有用"], "ans": 1, "why": "结尾点明「所有的成就，都是刻苦和坚持换来的」。"}]}, {"id": "H60", "title": "约法三章", "theme": "成语", "paras": ["秦朝末年，刘邦率领起义军打进了秦国的都城咸阳。秦王子婴投降，强大的秦朝就这样灭亡了。刘邦走进富丽堂皇的阿房宫，看着满宫的金银珠宝和美酒，很想留下来享受一番。", "大将樊哙和谋士张良劝他：「秦朝就是因为太奢侈、太贪婪，才丢了天下。您如果也贪图享受，走秦朝的老路，人心就要散了！」刘邦听了，立刻醒悟过来，下令封存府库，带着军队退出了咸阳。", "为了安定民心，刘邦把关中各县的父老乡亲请来，和他们约定三条法令：第一，杀人的要偿命；第二，伤人的要治罪；第三，偷盗抢劫的要处罚。除此之外，秦朝那些苛刻的法律全部废除。乡亲们听了，欢天喜地，争着送来牛羊酒食慰劳军队。", "刘邦的「约法三章」简单明白，保护了百姓，赢得了人心。后来他能在楚汉之争中战胜项羽，靠的正是这份民心。这个故事说明：赢得信任最好的办法，就是说到做到、取信于人。"], "collectWords": ["投降", "奢侈", "醒悟", "民心", "废除", "信任"], "quiz": [{"q": "刘邦进咸阳后最初想做什么？", "opts": ["马上离开", "留下来享受宫中的珠宝美酒", "烧了宫殿"], "ans": 1, "why": "原文说他「很想留下来享受一番」。"}, {"q": "樊哙和张良用什么道理劝醒了刘邦？", "opts": ["宫殿有危险", "秦朝因奢侈贪婪失天下，不能走老路", "珠宝是假的"], "ans": 1, "why": "他们提醒刘邦秦朝灭亡的教训。"}, {"q": "「约法三章」是哪三条？", "opts": ["不准杀人、伤人、偷盗", "交粮、纳税、服役", "不抢、不烧、不杀"], "ans": 0, "why": "原文三条：杀人偿命、伤人治罪、偷盗处罚。"}, {"q": "这个故事说明赢得信任最好的办法是什么？", "opts": ["金银珠宝", "说到做到、取信于人", "强大的军队"], "ans": 1, "why": "结尾点明主旨。"}]}, {"id": "H61", "title": "小宇的零花钱计划", "theme": "生活", "paras": ["小宇每个月有三十元零花钱。以前，钱一到手，他就冲向小卖部，不到三天就花个精光，然后眼巴巴地盼着下个月。妈妈没有批评他，只是说：「要不要试试做个计划？」", "小宇想了想，把钱分成三份：第一份十元，放进「需要」的口袋，用来买文具；第二份十元，放进「想要」的口袋，攒起来买他心心念念的科学实验套装；第三份十元，放进「储蓄」的口袋，雷打不动地存进储钱罐。", "第一个月真难熬。路过小卖部，辣条和卡片都在向他招手。小宇好几次把手伸进口袋，又缩了回来：「实验套装要六十元，攒六个月就够了。现在花了，套装就永远买不成了。」", "半年后，小宇抱着实验套装回家，储钱罐里还有整整六十元。他终于明白了妈妈的话：钱不是用来忍住不花的，而是用在对的地方的。会计划的人，才能把日子过成自己想要的样子。"], "collectWords": ["零花钱", "计划", "储蓄", "雷打不动", "心心念念", "招手"], "quiz": [{"q": "小宇以前的零花钱为什么三天就花光？", "opts": ["钱太少了", "钱一到手就乱花，没有计划", "小卖部太贵"], "ans": 1, "why": "原文说他以前钱到手就冲向小卖部。"}, {"q": "小宇把零花钱分成了哪三份？", "opts": ["吃的、玩的、存的", "需要、想要、储蓄", "文具、零食、玩具"], "ans": 1, "why": "原文分「需要」「想要」「储蓄」三份。"}, {"q": "小宇忍住不买辣条时，心里想的办法是什么？", "opts": ["告诉自己辣条不好吃", "用目标提醒自己：现在花了就买不成套装", "让妈妈管着"], "ans": 1, "why": "他用套装的目标管住自己。"}, {"q": "这个故事告诉我们什么？", "opts": ["零花钱越少越好", "会计划、分轻重，才能把日子过成想要的样子", "小孩子不该有零花钱"], "ans": 1, "why": "结尾点明：会用计划安排钱。"}]}, {"id": "H62", "title": "为什么饭前便后要洗手", "theme": "生活", "paras": ["「洗手去！」这句话，你是不是每天都要听好几遍？别嫌烦，这小小的动作里，藏着大大的学问。", "我们的手一天到晚摸东摸西：摸门把手、摸钱、摸玩具、摸小动物……这些地方住着数不清的细菌，小到我们肉眼根本看不见。科学家做过实验：一只没洗过的手上，细菌能有几万个甚至几十万个！如果就这样拿东西吃，细菌就会搭着食物的「顺风车」溜进我们的肚子，在里面捣乱，让人肚子疼、拉肚子，甚至发烧生病。", "正确的洗手方法也有讲究：先用流动的水打湿双手，抹上肥皂，手心、手背、指缝、指甲缝都要搓到，至少搓二十秒——差不多是唱两遍《生日快乐歌》的时间，最后用清水冲干净。", "别小看这二十秒。医生们说，勤洗手是预防很多疾病最简单、最便宜、最有效的办法。从今天起，认真洗手，做自己健康的小卫士吧！"], "collectWords": ["细菌", "顺风车", "流动", "讲究", "预防", "卫士"], "quiz": [{"q": "没洗过的手上大约有多少细菌？", "opts": ["几个", "几百个", "几万到几十万个"], "ans": 2, "why": "原文说「几万个甚至几十万个」。"}, {"q": "细菌是怎么让人生病的？", "opts": ["咬人", "跟着食物进入肚子里捣乱", "让人手痒"], "ans": 1, "why": "细菌搭食物的「顺风车」进肚子捣乱。"}, {"q": "搓洗双手至少要多少时间？", "opts": ["五秒钟", "二十秒", "两分钟"], "ans": 1, "why": "原文「至少搓二十秒，差不多唱两遍生日快乐歌」。"}, {"q": "洗手被医生们称为预防疾病的什么办法？", "opts": ["最贵的", "最简单、最便宜、最有效的", "最麻烦的"], "ans": 1, "why": "结尾引用医生的话。"}]}, {"id": "H63", "title": "小区里的「共享爷爷」", "theme": "生活", "paras": ["我们小区有位张爷爷，退休前是修表师傅。谁家孩子的自行车链子掉了，谁家的台灯不亮了，大家第一个想到的就是他。张爷爷从不拒绝，总是笑呵呵地说：「小毛病，我看看。」", "去年冬天特别冷。一天夜里，六楼的王奶奶家水管冻裂了，水哗哗地流。王奶奶的儿女都在外地，急得直掉眼泪。张爷爷披着棉袄就上了楼，先关总闸，再打电话联系维修，还帮着一盆一盆地往外舀水，忙到凌晨两点。", "第二天，王奶奶要给他钱，张爷爷摆摆手：「远亲不如近邻。我帮大家，大家也没少帮我——我住院那会儿，整栋楼的邻居轮流给我送饭呢！」", "这件事后，我们小区多了一个「互助角」：谁家有多余的工具、图书，都放在那里供大家借用。张爷爷说：「好东西要流动起来，好心也一样。」"], "collectWords": ["退休", "笑呵呵", "远亲不如近邻", "互助", "流动", "拒绝"], "quiz": [{"q": "为什么大家有事第一个想到张爷爷？", "opts": ["他是物业的", "他是退休修表师傅，乐于助人", "他是小区保安"], "ans": 1, "why": "张爷爷是修表师傅，从不拒绝大家的求助。"}, {"q": "王奶奶家水管冻裂后，张爷爷做了什么？", "opts": ["打电话叫了物业", "关总闸、联系维修、帮忙舀水忙到凌晨", "第二天才去"], "ans": 1, "why": "原文详述了他的三个动作。"}, {"q": "张爷爷为什么不肯收钱？", "opts": ["钱太少", "他认为邻里之间就该互相帮助", "他不缺钱"], "ans": 1, "why": "他说「远亲不如近邻」，还提到邻居们也帮过他。"}, {"q": "「好东西要流动起来，好心也一样」是什么意思？", "opts": ["东西要传来传去", "善意和分享会让整个社区更温暖", "工具要常用"], "ans": 1, "why": "互助角的设立正是好心流动的结果。"}]}, {"id": "H64", "title": "一次「断网」的周末", "theme": "生活", "paras": ["周五晚上，朵朵家的路由器坏了，要周一才能来修。朵朵急得直跺脚：「没有网络，这个周末可怎么过呀！」", "周六早上，没有了动画片的朵朵无聊得在屋里转圈。爸爸提议：「要不，我们把阳台整理出来种花吧？」父女俩松土、播种、浇水，忙了一上午。朵朵的手指缝里塞满了泥土，鼻尖上还沾着土，可她笑得特别开心。下午，妈妈教她包饺子，朵朵包的饺子歪歪扭扭，像一群小鸭子，下锅后一个都没破。", "周日，全家去了郊外的绿道。朵朵第一次发现，原来蜻蜓的翅膀上有细密的纹路，蚂蚁搬家时真的会排成长队。晚上，她趴在窗边数星星，数着数着就睡着了。", "周一，路由器修好了。朵朵却跑到爸爸面前说：「下个周末，我们再去种点什么吧！」原来，放下屏幕的周末，一点也不无聊。"], "collectWords": ["无聊", "提议", "歪歪扭扭", "细密", "纹路", "屏幕"], "quiz": [{"q": "朵朵一开始为什么觉得周末没法过？", "opts": ["作业太多", "家里路由器坏了，不能上网", "下雨了不能出门"], "ans": 1, "why": "朵朵习惯了用网络打发时间。"}, {"q": "断网的周末，朵朵做了哪几件事？", "opts": ["睡觉、发呆、看电视", "种花、包饺子、去绿道", "打游戏、逛商场"], "ans": 1, "why": "原文写了种花、包饺子、绿道观察三件事。"}, {"q": "朵朵在绿道有什么新发现？", "opts": ["绿道很长", "蜻蜓翅膀有纹路、蚂蚁排队搬家", "有卖冰淇淋的"], "ans": 1, "why": "这是她第一次认真观察自然。"}, {"q": "这个故事想告诉我们什么？", "opts": ["路由器容易坏", "放下屏幕，真实的生活同样精彩", "种花很有趣"], "ans": 1, "why": "结尾「放下屏幕的周末，一点也不无聊」点题。"}]}, {"id": "H65", "title": "烫伤之后的十分钟", "theme": "生活", "paras": ["星期天，乐乐帮妈妈端汤，手一滑，滚烫的汤洒在了手背上。乐乐疼得大叫，手背立刻红了一片。", "奶奶赶紧拿来牙膏要给他抹，妈妈连忙拦住：「妈，烫伤不能抹牙膏！牙膏糊在上面，热量散不出去，还会增加感染的风险。」妈妈一边说，一边把乐乐的手放到水龙头下，用缓缓的流动凉水冲。", "「要冲多久呀？」乐乐含着眼泪问。「至少十五到二十分钟，让热量彻底带走。」妈妈安慰他，「冲水是最重要的一步，比抹任何药都管用。」冲完水，妈妈用干净的纱布轻轻盖住伤口，带乐乐去了社区医院。医生说：「处理得很及时，很正确，不然要起大水泡了。」", "回家的路上，妈妈教乐乐记住烫伤急救五字口诀：「冲、脱、泡、盖、送」——凉水冲、脱去覆盖的衣物、冷水浸泡、干净纱布盖住、送医院。乐乐说：「我记住了，还要教给我们班同学！」"], "collectWords": ["烫伤", "感染", "口诀", "安慰", "及时", "急救"], "quiz": [{"q": "乐乐烫伤后，妈妈做的第一件事是什么？", "opts": ["抹牙膏", "用流动的凉水冲", "打电话"], "ans": 1, "why": "妈妈拦住抹牙膏，立刻用凉水冲。"}, {"q": "为什么烫伤不能抹牙膏？", "opts": ["牙膏太贵", "热量散不出去，还会增加感染风险", "牙膏会染色"], "ans": 1, "why": "妈妈解释了牙膏的危害。"}, {"q": "烫伤急救五字口诀是什么？", "opts": ["冲、脱、泡、盖、送", "冲、洗、抹、包、走", "洗、泡、擦、扎、送"], "ans": 0, "why": "原文口诀：冲、脱、泡、盖、送。"}, {"q": "医生为什么说处理得很及时正确？", "opts": ["妈妈懂医", "冲水等处理避免了起大水泡", "送得快"], "ans": 1, "why": "医生说正确处理避免了更严重的后果。"}]}, {"id": "H66", "title": "阳台上的绿豆实验", "theme": "生活", "paras": ["科学课上，老师布置了一个任务：回家种几颗绿豆，观察并记录发芽的过程。小雅挑了六颗饱满的绿豆，分成两组：一组放在有阳光的阳台，一组放进阴暗的柜子里，两组浇一样多的水。", "第一天，两组绿豆都涨得圆鼓鼓的，像吃饱的小胖子。第三天，阳台那组冒出了白白的小芽，柜子里的也发芽了，而且好像蹿得更高。小雅很奇怪：「没有阳光，怎么长得还快？」", "第七天，差别出来了：阳台的豆芽又矮又壮，豆瓣中间撑开了两片绿绿的真叶，迎着阳光精神抖擞；柜子里的豆芽却又细又长，颜色发黄，东倒西歪，风一吹就倒。", "科学课上，老师解开了小雅的疑惑：柜子里的豆芽拼命伸长，是在「寻找阳光」，这叫「徒长」，看着高，其实弱不禁风；阳台的豆芽有了阳光，就能进行光合作用，自己制造养分，长得结实。小雅在观察日记的最后写道：「长得快不等于长得好。人也一样，踏踏实实吸收营养，比虚胖的长个儿更重要。」"], "collectWords": ["饱满", "观察", "徒长", "光合作用", "精神抖擞", "结实"], "quiz": [{"q": "小雅的实验里，两组绿豆有什么不同条件？", "opts": ["水量不同", "一组有阳光，一组没有", "绿豆品种不同"], "ans": 1, "why": "一组放阳台，一组放柜子，浇水相同。"}, {"q": "柜子里的豆芽为什么蹿得更高？", "opts": ["柜子暖和", "它拼命伸长去寻找阳光，这是徒长", "它更聪明"], "ans": 1, "why": "老师解释这叫徒长。"}, {"q": "阳台的豆芽长得结实，靠的是什么？", "opts": ["小雅照顾得好", "阳光让它能进行光合作用制造养分", "风吹的"], "ans": 1, "why": "有阳光就能光合作用。"}, {"q": "小雅从实验中悟出了什么道理？", "opts": ["绿豆很好种", "长得快不等于长得好，踏实吸收营养更重要", "柜子不能放豆子"], "ans": 1, "why": "结尾日记里的话点明感悟。"}]}, {"id": "H67", "title": "图书馆的「静悄悄」约定", "theme": "生活", "paras": ["周末，妈妈带朵朵去市图书馆。一进门，朵朵就被震撼了：一排排书架高得顶到天花板，成百上千的人安安静静地读书，只能听见翻书页的沙沙声。", "朵朵在儿童区挑了一本《昆虫记》，刚坐下来，旁边一个小男孩举着玩具车「呜呜呜」地开起了「赛车」。朵朵皱起眉，正想说什么，图书管理员阿姨轻轻走过去，蹲下身对小男孩说：「小朋友，你看大家都在做什么呀？」小男孩环顾四周，不好意思地收起玩具车，拿起了一本图画书。", "回家的路上，朵朵问妈妈：「为什么图书馆里要安静呢？」妈妈说：「因为读书需要专心。一个人发出声音，打扰的可能是周围几十个人。大家都克制一点，大家就都能受益——这叫『公共规则』。」", "朵朵若有所思：「就像过马路要看红绿灯一样？」妈妈笑了：「对。规则不是束缚，而是让所有人都能好好读书、好好生活的约定。」从那以后，朵朵不但在图书馆里安安静静，还成了小小「安静提醒员」。"], "collectWords": ["震撼", "克制", "公共规则", "束缚", "若有所思", "受益"], "quiz": [{"q": "朵朵进图书馆为什么被震撼了？", "opts": ["图书馆很大，人人都在安静读书", "书太多了", "图书馆很漂亮"], "ans": 0, "why": "原文描述书架高、人多而安静。"}, {"q": "管理员阿姨是怎么让小男孩安静的？", "opts": ["批评他", "轻轻提醒他看看周围人在做什么", "没收玩具"], "ans": 1, "why": "阿姨引导他自己观察体会。"}, {"q": "图书馆要安静的原因是什么？", "opts": ["规定就是这样", "一个人发声会打扰周围很多人，大家都克制就都受益", "书怕吵"], "ans": 1, "why": "妈妈解释了公共规则的道理。"}, {"q": "朵朵说规则像红绿灯，妈妈的解释是？", "opts": ["规则管得太宽", "规则不是束缚，是让大家都好的约定", "红灯停绿灯行"], "ans": 1, "why": "结尾妈妈的话点明主旨。"}]}, {"id": "H68", "title": "第一次自己坐公交", "theme": "生活", "paras": ["开学后，爸爸妈妈工作忙，小雨要试着自己坐公交车上学了。出发前一天晚上，妈妈和他做了三件事：把公交卡放进书包固定的夹层，在站台图上用红笔圈出上下车的站名，还玩了一遍「乘车演习」——妈妈扮司机，小雨练习上车刷卡、坐稳扶好。", "第一天，小雨顺利到校。可第二天就出了状况：他看窗外入了神，等反应过来，车已经开过了两站。小雨心里咯噔一下，手心直冒汗。他想起妈妈说过「慌的时候先深呼吸」，就深呼吸了三次，然后走到司机叔叔旁边，小声说：「叔叔，我坐过站了。」", "司机叔叔很和气：「别急，下一站下车，到对面坐回程车，两站就回来了。」小雨照做了。坐在回程的车上，他紧紧盯着窗外，一站一站地数，再也不敢走神了。", "晚上，小雨在日记里写：「今天我搞砸了一次，也学会了两件事：坐过站不丢人，开口求助很重要；做错一次，下次就会更专心。原来『长大』就是把错误变成经验。」"], "collectWords": ["演习", "状况", "走神", "求助", "经验", "深呼吸"], "quiz": [{"q": "妈妈和小雨做了哪三件准备？", "opts": ["买零食、带玩具、送上门", "放公交卡、圈站名、乘车演习", "背站名、记车牌、早起床"], "ans": 1, "why": "第一段列出三件事。"}, {"q": "小雨第二天遇到了什么状况？", "opts": ["公交卡丢了", "坐过了两站", "坐错了车"], "ans": 1, "why": "他看窗外入神，车开过两站。"}, {"q": "小雨是怎么解决问题的？", "opts": ["大哭", "深呼吸后主动向司机叔叔求助，坐回程车", "打电话给妈妈"], "ans": 1, "why": "他深呼吸冷静后向司机求助，按指引坐回程。"}, {"q": "「把错误变成经验」是什么意思？", "opts": ["错误越多越好", "从错误中吸取教训，下次做得更好", "错误就是经验"], "ans": 1, "why": "小雨坐过站后学会了冷静求助和专心。"}]}, {"id": "H69", "title": "一碗面的温度", "theme": "生活", "paras": ["巷口有家小面馆，老板是对中年夫妻。面馆不大，生意却很好，因为墙上贴着一张特别的告示：「如果你今天遇到了难处，只要说一声『来一碗A套餐』，就可以免费吃一碗面，不用付钱的。」", "一个下雨天，一个浑身湿透的叔叔站在门口徘徊了很久，才低低地说：「请问……还有A套餐吗？」老板娘立刻笑着迎上去：「有！快进来坐！」她端上来的，是一碗热气腾腾的牛肉面，还卧着一个荷包蛋。叔叔吃着吃着，眼圈红了。", "原来，老板夫妻俩年轻时来城里打工，有一回钱包丢了，饿了一整天。是一家面馆的老板免费给他们下了两碗面。那份温暖，他们记了二十年。开面馆后，他们立下了「A套餐」的规矩，想把这份温暖传下去。", "后来，那位雨天吃面的叔叔找到了工作。他再来面馆时，除了付自己的面钱，还偷偷多付了两碗的钱，对老板说：「记在A套餐里。」一碗面，就这样越传越暖。"], "collectWords": ["告示", "徘徊", "热气腾腾", "荷包蛋", "温暖"], "quiz": [{"q": "「A套餐」是什么？", "opts": ["最贵的面", "给遇到难处的人免费吃的一碗面", "特价套餐"], "ans": 1, "why": "告示写着说「来一碗A套餐」就能免费吃面。"}, {"q": "老板夫妻为什么设立A套餐？", "opts": ["吸引顾客", "他们年轻时受过别人一碗面的温暖，想传下去", "面太多了"], "ans": 1, "why": "他们记了二十年那份温暖。"}, {"q": "吃面的叔叔后来做了什么？", "opts": ["天天来吃", "找到工作后多付两碗钱记在A套餐里", "再也不来了"], "ans": 1, "why": "他把温暖继续传递下去。"}, {"q": "「一碗面，就这样越传越暖」说的是什么在传递？", "opts": ["面条", "人与人之间的善意和温暖", "钱"], "ans": 1, "why": "善意从老板传到叔叔，又传给下一个人。"}]}, {"id": "H70", "title": "手机「争夺战」和平协议", "theme": "生活", "paras": ["浩浩家最近总上演「争夺战」：浩浩想看手机动画，妈妈怕他眼睛近视，一部手机抢来抢去，谁也不开心。", "周五晚上，妈妈没有发火，而是拿出一沓便签纸：「我们来开个家庭会议，一起定一份『手机使用协议』，你也有发言权。」浩浩惊讶地瞪大了眼睛。", "一家人你一条我一条，最后写下五条约定：一、浩浩每天看动画不超过三十分钟，用沙漏计时；二、吃饭和睡前一小时，全家都不碰手机；三、周末完成阅读和作业后，可以自由使用一小时；四、违反的人第二天减少十五分钟；五、爸爸妈妈同样要遵守。最后，三个人都在协议上签了名，还贴在了冰箱上。", "协议执行了一个月，家里的「争夺战」再也没有上演过。浩浩说：「原来规则不是我一个人遵守，而是大家一起遵守。这样，我也愿意守约。」妈妈笑着说：「对，这就叫『公平』。」"], "collectWords": ["争夺战", "发言权", "约定", "计时", "公平", "遵守"], "quiz": [{"q": "浩浩家原来的「争夺战」是怎么回事？", "opts": ["抢电视", "浩浩想看动画，妈妈怕他近视，互相抢手机", "抢玩具"], "ans": 1, "why": "第一段描述了手机争夺。"}, {"q": "妈妈用什么办法解决了矛盾？", "opts": ["没收手机", "开家庭会议，一起定使用协议", "买了新手机"], "ans": 1, "why": "妈妈提议一起定协议，还给浩浩发言权。"}, {"q": "协议里最特别的一条是什么？", "opts": ["可以用一小时", "爸爸妈妈同样要遵守", "违反要罚"], "ans": 1, "why": "连爸爸妈妈也要遵守，体现了公平。"}, {"q": "浩浩为什么愿意守约了？", "opts": ["怕被罚", "规则是大家一起定的、一起遵守的，很公平", "妈妈盯得紧"], "ans": 1, "why": "浩浩说大家一起遵守他才愿意。"}]}, {"id": "H71", "title": "外婆的蒲扇", "theme": "生活", "paras": ["暑假，朵朵去乡下外婆家。村里晚上停电，空调电扇全罢了工，热得人睡不着。外婆不慌不忙，从床头摸出一把旧蒲扇，坐在朵朵床边，一下一下地扇起来。", "蒲扇的风轻轻的，带着稻草的清香。朵朵迷迷糊糊要睡着时，忽然想起：「外婆，您不热吗？」外婆笑着说：「外婆小时候，你太婆也是这样给我扇的。一把扇子，扇走了蚊子，扇凉了夏夜，也扇大了一代又一代人。」", "第二天，朵朵跟着外婆学编蒲扇。蒲草又韧又滑，朵朵的手指头被划出了小口子，外婆却只夸她：「会疼，说明你在认真学。」朵朵咬着牙，编出了一把歪歪扭扭的小蒲扇。", "回城那天，外婆把一把崭新的蒲扇塞进朵朵的行李箱。城市里有空调，可朵朵还是常常拿出蒲扇扇一扇。她说：「这把扇子里，扇出来的都是外婆的爱。」"], "collectWords": ["蒲扇", "不慌不忙", "清香", "崭新"], "quiz": [{"q": "停电的夜晚，外婆用什么帮朵朵入睡？", "opts": ["讲故事", "用旧蒲扇一下一下扇风", "点蚊香"], "ans": 1, "why": "外婆拿蒲扇给朵朵扇风。"}, {"q": "外婆说「一把扇子扇大了一代又一代人」是什么意思？", "opts": ["扇子很耐用", "蒲扇的清凉里藏着代代相传的疼爱", "扇子传家宝"], "ans": 1, "why": "太婆给外婆扇，外婆给朵朵扇，爱就这样传下来。"}, {"q": "朵朵学编蒲扇时划破了手，外婆为什么还夸她？", "opts": ["外婆没注意", "会疼说明她在认真学", "小口子不严重"], "ans": 1, "why": "外婆的话肯定了朵朵的认真。"}, {"q": "朵朵回城后还常用蒲扇，是因为什么？", "opts": ["家里没空调", "蒲扇里有外婆的爱，是她珍藏的牵挂", "蒲扇好看"], "ans": 1, "why": "朵朵说扇出来的都是外婆的爱。"}]}, {"id": "H72", "title": "迟到的那五分钟", "theme": "生活", "paras": ["小宇是学校合唱团的领唱。周五下午有重要比赛，老师再三叮嘱：三点半集合，谁都不能迟到。小宇中午回家吃饭，看着时间还早，就打了一局游戏，结果一看表——三点二十！他抓起外套冲出家门。", "跑到半路，小宇看见一位老奶奶提着两大袋菜，站在斑马线前不敢动——车流太多了。小宇看看表，又看看老奶奶，一咬牙停了下来：「奶奶，我扶您过去。」老奶奶连声道谢。", "等他把奶奶送到马路对面再跑到学校，已经三点三十五了。合唱团的同学们早就排好了队，就等他一个人。老师的脸沉了下来。小宇红着脸，把路上发生的事一五一十说了。", "教室里安静了几秒钟，老师忽然带头鼓起了掌：「迟到要批评，但你的选择值得表扬。记住今天的教训：以后要把时间留足，也要永远留住这颗善良的心。」后来，小宇成了合唱团里守时的标杆，因为那天他同时学会了守时和善良。"], "collectWords": ["叮嘱", "斑马线", "一五一十", "标杆", "守时", "善良"], "quiz": [{"q": "小宇为什么会差点迟到？", "opts": ["睡过头", "看时间还早就打了局游戏", "路上堵车"], "ans": 1, "why": "他打游戏误了时间。"}, {"q": "小宇迟到的直接原因是什么？", "opts": ["起晚了", "停下来扶老奶奶过马路", "跑错了路"], "ans": 1, "why": "他停下帮助老奶奶，多花了五分钟。"}, {"q": "老师为什么先沉脸后又鼓掌？", "opts": ["老师心情变了", "迟到该批评，但帮助老人的选择值得表扬", "同学们求情"], "ans": 1, "why": "老师批评迟到，表扬善良。"}, {"q": "这个故事告诉我们应该怎样平衡两件事？", "opts": ["守时比善良重要", "既要吸取教训把时间留足，也要永远留住善良", "善良比守时重要"], "ans": 1, "why": "老师的话说明两者都要：守时+善良。"}]}, {"id": "H73", "title": "爸爸的旧自行车", "theme": "生活", "paras": ["爸爸有一辆很旧的自行车，车把上的漆都掉了，铃铛也哑了。小区里别的爸爸都开汽车，乐乐有点不好意思，总说：「爸，咱也换辆电动车吧。」爸爸只是笑笑：「这辆车，可是咱家的功臣。」", "乐乐不明白。爸爸指着车架上一道道磨痕说：「你出生那年，我每天骑它去上班，来回二十公里；你三岁发高烧的那个夜里，下暴雨打不到车，是我骑它把你送到医院的；你上小学第一天，也是我骑它送你去的，你在后座上唱着歌。」", "乐乐摸着那些磨痕，忽然觉得它们不再是难看的伤疤，而是一枚枚勋章。他小声问：「爸，那它还能骑多久？」爸爸说：「只要好好保养，再骑十年也没问题。物件和人一样，你珍惜它，它就长久地陪着你。」", "从那以后，乐乐常常和爸爸一起擦车、上油、紧螺丝。同学再笑话这辆旧车时，乐乐会挺起胸脯说：「这是我们家的功臣，每一道痕迹都是故事。」"], "collectWords": ["功臣", "磨痕", "勋章", "保养", "珍惜", "挺起胸脯"], "quiz": [{"q": "乐乐一开始为什么想换掉自行车？", "opts": ["车不好骑", "别的爸爸都开汽车，他觉得不好意思", "车太旧会坏"], "ans": 1, "why": "乐乐觉得旧自行车没面子。"}, {"q": "爸爸说的磨痕里，不包括哪一件事？", "opts": ["夜里送高烧的乐乐去医院", "骑车去旅行", "送乐乐上小学第一天"], "ans": 1, "why": "磨痕对应上班、送医、送上学，没有旅行。"}, {"q": "乐乐为什么把磨痕看成「勋章」？", "opts": ["勋章好看", "每道磨痕都记录着爸爸的付出和家的故事", "他想卖车"], "ans": 1, "why": "磨痕背后是爱和记忆。"}, {"q": "爸爸说的「物件和人一样」想表达什么？", "opts": ["自行车很贵", "珍惜的东西会长久陪伴", "旧东西都要扔"], "ans": 1, "why": "爸爸借自行车讲珍惜的道理。"}]}, {"id": "H74", "title": "楼道里的灯光", "theme": "生活", "paras": ["我们楼的声控灯坏了好几层。晚上回家，楼道里黑漆漆的，二楼腿脚不好的赵奶奶摔了一跤。大家在业主群里抱怨物业，物业说零件缺货，要等。", "三楼的大学生哥哥看到了群里的消息，什么也没说。第二天，他从网上买了感应小夜灯，一层一层地装。装到二楼时，赵奶奶拉着他的手直说谢谢。哥哥笑着说：「奶奶，抱怨不如动手。灯亮了，大家就都安全了。」", "夜灯装好的第一个晚上，整栋楼的楼道都亮堂堂的。大家上下楼时脚步都轻快了。有人在群里说：「原来解决问题，不一定非要等别人。」", "后来，楼里成立了「楼道小管家」志愿队：谁发现灯不亮了、扶手松了，就在群里说一声，大家一起想办法。大学生哥哥说：「楼是大家的，点亮楼道的人，也可以是每一个人。」"], "collectWords": ["抱怨", "感应", "志愿", "安全", "解决", "亮堂堂"], "quiz": [{"q": "楼道灯坏了以后，大家最初是怎么做的？", "opts": ["自己买灯", "在群里抱怨物业，等物业修", "搬家"], "ans": 1, "why": "原文大家抱怨，物业说缺货要等。"}, {"q": "大学生哥哥是怎么解决问题的？", "opts": ["催物业", "自己买感应夜灯一层层装上", "收大家的钱"], "ans": 1, "why": "他自费买灯并安装。"}, {"q": "「抱怨不如动手」这句话是什么意思？", "opts": ["不要说话", "与其抱怨等待，不如自己动手解决问题", "物业没用"], "ans": 1, "why": "哥哥用行动代替抱怨。"}, {"q": "「点亮楼道的人，也可以是每一个人」想告诉我们什么？", "opts": ["装灯很简单", "公共环境靠大家，每个人都能出一份力", "要多买夜灯"], "ans": 1, "why": "楼道小管家志愿队正是人人参与的结果。"}]}, {"id": "H75", "title": "一句「对不起」的力量", "theme": "生活", "paras": ["体育课上，小杰抢球时撞倒了同桌明明，明明的膝盖磕破了一大块皮，疼得眼泪直打转。小杰慌了，站在旁边搓着手，半天憋出一句：「我……我又不是故意的。」明明一听，哭得更凶了。", "放学路上，小杰心里像压了块石头。他想起老师说过：「说『不是故意的』，是在保护自己；说『对不起』，才是在安慰别人。」他转身跑回教室，明明还在那里揉膝盖。小杰走到他面前，认认真真地鞠了一躬：「对不起，是我撞倒了你，你摔疼了吧？明天你的值日我包了，书包我也帮你背！」", "明明抬起头，眼泪还挂着，却「扑哧」笑了：「其实……你抢球的样子还挺帅的。」两个人都笑了，手拉手出了校门。", "第二天，小杰真的帮明明做了值日。老师也知道了这件事，在班会上说：「道歉不是认输，而是勇敢。一句真诚的对不起，能让两个人的心都轻松。」"], "collectWords": ["磕破", "慌了", "真诚", "安慰", "轻松", "道歉"], "quiz": [{"q": "明明为什么听了「不是故意的」哭得更凶？", "opts": ["伤口更疼了", "这句话只为自己开脱，没有安慰到他", "他不喜欢小杰"], "ans": 1, "why": "老师说「不是故意的」是保护自己，不是安慰别人。"}, {"q": "小杰心里「像压了块石头」是什么描写？", "opts": ["真的石头", "用比喻写他内疚不安的心情", "肚子疼"], "ans": 1, "why": "比喻他心里愧疚难受。"}, {"q": "小杰真正的道歉包括哪几个部分？", "opts": ["只说了对不起", "承认错误+关心对方+用行动弥补", "送礼物"], "ans": 1, "why": "他说对不起、问疼不疼、包值日帮背书包。"}, {"q": "「道歉不是认输，而是勇敢」告诉我们什么？", "opts": ["道歉会输", "真诚道歉需要勇气，还能让彼此轻松", "不要道歉"], "ans": 1, "why": "结尾老师的话点明道歉的意义。"}]}];
distribute(CONTENT_DATA);

/* ============ 挑战页 ============ */
let quizIdx=0, quizRight=0, seqPicked=[], expressDone=false;
function startChallenge(){
  quizIdx=0; quizRight=0; seqPicked=[]; expressDone=false;
  show('challengeScreen');
  const t = curLevel.type;
  if(t==='sequence') renderSequence();
  else if(t==='branch') renderBranch();
  else renderQuiz();
}

function challengeHead(txt){
  return '<div style="font-size:13px;color:#90A4AE;">'+curLevel.name+' · 挑战</div>'+
         '<h2 style="font-size:20px;margin:6px 0 12px;">'+txt+'</h2>';
}

/* --- 阅读理解题 --- */
function renderQuiz(){
  const qs = curStory.quiz;
  if(quizIdx >= qs.length){
    if(curLevel.type==='express' && !expressDone){ expressDone=true; renderExpress(); return; }
    finishChallenge(); return;
  }
  const q = qs[quizIdx];
  const el = document.getElementById('challengeBody');
  el.innerHTML = challengeHead('动动脑筋（第 '+(quizIdx+1)+' / '+qs.length+' 题）')+
    '<div class="quiz-q">'+q.q+'</div>'+
    q.opts.map((o,i)=>'<div class="quiz-opt" data-i="'+i+'"><span class="abc">'+'ABC'[i]+'</span><span>'+o+'</span></div>').join('');
  el.querySelectorAll('.quiz-opt').forEach(opt=>{
    opt.onclick = ()=>{
      if(opt.dataset.done) return;
      el.querySelectorAll('.quiz-opt').forEach(o=>o.dataset.done='1');
      const i = +opt.dataset.i;
      if(i===q.ans){
        opt.classList.add('right');
        quizRight++; S.xp += 10;
        toast('🎉 答对啦！+10 XP', 1400);
      }else{
        opt.classList.add('wrong');
        el.querySelector('.quiz-opt[data-i="'+q.ans+'"]').classList.add('right');
        toast('💡 正确答案是 '+('ABC'[q.ans])+'：'+q.why, 3200);
      }
      save();
      setTimeout(()=>{ quizIdx++; renderQuiz(); }, i===q.ans?1300:3000);
    };
  });
}

/* --- 段落排序（从本篇paras自动生成） --- */
function renderSequence(){
  const n = Math.min(4, curStory.paras.length);
  const items = curStory.paras.slice(0, n);
  const order = items.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  if(order.every((v,i)=>v===i)) order.reverse();
  const el = document.getElementById('challengeBody');
  el.innerHTML = challengeHead('段落排排队')+
    '<p style="font-size:14.5px;color:#78909C;line-height:1.7;margin-bottom:8px;">下面的段落被打乱了，按你在故事里读到的先后顺序点击它们：</p>'+
    order.map(i=>'<div class="seq-item" data-i="'+i+'">'+items[i].slice(0,50)+(items[i].length>50?'…':'')+'</div>').join('')+
    '<button class="bigbtn btn-orange" id="seqOk" style="margin-top:16px;">排好啦，提交！</button>';
  seqPicked = [];
  el.querySelectorAll('.seq-item').forEach(item=>{
    item.onclick=()=>{
      if(item.classList.contains('picked')) return;
      item.classList.add('picked');
      seqPicked.push(+item.dataset.i);
      item.insertAdjacentHTML('afterbegin','<span class="seq-order">'+seqPicked.length+'</span>');
    };
  });
  document.getElementById('seqOk').onclick=()=>{
    if(seqPicked.length < items.length){ toast('还有段落没排上哦！'); return; }
    const right = seqPicked.every((v,idx)=>v===idx);
    if(right){
      const okBtn = document.getElementById('seqOk');
      if(okBtn.disabled) return; okBtn.disabled=true; okBtn.style.opacity=0.5;
      toast('🎉 太棒了！顺序完全正确！+30 XP', 2000);
      S.xp += 30; save();
      setTimeout(()=>renderQuiz(), 1500);
    }else{
      toast('🤔 顺序不太对，再回想一下故事的发展！', 2200);
      setTimeout(()=>renderSequence(), 1800);
    }
  };
}

/* --- 启示选择（从本篇道理题生成二选一） --- */
function renderBranch(){
  // 找道理题：优先选含"道理/告诉/明白/启示"的题，否则用最后一题
  let mq = curStory.quiz.find(q=>/道理|告诉|明白|启示|寓意/.test(q.q)) || curStory.quiz[curStory.quiz.length-1];
  const rightOpt = mq.opts[mq.ans];
  const wrongOpt = mq.opts[(mq.ans+1)%mq.opts.length];
  const opts = [{t:rightOpt,good:true},{t:wrongOpt,good:false}];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const el = document.getElementById('challengeBody');
  el.innerHTML = challengeHead('故事的启示')+
    '<p style="font-size:14.5px;color:#78909C;line-height:1.7;">读完了「'+curStory.title+'」，你觉得这个故事最想告诉我们什么？</p>'+
    opts.map((o,i)=>'<button class="choice-btn" data-i="'+i+'">'+['🅰️','🅱️'][i]+' '+o.t+'</button>').join('');
  el.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.onclick=()=>{
      if(el.dataset.chosen) return; el.dataset.chosen='1';
      const o = opts[+btn.dataset.i];
      if(o.good){ S.xp += 30; quizRight++; } else { S.xp += 15; }
      S.quizLog.push({d:todayKey(), r:o.good?1:0, t:1});
      save();
      el.innerHTML = challengeHead('故事的启示')+
        '<div class="story-text"><p>'+(o.good
          ? '🌟 说得对！「'+rightOpt+'」——这就是这个故事想告诉我们的道理。'+(mq.why?mq.why:'')
          : '💭 再想一想哦。这个故事真正想说的是：「'+rightOpt+'」。'+(mq.why?mq.why:''))+'</p></div>'+
        '<p style="color:'+(o.good?'#43A047':'#FB8C00')+';font-weight:bold;margin-top:8px;">'+(o.good?'+30 XP':'+15 XP，继续加油！')+'</p>'+
        '<button class="bigbtn btn-blue" id="brNext" style="margin-top:14px;">继续挑战 →</button>';
      document.getElementById('brNext').onclick=()=>{
        // 剩余的quiz题（跳过已用作启示的题）
        curStory.quiz = curStory.quiz.filter(q=>q!==mq);
        renderQuiz();
      };
    };
  });
}

/* --- 表达挑战 --- */
function renderExpress(){
  const prompts = [
    '用自己的话把「'+curStory.title+'」讲给爸爸妈妈听',
    '这个故事里，你最喜欢谁（或哪个部分）？为什么？',
    '读完这个故事，你想到了什么？说一句你的收获'
  ];
  const el = document.getElementById('challengeBody');
  el.innerHTML = challengeHead('小小表达家')+
    '<p style="font-size:14.5px;color:#78909C;line-height:1.7;">选一个话题，大声说出来，或者写在小本子上。说完后点下面的按钮：</p>'+
    prompts.map(p=>'<div class="seq-item" style="cursor:default;">💬 '+p+'</div>').join('')+
    '<button class="bigbtn btn-pink" id="exOk" style="margin-top:16px;">🎤 我说完啦！</button>';
  const exBtn = document.getElementById('exOk');
  exBtn.onclick=()=>{
    if(exBtn.disabled) return; exBtn.disabled=true; exBtn.style.opacity=0.5;
    S.xp += 30; save();
    toast('🌟 表达小明星！+30 XP', 1800);
    setTimeout(()=>finishChallenge(), 1200);
  };
}

/* ============ 关卡结算 ============ */
function finishChallenge(){
  const qs = curStory.quiz;
  const totalQ = qs.length + (curLevel.type==='branch'?1:0);
  const ratio = totalQ? quizRight/totalQ : 1;
  const stars = ratio>=0.99?3 : ratio>=0.6?2 : 1;
  const prev = S.done[curLevel.id];
  const prevStars = prev ? prev.stars : 0;
  if(stars > prevStars){
    S.done[curLevel.id] = {stars, bestScore:ratio};
    S.stars += stars - prevStars;
  }
  S.xp += 40;
  if(curLevel.type!=='branch') S.quizLog.push({d:todayKey(), r:quizRight, t:totalQ});
  save();

  let extra='';
  if(curLevel.type==='collect'){
    extra = '<p style="margin-top:10px;font-size:14.5px;color:#7B1F3F;">💎 本次收集词语 '+collectedNow.size+' 个'+(collectedNow.size>=4?'，太厉害了！':'，下次试着找全 4 个以上哦！')+'</p>';
  }
  const poolRead = curLevel.pool.filter(s=>S.read[s.id]).length;
  extra += '<p style="margin-top:6px;font-size:13.5px;color:#78909C;">本关书库进度：'+poolRead+' / '+curLevel.pool.length+' 篇</p>';

  const mask = document.createElement('div');
  mask.className='reward-mask';
  mask.innerHTML =
    '<div class="reward-card">'+
      '<div class="big">'+(stars===3?'🏆':stars===2?'🎖️':'🎗️')+'</div>'+
      '<h2 style="margin:8px 0;">「'+curStory.title+'」完成！</h2>'+
      '<div style="font-size:30px;">'+'⭐'.repeat(stars)+'</div>'+
      '<p style="margin-top:8px;font-size:15px;">答题 '+quizRight+'/'+totalQ+' 正确 · 阅读字数 +'+storyChars(curStory)+'</p>'+
      extra+
      '<p style="margin-top:8px;font-size:14px;color:#FB8C00;font-weight:bold;">+40 XP 关卡奖励</p>'+
      '<button class="bigbtn btn-green" style="margin-top:16px;" id="rwNext">📚 再读一篇</button>'+
      '<button class="bigbtn btn-blue" style="margin-top:10px;" id="rwHome">返回冒险地图</button>'+
    '</div>';
  document.body.appendChild(mask);
  mask.querySelector('#rwNext').onclick=()=>{ mask.remove(); startLevel(curLevel.id); };
  mask.querySelector('#rwHome').onclick=()=>{ mask.remove(); show('homeScreen'); };
}

/* ============ 词语宝库 ============ */
function renderWords(){
  const box = document.getElementById('wordBox');
  if(S.words.length===0){
    box.innerHTML = '<p style="color:#90A4AE;font-size:14.5px;line-height:2;">宝库还空空的～<br>去冒险地图读故事，点击粉色词语就能收集宝石啦！</p>';
  }else{
    box.innerHTML = S.words.map(w=>'<span class="word-chip">💎 '+w+'</span>').join('');
  }
  const totalStories = LEVELS.reduce((s,l)=>s+l.pool.length,0);
  const readStories = Object.keys(S.read).length;
  const ach = [
    {icon:'🌱', name:'迈出第一步', cond:'读完第1篇', ok:readStories>=1},
    {icon:'📚', name:'小书虫', cond:'读完10篇', ok:readStories>=10},
    {icon:'💎', name:'词语收藏家', cond:'收集30个词语', ok:S.words.length>=30},
    {icon:'🔥', name:'坚持就是力量', cond:'单日阅读满20分钟', ok:Object.values(S.daily).some(d=>d.sec>=1200)},
    {icon:'🌟', name:'中阶通关', cond:'中阶五关全部完成', ok:midAllDone()},
    {icon:'🏆', name:'博览群书', cond:'读完50篇', ok:readStories>=50},
    {icon:'📖', name:'学富五车', cond:'累计阅读2万字', ok:S.totalChars>=20000},
    {icon:'👑', name:'阅读小博士', cond:'升到最高等级', ok:myLevel()>=5},
  ];
  document.getElementById('achieveBox').innerHTML = ach.map(a=>
    '<div class="parent-row"><span>'+(a.ok?a.icon:'🔒')+' '+a.name+' <em style="font-size:12px;color:#90A4AE;font-style:normal;">（'+a.cond+'）</em></span>'+
    '<b style="color:'+(a.ok?'#43A047':'#B0BEC5')+'">'+(a.ok?'已获得':'未达成')+'</b></div>'
  ).join('');
}

/* ============ 家长中心 ============ */
let parentAuthed=false;
function renderParentGate(){
  document.getElementById('parentGate').style.display = parentAuthed?'none':'block';
  document.getElementById('parentPanel').style.display = parentAuthed?'block':'none';
  if(parentAuthed) renderParentPanel();
}
document.getElementById('pwBtn').onclick=()=>{
  const v = document.getElementById('pwInput').value.trim();
  if(v===S.pw){ parentAuthed=true; document.getElementById('pwInput').value=''; renderParentGate(); }
  else toast('密码不对哦，默认是 8888');
};

function ringColor(p){ const deg = Math.min(360, p*360); return 'conic-gradient(#42A5F5 '+deg+'deg, #ECEFF1 '+deg+'deg)'; }

function renderParentPanel(){
  const d = dailyRec();
  const mins = Math.round(d.sec/60*10)/10;
  document.getElementById('todayMin').textContent = mins;
  document.getElementById('goalRing').style.background = ringColor(d.sec/1200);
  document.getElementById('goalTip').textContent = d.sec>=1200 ? '✅ 今日目标已完成，太棒了！' : '还差 '+Math.ceil((1200-d.sec)/60)+' 分钟达成今日目标';

  // 接触汉字量：按已读篇目统计
  const knownChars = new Set();
  LEVELS.forEach(L=>{
    L.pool.forEach(st=>{
      if(S.read[st.id]){
        st.paras.join('').replace(/[^\u4e00-\u9fa5]/g,'').split('').forEach(c=>knownChars.add(c));
      }
    });
  });
  const totalQ = S.quizLog.reduce((s,q)=>s+q.t,0);
  const rightQ = S.quizLog.reduce((s,q)=>s+q.r,0);
  const totalStories = LEVELS.reduce((s,l)=>s+l.pool.length,0);
  const readStories = Object.keys(S.read).length;

  document.getElementById('parentStats').innerHTML =
    '<div class="parent-row"><span>累计阅读篇数</span><b>'+readStories+' / '+totalStories+' 篇</b></div>'+
    '<div class="parent-row"><span>累计阅读字数</span><b>'+S.totalChars+' 字 / 学期目标 50000 字（'+(Math.min(100,S.totalChars/50000*100)).toFixed(1)+'%）</b></div>'+
    '<div class="parent-row"><span>累计阅读时长</span><b>'+Math.round(S.totalSec/60)+' 分钟</b></div>'+
    '<div class="parent-row"><span>接触汉字量（去重）</span><b>'+knownChars.size+' 字 / 目标 500 字</b></div>'+
    '<div class="parent-row"><span>收集词语</span><b>'+S.words.length+' 个</b></div>'+
    '<div class="parent-row"><span>阅读等级</span><b>'+LEVEL_NAMES[myLevel()]+'（'+S.xp+' XP）</b></div>'+
    '<div class="parent-row"><span>中阶通关</span><b>'+(midAllDone()?'✅ 已通关，高阶已解锁':'未通关')+'</b></div>'+
    '<div class="parent-row"><span>累计答题</span><b>'+rightQ+' / '+totalQ+' 正确</b></div>';

  const chart = document.getElementById('weekChart');
  let bars='';
  for(let i=6;i>=0;i--){
    const dt=new Date(); dt.setDate(dt.getDate()-i);
    const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const sec=(S.daily[k]&&S.daily[k].sec)||0;
    const m=Math.round(sec/60);
    const h=Math.max(6, Math.min(120, m*6));
    bars+='<div class="bar" style="height:'+h+'px"><span>'+(m||'')+'</span><em>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</em></div>';
  }
  chart.innerHTML=bars;

  const rate = totalQ? Math.round(rightQ/totalQ*100) : 0;
  document.getElementById('quizStats').innerHTML =
    '<div class="xpbar" style="height:16px;"><i style="width:'+rate+'%"></i></div>'+
    '<p style="font-size:13px;color:#78909C;margin-top:6px;">总正确率 '+rate+'%（共 '+totalQ+' 题）。'+
    (rate>=90?'阅读理解能力优秀，可以鼓励孩子尝试复述故事。':rate>=70?'理解能力良好，可陪孩子讨论错题加深理解。':'建议陪读，读完后先让孩子讲讲大意再答题。')+'</p>';
}

document.getElementById('chgPwBtn').onclick=()=>{
  const v = prompt('请输入新的4位数字密码：');
  if(v && /^\d{4}$/.test(v)){ S.pw=v; save(); toast('密码已修改'); }
  else if(v!==null) toast('请输入4位数字');
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定要清空全部阅读数据吗？此操作不可恢复！')){
    S = freshState(); save(); parentAuthed=false;
    toast('已清空，重新开始冒险吧！'); show('homeScreen');
  }
};

/* ============ 初始化 ============ */
renderHome();

</script>

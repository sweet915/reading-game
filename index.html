<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4FC3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阅读小勇士">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>阅读小勇士：文字王国大冒险</title>
<style>
:root{
  --sky:#4FC3F7; --grass:#81C784; --sun:#FFD54F; --orange:#FF8A65; --pink:#F48FB1;
  --purple:#BA68C8; --deep:#5C6BC0; --ink:#37474F; --cream:#FFFDE7; --card:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  overscroll-behavior:none;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#81D4FA 0%,#B3E5FC 40%,#C8E6C9 100%);
  min-height:100vh;min-height:-webkit-fill-available;color:var(--ink);overflow-x:hidden;
}
.cloud{position:fixed;font-size:44px;opacity:.85;animation:drift 26s linear infinite;z-index:0;pointer-events:none;}
@keyframes drift{from{transform:translateX(-120px);}to{transform:translateX(110vw);}}
.screen{display:none;position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom,0));}
.screen.active{display:block;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes pop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes shine{0%{left:-80px;}100%{left:110%;}}
h1.logo{font-size:30px;text-align:center;color:#fff;text-shadow:2px 3px 0 rgba(30,90,140,.35);letter-spacing:2px;}
.subtitle{text-align:center;color:#E1F5FE;font-size:14px;margin-top:2px;text-shadow:1px 1px 0 rgba(30,90,140,.3);}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin-top:14px;}
.bigbtn,.map-level,.quiz-opt,.choice-btn,.seq-item,.w-collect,.bottom-nav button,.word-chip{user-select:none;-webkit-user-select:none;}
.bigbtn{
  display:block;width:100%;border:none;border-radius:18px;padding:15px;font-size:19px;font-weight:bold;
  color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s;font-family:inherit;
}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.btn-green{background:linear-gradient(180deg,#66BB6A,#43A047);}
.btn-orange{background:linear-gradient(180deg,#FFA726,#FB8C00);}
.btn-purple{background:linear-gradient(180deg,#AB47BC,#8E24AA);}
.btn-blue{background:linear-gradient(180deg,#42A5F5,#1E88E5);}
.btn-pink{background:linear-gradient(180deg,#EC407A,#D81B60);}
.map-level{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px;
  margin-top:12px;box-shadow:0 5px 0 rgba(0,0,0,.08);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .12s;
}
.map-level:active{transform:scale(.98);}
.map-level.locked{opacity:.55;filter:grayscale(.6);}
.map-level .badge{font-size:38px;animation:floatY 3s ease-in-out infinite;}
.map-level .info{flex:1;}
.map-level .info b{font-size:17px;}
.map-level .info p{font-size:12.5px;color:#78909C;margin-top:2px;}
.map-level .stars{font-size:15px;color:#FFB300;white-space:nowrap;}
.map-level.done::after{content:'✔ 已完成';position:absolute;top:8px;right:12px;font-size:11px;color:#43A047;font-weight:bold;}
.hero{text-align:center;padding:8px 0 2px;font-size:64px;animation:bounce 2.4s ease-in-out infinite;}
.statbar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.stat-chip{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.08);}
.xpbar{height:12px;background:#ECEFF1;border-radius:99px;overflow:hidden;margin-top:6px;}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#FF8A65);border-radius:99px;transition:width .6s;}
.story-text{font-size:19px;line-height:2.05;letter-spacing:.5px;padding:6px 2px;}
.story-text p{margin-bottom:14px;text-indent:2em;}
.story-text .w-collect{color:#D81B60;font-weight:bold;border-bottom:2px dashed #F48FB1;cursor:pointer;position:relative;}
.story-text .w-collect.got{color:#43A047;border-bottom-color:#A5D6A7;}
.read-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.read-head .tag{font-size:12px;padding:4px 10px;border-radius:99px;color:#fff;font-weight:bold;}
.quiz-q{font-size:18px;font-weight:bold;line-height:1.7;margin-bottom:12px;}
.quiz-opt{
  display:flex;align-items:center;gap:10px;background:#F5F7FA;border:3px solid transparent;border-radius:16px;
  padding:13px 14px;margin-top:10px;font-size:17px;cursor:pointer;transition:all .15s;
}
.quiz-opt .abc{width:30px;height:30px;border-radius:50%;background:#90CAF9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;}
.quiz-opt.right{background:#E8F5E9;border-color:#66BB6A;}
.quiz-opt.right .abc{background:#43A047;}
.quiz-opt.wrong{background:#FFEBEE;border-color:#EF5350;animation:shake .3s;}
.quiz-opt.wrong .abc{background:#EF5350;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.seq-item{
  background:#FFF8E1;border:2px solid #FFE082;border-radius:14px;padding:13px 14px;font-size:16.5px;
  line-height:1.6;cursor:pointer;margin-top:10px;transition:all .15s;user-select:none;
}
.seq-item.picked{background:#C8E6C9;border-color:#66BB6A;font-weight:bold;}
.seq-order{display:inline-block;min-width:26px;height:26px;border-radius:50%;background:#FFB300;color:#fff;text-align:center;line-height:26px;font-weight:bold;margin-right:8px;font-size:14px;}
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(38,50,56,.94);color:#fff;
  padding:12px 22px;border-radius:99px;font-size:15px;z-index:99;animation:pop .3s;max-width:88vw;text-align:center;
}
.reward-mask{position:fixed;inset:0;background:rgba(20,40,60,.72);z-index:98;display:flex;align-items:center;justify-content:center;padding:20px;}
.reward-card{background:linear-gradient(180deg,#FFFDE7,#FFF9C4);border-radius:26px;padding:26px 22px;text-align:center;max-width:380px;width:100%;animation:pop .45s;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.reward-card .big{font-size:66px;animation:bounce 1.6s infinite;}
.word-chip{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#F8BBD0,#F48FB1);color:#7B1F3F;border-radius:99px;padding:8px 14px;margin:5px;font-size:15px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.08);}
.parent-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px dashed #E0E0E0;font-size:15.5px;}
.parent-row:last-child{border-bottom:none;}
.parent-row b{color:#1E88E5;}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 4px 0;}
.chart .bar{flex:1;background:linear-gradient(180deg,#4FC3F7,#1E88E5);border-radius:8px 8px 0 0;position:relative;min-height:6px;}
.chart .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:#1565C0;font-weight:bold;white-space:nowrap;}
.chart .bar em{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#78909C;font-style:normal;white-space:nowrap;}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);display:flex;z-index:50;
  box-shadow:0 -3px 12px rgba(0,0,0,.1);border-radius:22px 22px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.bottom-nav button{
  flex:1;border:none;background:none;padding:10px 4px 12px;font-size:12px;color:#78909C;cursor:pointer;font-family:inherit;
}
.bottom-nav button .ic{font-size:23px;display:block;margin-bottom:2px;}
.bottom-nav button.on{color:#1E88E5;font-weight:bold;}
.choice-btn{
  display:block;width:100%;text-align:left;background:#FFF3E0;border:3px solid #FFB74D;border-radius:16px;
  padding:14px;font-size:17px;margin-top:10px;cursor:pointer;line-height:1.6;font-family:inherit;transition:all .15s;
}
.choice-btn:active{transform:scale(.98);}
.pw-input{width:100%;font-size:24px;text-align:center;letter-spacing:12px;padding:14px;border:3px solid #B0BEC5;border-radius:16px;font-family:inherit;}
.goal-ring{width:96px;height:96px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;}
.goal-ring .in{width:78px;height:78px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;}
.goal-ring .in b{font-size:19px;color:#1E88E5;}
.footer-tip{text-align:center;font-size:12px;color:rgba(255,255,255,.85);margin-top:16px;text-shadow:0 1px 2px rgba(0,0,0,.15);}
</style>
</head>
<body>
<div class="cloud" style="top:8%;">☁️</div>
<div class="cloud" style="top:20%;animation-delay:-12s;">☁️</div>
<div class="cloud" style="top:14%;animation-delay:-20s;">⛅</div>

<!-- 主页：冒险地图 -->
<div id="homeScreen" class="screen active">
  <div style="text-align:center;padding-top:14px;">
    <h1 class="logo">📖 阅读小勇士</h1>
    <div class="subtitle">文字王国大冒险 · 三年级语文阅读乐园</div>
  </div>
  <div class="hero" id="heroAvatar">🦊</div>
  <div style="text-align:center;color:#fff;font-size:14.5px;text-shadow:1px 1px 0 rgba(30,90,140,.3);" id="heroText">
    文字王国的故事之书被撕碎啦！快和小狐狸文文一起，用阅读的力量把它修复吧！
  </div>
  <div class="statbar" id="statBar"></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:13.5px;color:#78909C;">
      <span>等级：<b id="lvName" style="color:#FB8C00;">阅读小新手</b></span>
      <span id="xpText">0 / 100 XP</span>
    </div>
    <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
  </div>
  <div id="levelMap"></div>
  <div class="footer-tip">每天坚持阅读20分钟，就能成为阅读小学士哦！</div>
</div>

<!-- 阅读页 -->
<div id="readScreen" class="screen">
  <div class="card" style="margin-top:6px;">
    <div class="read-head">
      <span class="tag" id="storyTag">童话</span>
      <span style="font-size:12.5px;color:#90A4AE;" id="storyMeta"></span>
    </div>
    <h2 id="storyTitle" style="font-size:23px;margin:6px 0 4px;color:#37474F;"></h2>
    <div style="font-size:12.5px;color:#90A4AE;margin-bottom:8px;" id="storyHint"></div>
    <div class="story-text" id="storyBody"></div>
    <div style="font-size:13px;color:#90A4AE;text-align:center;margin-top:4px;" id="readProgressTip">慢慢读，不着急～读完后点击下方按钮</div>
    <button class="bigbtn btn-green" id="finishReadBtn" style="margin-top:14px;">✅ 我读完了，去挑战！</button>
  </div>
</div>

<!-- 挑战页 -->
<div id="challengeScreen" class="screen">
  <div class="card" style="margin-top:6px;" id="challengeBody"></div>
</div>

<!-- 词语宝库 -->
<div id="wordsScreen" class="screen">
  <div style="text-align:center;padding-top:14px;">
    <h1 class="logo">💎 词语宝库</h1>
    <div class="subtitle">阅读时点击粉色词语就能收集它们</div>
  </div>
  <div class="card">
    <div id="wordBox" style="text-align:center;min-height:80px;"></div>
  </div>
  <div class="card">
    <b style="font-size:16px;">🏆 我的成就</b>
    <div id="achieveBox" style="margin-top:10px;"></div>
  </div>
</div>

<!-- 家长中心 -->
<div id="parentScreen" class="screen">
  <div style="text-align:center;padding-top:14px;">
    <h1 class="logo">👨‍👩‍👧 家长中心</h1>
    <div class="subtitle">了解孩子的阅读成长</div>
  </div>
  <div id="parentGate" class="card" style="text-align:center;">
    <p style="font-size:15px;color:#78909C;margin-bottom:12px;">请输入家长密码（默认 8888）</p>
    <input type="password" class="pw-input" id="pwInput" maxlength="4" inputmode="numeric" placeholder="····">
    <button class="bigbtn btn-blue" style="margin-top:14px;" id="pwBtn">进入家长中心</button>
  </div>
  <div id="parentPanel" style="display:none;">
    <div class="card" style="text-align:center;">
      <b style="font-size:15.5px;">⏱ 今日阅读目标（20分钟）</b>
      <div class="goal-ring" id="goalRing" style="margin-top:10px;">
        <div class="in"><b id="todayMin">0</b>分钟</div>
      </div>
      <div style="font-size:12.5px;color:#90A4AE;margin-top:8px;" id="goalTip"></div>
    </div>
    <div class="card">
      <b style="font-size:15.5px;">📊 成长数据</b>
      <div id="parentStats"></div>
    </div>
    <div class="card">
      <b style="font-size:15.5px;">📈 近7天阅读时长（分钟）</b>
      <div class="chart" id="weekChart"></div>
      <div style="height:18px;"></div>
    </div>
    <div class="card">
      <b style="font-size:15.5px;">🎯 答题正确率</b>
      <div id="quizStats" style="margin-top:6px;"></div>
    </div>
    <div class="card">
      <b style="font-size:15.5px;">⚙️ 设置</b>
      <div class="parent-row"><span>修改家长密码</span><button class="bigbtn btn-purple" style="width:auto;padding:8px 16px;font-size:14px;" id="chgPwBtn">修改</button></div>
      <div class="parent-row"><span>清空全部数据（重新开始）</span><button class="bigbtn btn-pink" style="width:auto;padding:8px 16px;font-size:14px;" id="resetBtn">清空</button></div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button data-nav="home" class="on"><span class="ic">🗺️</span>冒险地图</button>
  <button data-nav="words"><span class="ic">💎</span>词语宝库</button>
  <button data-nav="parent"><span class="ic">👨‍👩‍👧</span>家长中心</button>
</div>

<script>
/* ============================================================
   阅读小勇士：文字王国大冒险 · 内容池版
   中阶（三年级）+ 高阶（五年级）双梯度，150篇阅读内容
   ============================================================ */
const STORE_KEY = 'reading_hero_v2';

/* ============ 关卡架构：每关一个内容池，进入时抽取未读篇目 ============ */
/* type: quiz理解 | collect词语收集 | sequence段落排序 | branch启示选择 | express表达 */
const LEVELS = [
  { id:1, world:0, name:'萤火虫森林', icon:'🌲', theme:'童话', color:'#43A047', type:'quiz',     unlockXp:0,   pool:[], desc:'读故事回答问题' },
  { id:2, world:0, name:'词语山谷',   icon:'⛰️', theme:'寓言', color:'#FB8C00', type:'collect',  unlockXp:60,  pool:[], desc:'边读边收集好词' },
  { id:3, world:0, name:'句子城堡',   icon:'🏰', theme:'科普', color:'#1E88E5', type:'sequence', unlockXp:120, pool:[], desc:'把打乱的段落排好队' },
  { id:4, world:0, name:'故事迷宫',   icon:'🌀', theme:'寓言', color:'#8E24AA', type:'branch',   unlockXp:180, pool:[], desc:'选出故事的启示' },
  { id:5, world:0, name:'智慧高塔',   icon:'🗼', theme:'综合', color:'#D81B60', type:'express',  unlockXp:250, pool:[], desc:'读后说说你的想法' },
  { id:6, world:1, name:'星空书径',   icon:'🌌', theme:'童话', color:'#5C6BC0', type:'quiz',     unlockXp:0,   pool:[], desc:'长篇故事深理解' },
  { id:7, world:1, name:'翡翠词海',   icon:'💠', theme:'成语', color:'#26A69A', type:'collect',  unlockXp:60,  pool:[], desc:'高级词汇大收集' },
  { id:8, world:1, name:'逻辑天梯',   icon:'🪜', theme:'科普', color:'#0288D1', type:'sequence', unlockXp:120, pool:[], desc:'梳理文章结构脉络' },
  { id:9, world:1, name:'哲思回廊',   icon:'🏛️', theme:'成语', color:'#7B1FA2', type:'branch',   unlockXp:180, pool:[], desc:'读懂故事背后道理' },
  { id:10, world:1, name:'创作之巅',  icon:'🏔️', theme:'综合', color:'#C62828', type:'express',  unlockXp:250, pool:[], desc:'理解之后试着表达' }
];

/* 等级体系 */
const LEVEL_NAMES = ['阅读小新手','阅读小能手','阅读小达人','阅读小明星','阅读小学士','阅读小博士'];
const LEVEL_XP = [0, 120, 300, 560, 900, 1400];

/* ============ 进度数据 ============ */
function freshState(){
  return {
    xp:0, stars:0,
    words:[],
    totalChars:0, totalSec:0,
    daily:{},
    quizLog:[],
    done:{},          // {levelId:{stars,bestScore}}
    read:{},          // {storyId: 阅读次数}
    branches:{},
    pw:'8888',
    firstUse: Date.now()
  };
}
let S = freshState();
try{
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){ const p = JSON.parse(raw); S = Object.assign(freshState(), p); }
}catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dailyRec(){ const k=todayKey(); if(!S.daily[k]) S.daily[k]={sec:0,chars:0}; return S.daily[k]; }
function myLevel(){ let lv=0; for(let i=0;i<LEVEL_XP.length;i++){ if(S.xp>=LEVEL_XP[i]) lv=i; } return lv; }
function nextXp(){ const lv=myLevel(); return lv<LEVEL_XP.length-1 ? LEVEL_XP[lv+1] : null; }
function storyChars(st){ return st.chars || st.paras.join('').replace(/[^\u4e00-\u9fa5]/g,'').length || st.paras.join('').length; }
function midAllDone(){ return [1,2,3,4,5].every(id=>S.done[id]); }

let toastTimer=null;
function toast(msg, ms=2200){
  let t=document.getElementById('toastEl');
  if(!t){ t=document.createElement('div'); t.id='toastEl'; document.body.appendChild(t); }
  t.className='toast'; t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=''; t.style.display='none'; }, ms);
}

/* ============ 页面导航 ============ */
const SCREENS = ['homeScreen','readScreen','challengeScreen','wordsScreen','parentScreen'];
function show(id){
  SCREENS.forEach(s=>document.getElementById(s).classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>{
    b.classList.toggle('on', (id==='homeScreen'&&b.dataset.nav==='home')||(id==='wordsScreen'&&b.dataset.nav==='words')||(id==='parentScreen'&&b.dataset.nav==='parent'));
  });
  window.scrollTo(0,0);
  if(id==='homeScreen') renderHome();
  if(id==='wordsScreen') renderWords();
  if(id==='parentScreen') renderParentGate();
}
document.querySelectorAll('.bottom-nav button').forEach(b=>{
  b.onclick=()=>show(b.dataset.nav==='home'?'homeScreen':b.dataset.nav==='words'?'wordsScreen':'parentScreen');
});

/* ============ 主页（双梯度区块） ============ */
function renderHome(){
  const lv=myLevel(), nx=nextXp();
  document.getElementById('lvName').textContent = LEVEL_NAMES[lv];
  const base = LEVEL_XP[lv];
  document.getElementById('xpText').textContent = nx? (S.xp-base)+' / '+(nx-base)+' XP' : '已满级';
  document.getElementById('xpFill').style.width = nx? Math.min(100,(S.xp-base)/(nx-base)*100)+'%' : '100%';
  document.getElementById('statBar').innerHTML =
    '<span class="stat-chip">⭐ '+S.stars+'</span>'+
    '<span class="stat-chip">💎 '+S.words.length+' 词</span>'+
    '<span class="stat-chip">📖 '+S.totalChars+' 字</span>'+
    '<span class="stat-chip">⏱ '+Math.round(S.totalSec/60)+' 分钟</span>';

  const map = document.getElementById('levelMap');
  map.innerHTML = '';
  const worldNames = ['🌟 中阶冒险 · 三年级水平', '🚀 高阶冒险 · 五年级水平'];
  for(let w=0; w<2; w++){
    const head = document.createElement('div');
    head.style.cssText = 'margin-top:18px;font-size:16px;font-weight:bold;color:#fff;text-shadow:1px 1px 0 rgba(30,90,140,.35);';
    const lockedWorld = (w===1 && !midAllDone());
    head.textContent = worldNames[w] + (lockedWorld ? '　🔒 通关中阶五关后解锁' : '');
    map.appendChild(head);
    LEVELS.filter(l=>l.world===w).forEach(L=>{
      const poolTotal = L.pool.length;
      const poolRead = L.pool.filter(s=>S.read[s.id]).length;
      const locked = lockedWorld || S.xp < L.unlockXp;
      const div = document.createElement('div');
      div.className = 'map-level' + (locked?' locked':'');
      div.innerHTML =
        '<div class="badge">'+L.icon+'</div>'+
        '<div class="info"><b>'+L.name+'</b> <span style="font-size:12px;color:#90A4AE;">【'+L.theme+'】</span><p>'+L.desc+'</p>'+
        '<p style="color:#1E88E5;font-weight:bold;">书库 '+poolRead+' / '+poolTotal+' 篇'+(poolRead>=poolTotal&&poolTotal>0?' · 已全部读完🎉':'')+'</p>'+
        (locked&&w===0? '<p style="color:#EF5350;">🔒 需要 '+L.unlockXp+' XP（还差 '+(L.unlockXp-S.xp)+'）</p>':'')+
        '</div>'+
        '<div class="stars" style="color:'+(locked?'#B0BEC5':'#FFB300')+';">'+(locked?'🔒':'GO ▶')+'</div>';
      if(!locked && poolTotal>0) div.onclick = ()=>startLevel(L.id);
      else if(!locked && poolTotal===0) div.onclick = ()=>toast('本书库正在补充内容，先读其他关卡吧');
      else div.onclick = ()=>toast(lockedWorld ? '先通关中阶五个关卡，再来挑战高阶！' : '先完成前面的关卡，攒够 '+L.unlockXp+' XP 再来哦！');
      map.appendChild(div);
    });
  }
}

/* ============ 阅读页 ============ */
let curLevel=null, curStory=null, readStart=0, collectedNow=new Set();

function pickStory(level){
  const unread = level.pool.filter(s=>!S.read[s.id]);
  const src = unread.length? unread : level.pool;
  return src[Math.floor(Math.random()*src.length)];
}

function startLevel(id){
  curLevel = LEVELS.find(l=>l.id===id);
  curStory = pickStory(curLevel);
  collectedNow = new Set();
  const st = curStory;
  document.getElementById('storyTitle').textContent = st.title;
  document.getElementById('storyTag').textContent = st.theme;
  document.getElementById('storyTag').style.background = curLevel.color;
  document.getElementById('storyMeta').textContent = '约'+storyChars(st)+'字 · '+curLevel.name;

  let hint='';
  if(curLevel.type==='collect') hint='💡 读的时候，点击粉色的词语可以收集宝石哦！';
  else if(curLevel.type==='sequence') hint='💡 认真读，记住文章的先后顺序，待会儿要把打乱的段落排好队！';
  else if(curLevel.type==='branch') hint='💡 读完后想一想：这个故事想告诉我们什么？';
  else if(curLevel.type==='express') hint='💡 读完不仅要答题，还要说说你的想法哦！';
  else hint='💡 认真阅读，读完要回答小问题哦！';
  document.getElementById('storyHint').textContent = hint;

  const body = document.getElementById('storyBody');
  body.innerHTML = '';
  st.paras.forEach(p=>{
    const pel = document.createElement('p');
    let html = p;
    const ws = (st.collectWords||[]).filter((w,i,a)=>a.indexOf(w)===i).sort((a,b)=>b.length-a.length);
    ws.forEach(w=>{
      html = html.replace(new RegExp('(^|[^>\\w"—])' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'), '$1<span class="w-collect" data-w="'+w+'">'+w+'</span>');
    });
    pel.innerHTML = html;
    body.appendChild(pel);
  });
  body.querySelectorAll('.w-collect').forEach(el=>{
    el.onclick = ()=>{
      const w = el.dataset.w;
      if(el.classList.contains('got')) return;
      el.classList.add('got');
      collectedNow.add(w);
      if(!S.words.includes(w)) S.words.push(w);
      S.xp += 3; save();
      toast('💎 收集到词语「'+w+'」！+3 XP');
    };
  });

  readStart = Date.now();
  show('readScreen');
}

document.getElementById('finishReadBtn').onclick = ()=>{
  const chars = storyChars(curStory);
  const minSec = Math.max(15, Math.round(chars/4));
  const sec = Math.max(minSec, Math.round((Date.now()-readStart)/1000));
  S.totalSec += sec; S.totalChars += chars;
  const d = dailyRec(); d.sec += sec; d.chars += chars;
  S.read[curStory.id] = (S.read[curStory.id]||0)+1;
  S.xp += 20; save();
  toast('📖 阅读完成！+20 XP', 1500);
  setTimeout(()=>startChallenge(), 600);
};

/* ============ 内容数据与分配 ============ */
/* CONTENT_DATA 由内容包注入：{id,title,theme,paras,collectWords,quiz} */
function distribute(contents){
  const themes = ['童话','寓言','科普','成语','生活'];
  for(const w of [0,1]){
    const prefix = w===0?'M':'H';
    const pool = contents.filter(c=>c.id && c.id.startsWith(prefix));
    const levels = LEVELS.filter(l=>l.world===w);
    const buckets = {};
    pool.forEach(c=>{ (buckets[c.theme] = buckets[c.theme]||[]).push(c); });
    let li = 0;
    themes.forEach(t=>{
      (buckets[t]||[]).forEach(c=>{ levels[li%levels.length].pool.push(c); li++; });
    });
  }
}

块圆滚滚的小石头……」"}, {"q": "是什么让小石头开始旅行的？", "opts": ["它自己滚下去的", "春天的一场大雨", "有人把它踢走了"], "ans": 1, "why": "原文第2段写道：「春天的一场大雨把小石头冲到了小溪里。」"}, {"q": "小石头在河里结识了谁？", "opts": ["小鱼和虾", "鹅卵石和石英石", "螃蟹和贝壳"], "ans": 1, "why": "原文第3段写道：「小石头结识了光滑的鹅卵石和会发光的石英石。」"}, {"q": "小石头最后被谁捡起来了？", "opts": ["钓鱼的老爷爷", "一个小女孩", "海鸥"], "ans": 1, "why": "原文第4段写道：「一个小女孩把它捡起来，放进了口袋。」"}]}, {"id": "M06", "title": "会隐身的小露珠", "theme": "童话", "paras": ["清晨的荷叶上有一颗小露珠，它有一个神奇的本领——在阳光下会隐身。", "小露珠很喜欢和荷叶上的小动物们玩捉迷藏。它会隐身躲起来，让小蚂蚁、小瓢虫找啊找。大家玩得可开心了。", "有一天，太阳特别热，小露珠感觉自己的身体在慢慢变小。它害怕极了，怕自己消失不见。", "一朵白云看见了，飘过来说：「别怕，你只是变成了水蒸气，飞到我这里来。等明天早上，你又会变成露珠回到荷叶上的。」", "小露珠放心地飞上了天。第二天清晨，它果然又回到了荷叶上。这次它还带来了一个新朋友——另一颗从远方来的露珠。"], "collectWords": ["隐身", "本领", "水蒸气", "捉迷藏", "神奇", "害怕"], "quiz": [{"q": "小露珠有什么神奇本领？", "opts": ["会飞", "在阳光下会隐身", "会变色"], "ans": 1, "why": "原文第1段写道：「它有一个神奇的本领——在阳光下会隐身。」"}, {"q": "小露珠喜欢和朋友们玩什么游戏？", "opts": ["跳房子", "捉迷藏", "老鹰捉小鸡"], "ans": 1, "why": "原文第2段写道：「小露珠很喜欢和荷叶上的小动物们玩捉迷藏。」"}, {"q": "太阳特别热的时候，小露珠怎么了？", "opts": ["它躲到水里了", "它的身体在慢慢变小", "它飞到天上去了"], "ans": 1, "why": "原文第3段写道：「小露珠感觉自己的身体在慢慢变小。」"}, {"q": "白云告诉小露珠它会变成什么？", "opts": ["变成雨", "变成水蒸气", "变成雪花"], "ans": 1, "why": "原文第4段白云说：「你只是变成了水蒸气，飞到我这里来。」"}]}, {"id": "M07", "title": "怕黑的小猫头鹰", "theme": "童话", "paras": ["森林里有只小猫头鹰，奇怪的是，它居然怕黑。别的猫头鹰晚上出来捉老鼠，它却躲在被窝里不敢出来。", "猫妈妈很着急，想了很多办法。它在墙上贴了很多夜光星星，可小猫头鹰还是害怕。", "有一天晚上，小兔子迷路了，在森林里哭。小猫头鹰听见了，它鼓起勇气飞出树洞，借着星星的光找到了小兔子。", "小猫头鹰把小兔子送回了家。小兔子说：「你真勇敢，黑黑的夜晚也能找到路！」小猫头鹰这才觉得，黑夜也没那么可怕。", "从那以后，小猫头鹰不再怕黑了。它发现夜晚的森林很安静，有很多白天看不到的有趣事情。"], "collectWords": ["勇敢", "着急", "鼓起勇气", "夜光", "安静", "奇怪"], "quiz": [{"q": "小猫头鹰有什么特别之处？", "opts": ["它不会飞", "它怕黑", "它不喜欢吃老鼠"], "ans": 1, "why": "原文第1段写道：「奇怪的是，它居然怕黑。」"}, {"q": "猫妈妈用什么办法帮小猫头鹰？", "opts": ["贴夜光星星", "陪它一起睡", "给它讲故事"], "ans": 0, "why": "原文第2段写道：「它在墙上贴了很多夜光星星……」"}, {"q": "是什么让小猫头鹰鼓起勇气飞出树洞的？", "opts": ["猫妈妈的鼓励", "听见小兔子在哭", "它想捉老鼠"], "ans": 1, "why": "原文第3段写道：「小兔子迷路了，在森林里哭。小猫头鹰听见了，它鼓起勇气飞出树洞……」"}, {"q": "小猫头鹰后来为什么不怕黑了？", "opts": ["因为猫妈妈一直陪着它", "因为它发现黑夜没那么可怕，还有很多有趣的事", "因为森林里没有夜晚了"], "ans": 1, "why": "原文最后一段写道：「它发现夜晚的森林很安静，有很多白天看不到的有趣事情。」"}]}, {"id": "M08", "title": "最后一个柿子", "theme": "童话", "paras": ["深秋了，柿子树上的叶子都落光了，只剩下最后一个红彤彤的大柿子挂在枝头。", "小麻雀、小松鼠和小刺猬都想要这个柿子。小麻雀说：「我最先发现的，应该归我！」小松鼠说：「我爬得最高，应该归我！」", "小刺猬不说话，它想起去年冬天，自己饿得找不到食物，是柿子树掉落的烂柿子救了它一命。", "最后，小刺猬对柿子说：「柿子树妈妈，谢谢您去年救了我。这个柿子我不要了，留给更需要的朋友吧。」", "小麻雀和小松鼠听了，都不好意思地低下了头。它们一起把这个柿子分成了三份，三个好朋友开开心心地分享了。"], "collectWords": ["红彤彤", "不好意思", "分享", "需要", "深秋", "枝头"], "quiz": [{"q": "柿子树上最后剩下几个柿子？", "opts": ["一个", "三个", "五个"], "ans": 0, "why": "原文第1段写道：「只剩下最后一个红彤彤的大柿子挂在枝头。」"}, {"q": "小刺猬为什么不要柿子？", "opts": ["它不喜欢吃柿子", "它想留给更需要的朋友", "它够不到"], "ans": 1, "why": "原文第4段写道：「这个柿子我不要了，留给更需要的朋友吧。」"}, {"q": "去年冬天是谁救了小刺猬？", "opts": ["小麻雀", "柿子树", "小松鼠"], "ans": 1, "why": "原文第3段写道：「是柿子树掉落的烂柿子救了它一命。」"}, {"q": "最后柿子是怎么处理的？", "opts": ["给了小刺猬", "分成三份分享", "被风吹掉了"], "ans": 1, "why": "原文最后一段写道：「它们一起把这个柿子分成了三份，三个好朋友开开心心地分享了。」"}]}, {"id": "M09", "title": "风铃草的约定", "theme": "童话", "paras": ["山坡上有两株风铃草，一株叫叮叮，一株叫咚咚。它们的叶子随风摇晃时，会发出叮叮咚咚的声音，就像两个小铃铛。", "春天来了，蝴蝶告诉它们，山的那边有一片更美丽的草地。叮叮很想去看看，但咚咚说：「我们的根扎在这里，走不了的。」", "叮叮很伤心。咚咚想了想说：「虽然不能一起去，但我们可以让风帮忙。每年的今天，我们一起唱歌，风会把歌声带到对方那里。」", "从此，每年的这一天，叮叮和咚咚都会用力摇晃叶子，唱出最动听的歌。风真的把歌声带到了山的那一边。", "虽然相隔一座山，但叮叮和咚咚知道，它们永远是好朋友。"], "collectWords": ["帮忙", "伤心", "动听", "摇晃", "相隔", "山坡"], "quiz": [{"q": "两株风铃草叫什么名字？", "opts": ["叮叮和咚咚", "红红和绿绿", "大大和小小"], "ans": 0, "why": "原文第1段写道：「一株叫叮叮，一株叫咚咚。」"}, {"q": "蝴蝶告诉它们山的那边有什么？", "opts": ["一片大海", "一片更美丽的草地", "一座城堡"], "ans": 1, "why": "原文第2段写道：「蝴蝶告诉它们，山的那边有一片更美丽的草地。」"}, {"q": "咚咚想出了什么办法来遵守约定？", "opts": ["让蝴蝶传话", "让风帮忙传歌声", "写信给对方"], "ans": 1, "why": "原文第3段写道：「但我们可以让风帮忙。每年的今天，我们一起唱歌，风会把歌声带到对方那里。」"}, {"q": "叮叮和咚咚为什么不能一起去？", "opts": ["因为它们吵架了", "因为它们的根扎在这里走不了", "因为山太高爬不过去"], "ans": 1, "why": "原文第2段咚咚说：「我们的根扎在这里，走不了的。」"}]}, {"id": "M10", "title": "云朵棉花糖", "theme": "童话", "paras": ["天空中的云朵们最喜欢玩变身游戏。今天变成小马，明天变成大船，可有一朵小云却不知道自己想变成什么。", "小云飘来飘去，看见地上的小朋友在吃棉花糖。白白的、软软的，看起来好甜好甜。小云心想：「我就变成一朵棉花糖云吧！」", "小云努力地把自己变得又白又软，还偷偷学了一口甜甜的味道藏在雨滴里。", "有一天，一个生病的小女孩躺在床上，望着窗外的天空。她看见了小云，笑着说：「那朵云好像棉花糖啊，看着它我就觉得没那么难受了。」", "小云高兴极了。它终于知道，自己最好的变身就是能给别人带来快乐的棉花糖。"], "collectWords": ["变身", "棉花糖", "难受", "甜甜", "飘来飘去", "偷偷"], "quiz": [{"q": "云朵们最喜欢玩什么游戏？", "opts": ["捉迷藏", "变身游戏", "赛跑"], "ans": 1, "why": "原文第1段写道：「天空中的云朵们最喜欢玩变身游戏。」"}, {"q": "小云想变成什么？", "opts": ["小马", "大船", "棉花糖"], "ans": 2, "why": "原文第2段写道：「我就变成一朵棉花糖云吧！」"}, {"q": "小女孩为什么看着小云觉得没那么难受了？", "opts": ["因为小云下起了雨", "因为那朵云好像棉花糖", "因为小云变成了小马"], "ans": 1, "why": "原文第4段小女孩说：「那朵云好像棉花糖啊，看着它我就觉得没那么难受了。」"}, {"q": "小云最后觉得自己最好的变身是什么？", "opts": ["能下雨的云", "能带来快乐的棉花糖", "变成最大的云"], "ans": 1, "why": "原文最后一段写道：「它终于知道，自己最好的变身就是能给别人带来快乐的棉花糖。」"}]}, {"id": "M11", "title": "蜗牛邮局的慢递", "theme": "童话", "paras": ["森林里新开了一家特别的邮局，老板是一只慢吞吞的蜗牛。别的邮局送快递都很快，蜗牛邮局却主打「慢递」——慢慢送，不着急。", "小松鼠要给明年春天出生的宝宝准备一封信，它找蜗牛邮局：「请把这封信明年春天送到我家。」蜗牛点点头，把信小心翼翼地收好。", "小熊要给十年后的自己寄一张照片，蜗牛邮局也答应了。它把照片装进一个特别结实的壳子里，慢慢往目的地爬去。", "大家一开始都笑话蜗牛太慢了。但春天来临时，小松鼠的宝宝真的收到了那封信，上面写着：「宝贝，妈妈在春天等你。」", "后来，越来越多的动物找蜗牛邮局寄慢递。因为它们发现，有些祝福和期待，值得慢慢等待。"], "collectWords": ["慢吞吞", "小心翼翼", "主打", "祝福", "结实", "期待"], "quiz": [{"q": "蜗牛邮局的老板是谁？", "opts": ["小松鼠", "小熊", "蜗牛"], "ans": 2, "why": "原文第1段写道：「老板是一只慢吞吞的蜗牛。」"}, {"q": "蜗牛邮局主打什么服务？", "opts": ["快递", "慢递", "包裹寄存"], "ans": 1, "why": "原文第1段写道：「蜗牛邮局却主打「慢递」——慢慢送，不着急。」"}, {"q": "小松鼠的信是给谁的？", "opts": ["给小熊", "给明年春天出生的宝宝", "给蜗牛"], "ans": 1, "why": "原文第2段写道：「小松鼠要给明年春天出生的宝宝准备一封信……」"}, {"q": "大家为什么后来喜欢找蜗牛邮局？", "opts": ["因为它最便宜", "因为有些祝福值得慢慢等待", "因为它最快"], "ans": 1, "why": "原文最后一段写道：「因为它们发现，有些祝福和期待，值得慢慢等待。」"}]}, {"id": "M12", "title": "不想融化的雪人", "theme": "童话", "paras": ["冬天，小朋友堆了一个胖乎乎的雪人。雪人很开心，但它知道自己春天就会融化。", "雪人找到太阳，请求说：「太阳公公，你能不能不要这么暖和？我想一直留在这里。」太阳摇摇头说：「每个季节都有它的使命，我的使命就是让春天到来。」", "雪人又找到北风，北风说：「我可以把你吹到更冷的地方，但那样你就看不到那个堆你的小朋友了。」", "雪人想了想，决定哪里也不去。它对小朋友说：「明年冬天，你再堆一个我，我就回来了。」小朋友点点头，把雪人的胡萝卜鼻子小心地收进了抽屉里。", "春天来了，雪人融化成了水，滋润了小草。但它知道，自己并没有真正消失，只是换了一种方式陪伴着这个世界。"], "collectWords": ["融化", "滋润", "胖乎乎", "使命", "抽屉", "陪伴"], "quiz": [{"q": "雪人害怕什么？", "opts": ["被风吹倒", "春天融化", "小朋友不理它"], "ans": 1, "why": "原文第1段写道：「但它知道自己春天就会融化。」"}, {"q": "雪人向谁请求不要那么暖和？", "opts": ["北风", "太阳", "小朋友"], "ans": 1, "why": "原文第2段写道：「雪人找到太阳，请求说：「太阳公公，你能不能不要这么暖和？」"}, {"q": "小朋友把雪人的什么收进了抽屉？", "opts": ["帽子", "围巾", "胡萝卜鼻子"], "ans": 2, "why": "原文第4段写道：「小朋友点点头，把雪人的胡萝卜鼻子小心地收进了抽屉里。」"}, {"q": "雪人融化后变成了什么？", "opts": ["变成了水", "变成了云", "变成了冰"], "ans": 0, "why": "原文最后一段写道：「雪人融化成了水，滋润了小草。」"}]}, {"id": "M13", "title": "星星便利店", "theme": "童话", "paras": ["夜晚的天空中有一家星星便利店，店长是一颗金色的五角星。店里卖的不是零食玩具，而是各种各样的「晚安」。", "有「香香甜甜晚安」，适合累了一天的小朋友；有「暖暖乎乎晚安」，适合被子不够厚的小动物；还有「轻轻软软晚安」，适合做噩梦的小朋友。", "有一天，一个总是睡不着的小狐狸来到了星星便利店。它试过了所有的晚安，还是睡不着。", "五角星店长想了想，从柜台下面拿出一个特别的晚安——「妈妈哼歌晚安」。小狐狸闻了闻，感觉好像回到了小时候，躺在妈妈怀里听她哼歌的时光。", "小狐狸终于睡着了，嘴角还挂着微笑。五角星店长轻轻说：「有些晚安，藏在最温柔的回忆里。」"], "collectWords": ["便利店", "各种各样", "噩梦", "柜台", "温柔", "回忆"], "quiz": [{"q": "星星便利店的店长是什么？", "opts": ["一只小狐狸", "一颗金色的五角星", "一个月亮"], "ans": 1, "why": "原文第1段写道：「店长是一颗金色的五角星。」"}, {"q": "星星便利店卖的是什么？", "opts": ["零食玩具", "各种各样的「晚安」", "星星"], "ans": 1, "why": "原文第1段写道：「店里卖的不是零食玩具，而是各种各样的「晚安」。」"}, {"q": "小狐狸为什么一直睡不着？", "opts": ["因为它不困", "普通的晚安对它没用", "因为它在等妈妈"], "ans": 1, "why": "原文第3、4段写道，小狐狸「试过了所有的晚安，还是睡不着」，说明普通的晚安对它没用。"}, {"q": "最后是什么让小狐狸睡着了？", "opts": ["香香甜甜晚安", "暖暖乎乎晚安", "妈妈哼歌晚安"], "ans": 2, "why": "原文第4段写道：「从柜台下面拿出一个特别的晚安——「妈妈哼歌晚安」……小狐狸终于睡着了。」"}]}, {"id": "M14", "title": "画笔忘了带颜色", "theme": "童话", "paras": ["小画家莉莉有一支神奇的画笔，画什么就会变成真的。有一天，她急着出门写生，画笔却忘了带颜色——它变成了一支透明的画笔。", "莉莉来到花园里，想画一朵红花，可画出来的是透明的花。小蜜蜂飞过来说：「没关系，我能闻到花香就行！」", "她又画了一只小鸟，也是透明的。小鸟高兴地说：「太好了！这样我藏在树叶里就没人能看见我了。」", "莉莉画了一条透明的小河，河水清澈见底，小鱼们游得更开心了。", "回到家，莉莉对画笔说：「原来没有颜色也很好啊， transparent 的东西也有transparent 的美。」画笔眨眨眼睛，开心地笑了。"], "collectWords": ["透明", "神奇", "写生", "清澈见底", "急着", "开心"], "quiz": [{"q": "画笔为什么变成了透明的？", "opts": ["它坏了", "莉莉忘了带颜色", "它本来就是这样"], "ans": 1, "why": "原文第1段写道：「画笔却忘了带颜色——它变成了一支透明的画笔。」"}, {"q": "透明的小鸟为什么高兴？", "opts": ["因为它会飞得更高", "因为它藏在树叶里没人能看见", "因为它喜欢透明"], "ans": 1, "why": "原文第3段小鸟说：「太好了！这样我藏在树叶里就没人能看见我了。」"}, {"q": "透明的小河有什么特点？", "opts": ["河水清澈见底", "河水是红色的", "河水很深"], "ans": 0, "why": "原文第4段写道：「河水清澈见底，小鱼们游得更开心了。」"}, {"q": "莉莉最后明白了什么？", "opts": ["画笔坏了要修理", "透明的东西也有透明的美", "以后不能忘带颜色"], "ans": 1, "why": "原文最后一段写道：「原来没有颜色也很好啊， transparent 的东西也有 transparent 的美。」"}]}, {"id": "M15", "title": "最长的一夜", "theme": "童话", "paras": ["冬天的夜晚很长很长。小田鼠阿仓一家住在地洞里，储备的粮食快吃完了，春天却迟迟不来。", "阿仓的爸爸出去找食物，再也没有回来。妈妈每天守着洞口张望，眼睛都哭红了。", "阿仓决定自己去找食物。它钻出洞口，在雪地里挖啊挖，终于找到了一颗被遗忘的橡果。", "它把橡果分成三份，一份给妈妈，一份留给弟弟，最小的一份留给自己。妈妈说：「阿仓，你长大了。」", "那个夜晚虽然很长，但阿仓一家紧紧抱在一起，觉得没那么冷了。春天一定会来的，它们知道。"], "collectWords": ["迟迟", "储备", "张望", "终于", "紧紧", "橡果"], "quiz": [{"q": "阿仓一家为什么粮食快吃完了？", "opts": ["因为它们吃得太多了", "因为冬天太长，春天迟迟不来", "因为老鼠偷了"], "ans": 1, "why": "原文第1段写道：「储备的粮食快吃完了，春天却迟迟不来。」"}, {"q": "阿仓的爸爸怎么了？", "opts": ["出去找食物没回来", "生病了", "去远方工作了"], "ans": 0, "why": "原文第2段写道：「阿仓的爸爸出去找食物，再也没有回来。」"}, {"q": "阿仓找到了什么食物？", "opts": ["一颗花生", "一颗橡果", "一颗松果"], "ans": 1, "why": "原文第3段写道：「终于找到了一颗被遗忘的橡果。」"}, {"q": "阿仓把橡果分成了几份？", "opts": ["两份", "三份", "四份"], "ans": 1, "why": "原文第4段写道：「它把橡果分成三份，一份给妈妈，一份留给弟弟，最小的一份留给自己。」"}]}, {"id": "M16", "title": "乌鸦喝水", "theme": "寓言", "paras": ["一只乌鸦口渴了，到处找水喝。它看见一个瓶子里有水，可是瓶口太小，水又太浅，嘴够不着。", "乌鸦试着把瓶子推倒，可瓶子太重了。它又想用树枝蘸水喝，树枝太短了。", "乌鸦看见旁边有很多小石子，灵机一动。它叼起一颗石子放进瓶子里，水位升高了一点点。", "乌鸦一颗一颗地叼石子放进瓶子。瓶子里的水位慢慢升高，终于，乌鸦喝到了水。", "乌鸦拍拍翅膀说：「遇到困难不要放弃，多动动脑筋，办法总是有的。」"], "collectWords": ["灵机一动", "口渴", "够不着", "放弃", "一颗一颗", "困难"], "quiz": [{"q": "乌鸦为什么喝不到瓶子里的水？", "opts": ["瓶子是空的", "瓶口太小，水太浅", "它不想喝"], "ans": 1, "why": "原文第1段写道：「可是瓶口太小，水又太浅，嘴够不着。」"}, {"q": "乌鸦想到了什么办法？", "opts": ["推倒瓶子", "叼石子放进瓶子里", "找别的动物帮忙"], "ans": 1, "why": "原文第3段写道：「它叼起一颗石子放进瓶子里，水位升高了一点点。」"}, {"q": "乌鸦放进瓶子里的是什么？", "opts": ["小树枝", "小石子", "小叶子"], "ans": 1, "why": "原文第3、4段写道乌鸦「叼起一颗石子放进瓶子里」「一颗一颗地叼石子放进瓶子」。"}, {"q": "这个故事告诉我们什么道理？", "opts": ["要力气大", "遇到困难不要放弃，多动脑筋", "要找朋友帮忙"], "ans": 1, "why": "原文最后一段乌鸦说：「遇到困难不要放弃，多动动脑筋，办法总是有的。」"}]}, {"id": "M17", "title": "龟兔赛跑", "theme": "寓言", "paras": ["兔子和乌龟比赛跑步。兔子跑得飞快，一会儿就把乌龟甩得远远的。", "兔子回头看不见乌龟，心想：「我睡一觉再跑也来得及。」于是它躺在大树下睡着了。", "乌龟一步一步地往前爬，虽然慢，但它一直没有停下来。它爬过兔子身边时，看了一眼熟睡的兔子，继续往前爬。", "兔子睡醒了一看，太阳都快落山了。它急忙往前跑，可到了终点，乌龟已经在那里等它了。", "乌龟笑着说：「我跑得慢，但我一直在跑。你跑得快，可你在睡觉啊！」"], "collectWords": ["飞快", "甩得远远", "一步一步", "熟睡", "急忙", "落山"], "quiz": [{"q": "兔子为什么输给了乌龟？", "opts": ["兔子跑得不够快", "兔子中途睡觉去了", "乌龟抄了近路"], "ans": 1, "why": "原文第2段写道：「于是它躺在大树下睡着了。」"}, {"q": "乌龟是怎么爬到终点的？", "opts": ["一步一步往前爬，一直没停", "它跑了一会儿", "它让别的动物帮忙"], "ans": 0, "why": "原文第3段写道：「乌龟一步一步地往前爬，虽然慢，但它一直没有停下来。」"}, {"q": "兔子在哪里睡着了？", "opts": ["在终点", "在大树下", "在河边"], "ans": 1, "why": "原文第2段写道：「于是它躺在大树下睡着了。」"}, {"q": "这个故事告诉我们什么？", "opts": ["睡觉很重要", "骄傲使人落后，坚持才能胜利", "跑得快就能赢"], "ans": 1, "why": "原文乌龟说：「我跑得慢，但我一直在跑。你跑得快，可你在睡觉啊！」说明骄傲和懈怠会导致失败，坚持才能胜利。"}]}, {"id": "M18", "title": "狐狸和葡萄", "theme": "寓言", "paras": ["一只狐狸路过葡萄架，看见上面挂着一串串紫莹莹的葡萄，口水都要流出来了。", "狐狸跳起来想摘葡萄，可是葡萄太高了，它够不着。它又试着爬架子，架子太滑了爬不上去。", "狐狸试了好几次，累得气喘吁吁。最后它看了看葡萄，说：「这些葡萄肯定是酸的，不好吃！」", "说完，狐狸昂着头走了。其实它心里特别想吃，只是吃不到才那样说。", "路过的老山羊看见了，摇摇头说：「吃不到就说不好，这不是自欺欺人吗？」"], "collectWords": ["紫莹莹", "气喘吁吁", "够不着", "自欺欺人", "一串串", "昂着头"], "quiz": [{"q": "狐狸为什么想吃葡萄？", "opts": ["因为它饿了", "因为葡萄看起来很诱人", "因为它喜欢酸的东西"], "ans": 1, "why": "原文第1段写道：「看见上面挂着一串串紫莹莹的葡萄，口水都要流出来了。」"}, {"q": "狐狸为什么没摘到葡萄？", "opts": ["葡萄是坏的", "葡萄太高够不着", "葡萄被鸟吃了"], "ans": 1, "why": "原文第2段写道：「可是葡萄太高了，它够不着。」"}, {"q": "狐狸最后怎么评价葡萄的？", "opts": ["很甜很好吃", "肯定是酸的，不好吃", "它没评价"], "ans": 1, "why": "原文第3段写道：「这些葡萄肯定是酸的，不好吃！」"}, {"q": "老山羊说狐狸是在做什么？", "opts": ["在努力", "在自欺欺人", "在锻炼身体"], "ans": 1, "why": "原文最后一段老山羊说：「吃不到就说不好，这不是自欺欺人吗？」"}]}, {"id": "M19", "title": "北风和太阳", "theme": "寓言", "paras": ["北风和太阳争论谁更厉害。北风说：「我能把大树吹倒，我能把屋顶掀翻，我才是最厉害的！」", "太阳笑着说：「那咱们比一比吧。看见路边那个行人了吗？谁让他先脱下衣服，谁就赢。」", "北风先出手了。它鼓起腮帮子，呼呼地吹啊吹。行人把衣服裹得紧紧的，北风越吹，他裹得越紧。", "北风累坏了，吹不动了。太阳出场了，它温柔地照在行人的身上。行人觉得暖洋洋的，不一会儿就热得脱下了外套。", "北风明白了：「光靠力气大不一定有用，温柔和智慧有时候更强大。」"], "collectWords": ["争论", "掀翻", "裹得紧紧", "温柔", "暖洋洋", "智慧"], "quiz": [{"q": "北风和太阳争论什么？", "opts": ["谁更暖和", "谁更厉害", "谁更亮"], "ans": 1, "why": "原文第1段写道：「北风和太阳争论谁更厉害。」"}, {"q": "比赛的规则是什么？", "opts": ["谁吹得远谁赢", "谁让行人先脱下衣服谁赢", "谁的光更强谁赢"], "ans": 1, "why": "原文第2段太阳说：「谁让他先脱下衣服，谁就赢。」"}, {"q": "北风吹的时候，行人怎么做？", "opts": ["脱下衣服", "把衣服裹得更紧", "跑开了"], "ans": 1, "why": "原文第3段写道：「行人把衣服裹得紧紧的，北风越吹，他裹得越紧。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["力气大就能赢", "温柔和智慧有时候更强大", "太阳比北风热"], "ans": 1, "why": "原文最后一段写道：「光靠力气大不一定有用，温柔和智慧有时候更强大。」"}]}, {"id": "M20", "title": "蚂蚁和蟋蟀", "theme": "寓言", "paras": ["夏天，蚂蚁们忙着搬运粮食，为冬天做准备。一只蟋蟀坐在草叶上，弹着琴唱着歌，嘲笑蚂蚁说：「夏天这么好的天气，你们不会享受吗？」", "蚂蚁们头也不抬地说：「冬天来了可没有吃的，现在不准备，到时候会饿肚子的。」蟋蟀不听，继续唱歌。", "秋天过去了，冬天来了。大雪覆盖了大地，到处白茫茫一片。蚂蚁们躲在温暖的窝里，吃着夏天储存的粮食。", "蟋蟀又冷又饿，它来到蚂蚁家门口，请求给一点吃的。蚂蚁们说：「你夏天唱歌，冬天就去跳舞吧。」", "蟋蟀羞愧地低下了头。它明白了：只顾眼前享乐，不为将来打算，最后吃苦的还是自己。"], "collectWords": ["搬运", "嘲笑", "储存", "羞愧", "白茫茫", "享受"], "quiz": [{"q": "夏天蚂蚁们在做什么？", "opts": ["弹琴唱歌", "搬运粮食", "睡觉"], "ans": 1, "why": "原文第1段写道：「蚂蚁们忙着搬运粮食，为冬天做准备。」"}, {"q": "蟋蟀夏天在做什么？", "opts": ["储存粮食", "弹琴唱歌", "帮蚂蚁搬东西"], "ans": 1, "why": "原文第1段写道：「一只蟋蟀坐在草叶上，弹着琴唱着歌……」"}, {"q": "冬天蟋蟀为什么又冷又饿？", "opts": ["因为蚂蚁不给它吃", "因为它夏天没有储存粮食", "因为它把粮食弄丢了"], "ans": 1, "why": "原文第3、4段说明蟋蟀夏天没有储存粮食，冬天没有吃的。"}, {"q": "这个故事告诉我们什么？", "opts": ["唱歌不好", "只顾眼前享乐不准备将来，最后吃苦的是自己", "蚂蚁太小气了"], "ans": 1, "why": "原文最后一段写道：「只顾眼前享乐，不为将来打算，最后吃苦的还是自己。」"}]}, {"id": "M21", "title": "狼来了", "theme": "寓言", "paras": ["山村里有个放羊娃，他每天上山放羊，日子过得很无聊。", "有一天，他想开个玩笑，就对着山下大喊：「狼来了！狼来了！」村民们拿着锄头棍子跑上山，结果发现没有狼，是放羊娃在骗人。", "过了几天，放羊娃又觉得无聊，又大喊「狼来了！」村民们又跑上来，还是没有狼。大家很生气，说再也不相信他了。", "终于有一天，真的来了一只大灰狼，追着羊群咬。放羊娃拼命喊：「狼真的来了！救命啊！」", "可是村民们以为他又在骗人，谁也没有来。放羊娃的羊被狼咬死了好多只。他坐在地上哭，后悔极了。"], "collectWords": ["无聊", "骗人", "后悔", "拼命", "相信", "大灰狼"], "quiz": [{"q": "放羊娃为什么要喊「狼来了」？", "opts": ["因为真的来了狼", "因为无聊想开玩笑", "因为他需要帮助"], "ans": 1, "why": "原文第2段写道：「有一天，他想开个玩笑，就对着山下大喊……」"}, {"q": "村民们第一次听到后怎么做？", "opts": ["不理他", "拿着锄头棍子上山", "直接回家了"], "ans": 1, "why": "原文第2段写道：「村民们拿着锄头棍子跑上山……」"}, {"q": "为什么狼真的来了的时候没人来帮忙？", "opts": ["因为村民们不在家", "因为大家以为他又在骗人", "因为狼太厉害了"], "ans": 1, "why": "原文第5段写道：「可是村民们以为他又在骗人，谁也没有来。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["不要放羊", "不要说谎，说谎会失去别人的信任", "狼很可怕"], "ans": 1, "why": "原文中放羊娃多次说谎，最后真的遇到困难时没人相信他，说明说谎会失去别人的信任。"}]}, {"id": "M22", "title": "狐狸和乌鸦", "theme": "寓言", "paras": ["乌鸦嘴里叼着一块香喷喷的肉，站在树枝上。狐狸看见了，口水直流，想把肉骗过来。", "狐狸抬起头，笑眯眯地说：「乌鸦小姐，您的羽毛真漂亮，比孔雀还美呢！」乌鸦听了很高兴，但没有开口。", "狐狸又说：「您的歌声一定也很动听吧？能不能唱一首给我听听？」乌鸦得意极了，忍不住张开嘴唱了起来。", "「哇——」乌鸦刚一张嘴，肉就掉了下去。狐狸一口接住肉，转身就跑。", "乌鸦这才知道上了当。它明白了：听到夸奖就飘飘然，很容易吃亏的。"], "collectWords": ["香喷喷", "笑眯眯", "动听", "飘飘然", "得意", "转身"], "quiz": [{"q": "狐狸为什么要夸奖乌鸦？", "opts": ["因为它真的觉得乌鸦美", "它想把乌鸦嘴里的肉骗过来", "它和乌鸦是好朋友"], "ans": 1, "why": "原文第1段写道：「狐狸看见了，口水直流，想把肉骗过来。」"}, {"q": "狐狸用什么方法骗乌鸦开口？", "opts": ["说它羽毛漂亮", "请它唱歌", "给它讲故事"], "ans": 1, "why": "原文第3段写道：「您的歌声一定也很动听吧？能不能唱一首给我听听？」"}, {"q": "乌鸦一张嘴发生了什么？", "opts": ["肉掉了下去", "它飞走了", "狐狸爬上了树"], "ans": 0, "why": "原文第4段写道：「乌鸦刚一张嘴，肉就掉了下去。」"}, {"q": "这个故事告诉我们什么？", "opts": ["不要吃肉", "听到夸奖就飘飘然很容易吃亏", "狐狸很聪明"], "ans": 1, "why": "原文最后一段写道：「听到夸奖就飘飘然，很容易吃亏的。」"}]}, {"id": "M23", "title": "农夫和蛇", "theme": "寓言", "paras": ["冬天的一个早晨，农夫出门去田里。他在路边看见一条冻僵的蛇，蛇蜷成一团，一动不动。", "农夫很可怜它，就把蛇捡起来，放进自己的怀里，想用体温把它救活。", "蛇在农夫的怀里慢慢暖和过来，渐渐恢复了知觉。可它一醒过来，就张开嘴狠狠咬了农夫一口。", "农夫中毒了，倒在地上。他后悔地说：「我可怜恶人，应该受到这样的报应啊！」", "这个故事告诉我们：对恶人发了善心，最后受害的往往是自己。"], "collectWords": ["冻僵", "可怜", "蜷成一团", "恢复", "狠狠", "报应"], "quiz": [{"q": "农夫在哪里发现蛇的？", "opts": ["田里", "路边", "家里"], "ans": 1, "why": "原文第1段写道：「他在路边看见一条冻僵的蛇……」"}, {"q": "农夫把蛇放在哪里救它？", "opts": ["火堆旁", "自己的怀里", "热水里"], "ans": 1, "why": "原文第2段写道：「就把蛇捡起来，放进自己的怀里……」"}, {"q": "蛇醒过来后做了什么？", "opts": ["感谢农夫", "狠狠咬了农夫一口", "爬走了"], "ans": 1, "why": "原文第3段写道：「可它一醒过来，就张开嘴狠狠咬了农夫一口。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["不要救动物", "对恶人发善心，受害的往往是自己", "蛇都是坏的"], "ans": 1, "why": "原文最后一段写道：「对恶人发了善心，最后受害的往往是自己。」"}]}, {"id": "M24", "title": "东郭先生和狼", "theme": "寓言", "paras": ["东郭先生骑着毛驴赶路，遇到一只被猎人追赶的狼。狼哀求说：「先生，救救我吧！我会被猎人打死的。」", "东郭先生心很软，让狼钻进自己的书袋里。猎人追来问有没有看见狼，东郭先生说没看见。", "猎人走后，东郭先生把狼放出来。狼说：「我饿坏了，让我吃了你吧！」说着就扑向东郭先生。", "东郭先生吓得赶紧逃跑，正好一位老农扛着锄头走过来。老农设计让狼重新钻进书袋，然后一锄头打死了狼。", "这个故事告诉我们：对坏人仁慈，就是对自己残忍。"], "collectWords": ["哀求", "心很软", "扑向", "设计", "仁慈", "残忍"], "quiz": [{"q": "东郭先生把狼藏在哪里？", "opts": ["树洞里", "书袋里", "驴背上"], "ans": 1, "why": "原文第2段写道：「让狼钻进自己的书袋里。」"}, {"q": "猎人走后狼做了什么？", "opts": ["感谢东郭先生", "要吃东郭先生", "跑掉了"], "ans": 1, "why": "原文第3段写道：「狼说：「我饿坏了，让我吃了你吧！」说着就扑向东郭先生。」"}, {"q": "是谁救了东郭先生？", "opts": ["猎人", "老农", "毛驴"], "ans": 1, "why": "原文第4段写道：「正好一位老农扛着锄头走过来。老农设计让狼重新钻进书袋……」"}, {"q": "这个故事告诉我们什么？", "opts": ["不要骑马", "对坏人仁慈就是对自己残忍", "狼都会说话"], "ans": 1, "why": "原文最后一段写道：「对坏人仁慈，就是对自己残忍。」"}]}, {"id": "M25", "title": "揠苗助长", "theme": "寓言", "paras": ["古时候有个农夫，种了一片禾苗。他每天去田里看，觉得禾苗长得太慢了。", "有一天，他终于想出了一个「好办法」。他跑到田里，把一棵一棵禾苗往上拔了一点。", "拔了一整天，农夫累得腰酸背痛。但他看着「长高」的禾苗，心里美滋滋的。", "回到家，他对儿子说：「今天可累坏我了，我帮禾苗长高了！」儿子连忙跑到田里一看，禾苗全都枯死了。", "这个故事告诉我们：违反事物的发展规律，急于求成，反而会把事情办坏。"], "collectWords": ["古时候", "腰酸背痛", "美滋滋", "枯死", "急于求成", "违反"], "quiz": [{"q": "农夫为什么觉得禾苗长得慢？", "opts": ["因为他太心急", "因为禾苗真的不长", "因为天气不好"], "ans": 0, "why": "原文第1段写道：「他每天去田里看，觉得禾苗长得太慢了。」说明农夫心急。"}, {"q": "农夫想出了什么「好办法」？", "opts": ["多浇水", "把禾苗往上拔", "多施肥"], "ans": 1, "why": "原文第2段写道：「他跑到田里，把一棵一棵禾苗往上拔了一点。」"}, {"q": "儿子到田里看到了什么？", "opts": ["禾苗长高了", "禾苗全都枯死了", "禾苗开花了"], "ans": 1, "why": "原文第4段写道：「儿子连忙跑到田里一看，禾苗全都枯死了。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["要多帮植物浇水", "违反规律急于求成，反而坏事", "种地很累"], "ans": 1, "why": "原文最后一段写道：「违反事物的发展规律，急于求成，反而会把事情办坏。」"}]}, {"id": "M26", "title": "守株待兔", "theme": "寓言", "paras": ["古时候有个农夫，每天在田里辛苦干活。有一天，一只兔子飞快地跑过来，一头撞在田边的树桩上，当场就死了。", "农夫白捡了一只兔子，高兴极了。他心想：「要是每天都能捡到兔子，我就不用干活了。」", "从那以后，农夫不再种地，整天坐在树桩旁边等兔子。一天过去了，两天过去了，一个月过去了，再也没有兔子撞上来。", "田里的庄稼都荒了，农夫的粮食也吃完了。邻居们都笑话他，说他傻。", "这个故事告诉我们：想不劳而获，寄希望于偶然，最后只会一无所获。"], "collectWords": ["辛苦", "当场", "白捡", "树桩", "偶然", "不劳而获"], "quiz": [{"q": "兔子是怎么死的？", "opts": ["被农夫打死的", "撞在树桩上死的", "生病死的"], "ans": 1, "why": "原文第1段写道：「一头撞在田边的树桩上，当场就死了。」"}, {"q": "农夫捡到兔子后怎么想？", "opts": ["以后要小心", "要是每天都能捡到就好了", "把它送给邻居"], "ans": 1, "why": "原文第2段写道：「要是每天都能捡到兔子，我就不用干活了。」"}, {"q": "农夫后来每天在做什么？", "opts": ["继续种地", "坐在树桩旁等兔子", "去山上抓兔子"], "ans": 1, "why": "原文第3段写道：「农夫不再种地，整天坐在树桩旁边等兔子。」"}, {"q": "这个故事告诉我们什么？", "opts": ["兔子很傻", "想不劳而获寄希望于偶然，最后只会一无所获", "树桩很危险"], "ans": 1, "why": "原文最后一段写道：「想不劳而获，寄希望于偶然，最后只会一无所获。」"}]}, {"id": "M27", "title": "叶公好龙", "theme": "寓言", "paras": ["古时候有个叶公，他特别喜欢龙。家里的柱子上雕着龙，墙上画着龙，被子上绣着龙，连酒杯上也刻着龙。", "天上的真龙听说叶公这么喜欢自己，很感动，决定下凡去看望他。", "一天，真龙从窗户探进头来，长长的尾巴拖在厅堂里。叶公看见了，吓得脸色发白，浑身发抖，转身就跑。", "真龙很失望，叹了口气飞走了。原来叶公喜欢的不是真龙，而是那些画出来的、雕出来的假龙罢了。", "这个故事告诉我们：表面上喜欢某样东西，实际上并不是真的喜欢。"], "collectWords": ["雕着", "绣着", "下凡", "脸色发白", "浑身发抖", "失望"], "quiz": [{"q": "叶公家里什么地方有龙？", "opts": ["只有墙上有", "柱子、墙、被子、酒杯上都有", "只有被子上"], "ans": 1, "why": "原文第1段写道：「家里的柱子上雕着龙，墙上画着龙，被子上绣着龙，连酒杯上也刻着龙。」"}, {"q": "真龙为什么去看望叶公？", "opts": ["因为叶公是它的主人", "因为听说叶公很喜欢自己", "因为叶公召唤了它"], "ans": 1, "why": "原文第2段写道：「天上的真龙听说叶公这么喜欢自己，很感动，决定下凡去看望他。」"}, {"q": "叶公见到真龙后怎么了？", "opts": ["很高兴地招待它", "吓得脸色发白转身就跑", "请真龙住下来"], "ans": 1, "why": "原文第3段写道：「叶公看见了，吓得脸色发白，浑身发抖，转身就跑。」"}, {"q": "这个故事告诉我们什么？", "opts": ["龙很可怕", "表面上喜欢不是真的喜欢", "不要画龙"], "ans": 1, "why": "原文最后一段写道：「表面上喜欢某样东西，实际上并不是真的喜欢。」"}]}, {"id": "M28", "title": "买椟还珠", "theme": "寓言", "paras": ["楚国有个商人，有一颗珍贵的珍珠想卖掉。他请人做了一个非常漂亮的盒子来装珍珠。", "盒子是用名贵的木兰木做的，外面雕刻着精美的花纹，镶嵌着闪亮的宝石，还散发着桂花的香气。", "一个郑国人看见了，非常喜欢这个盒子，出高价买了下来。可他打开盒子，把珍珠拿出来还给了商人，只带走了盒子。", "商人拿着珍珠，哭笑不得。他本来是想卖珍珠的，结果人家只买了盒子。", "这个故事告诉我们：不要只看重外表的华丽，而忽视了真正有价值的东西。"], "collectWords": ["珍贵", "镶嵌", "精美", "桂花", "哭笑不得", "华丽"], "quiz": [{"q": "商人请人做了什么来装珍珠？", "opts": ["一个袋子", "一个非常漂亮的盒子", "一个篮子"], "ans": 1, "why": "原文第1段写道：「他请人做了一个非常漂亮的盒子来装珍珠。」"}, {"q": "盒子是用什么做的？", "opts": ["石头", "木兰木", "竹子"], "ans": 1, "why": "原文第2段写道：「盒子是用名贵的木兰木做的……」"}, {"q": "郑国人最后拿走了什么？", "opts": ["珍珠", "盒子", "两者都拿了"], "ans": 1, "why": "原文第3段写道：「把珍珠拿出来还给了商人，只带走了盒子。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["盒子比珍珠贵", "不要只看外表华丽而忽视真正有价值的东西", "郑国人很聪明"], "ans": 1, "why": "原文最后一段写道：「不要只看重外表的华丽，而忽视了真正有价值的东西。」"}]}, {"id": "M29", "title": "刻舟求剑", "theme": "寓言", "paras": ["有个人坐船过江，不小心把身上的剑掉进了水里。船上的人都替他着急，劝他赶紧下水去找。", "可那个人不慌不忙，掏出小刀在船舷上刻了一个记号，说：「我的剑是从这里掉下去的，等船靠岸了，我从这里下水去找。」", "船继续往前开，离掉剑的地方越来越远。等船到了对岸，那个人从刻记号的地方跳入水中，找了半天也没找到剑。", "他奇怪地问：「我的剑明明是从这里掉下去的，怎么找不到了呢？」旁边的人都笑了。", "这个故事告诉我们：不懂得事物是发展变化的，用老办法解决新问题，是行不通的。"], "collectWords": ["不慌不忙", "船舷", "刻记号", "明明", "发展变化", "旁边"], "quiz": [{"q": "这个人的剑是怎么掉进江里的？", "opts": ["被人偷了", "不小心掉下去的", "他扔下去的"], "ans": 1, "why": "原文第1段写道：「不小心把身上的剑掉进了水里。」"}, {"q": "他在船上做了什么？", "opts": ["大声呼救", "在船舷上刻了一个记号", "立刻跳下去找"], "ans": 1, "why": "原文第2段写道：「掏出小刀在船舷上刻了一个记号……」"}, {"q": "他最后找到剑了吗？", "opts": ["找到了", "没找到", "别人帮他找到了"], "ans": 1, "why": "原文第3段写道：「找了半天也没找到剑。」"}, {"q": "这个故事告诉我们什么？", "opts": ["不要在船上带剑", "事物是发展变化的，老办法行不通", "刻记号很有用"], "ans": 1, "why": "原文最后一段写道：「不懂得事物是发展变化的，用老办法解决新问题，是行不通的。」"}]}, {"id": "M30", "title": "掩耳盗铃", "theme": "寓言", "paras": ["从前有个人想偷一口大钟，可钟太大太重，他搬不动。他想：「我把钟敲碎，一块一块搬走吧。」", "可他一想，敲钟会发出很大的响声，别人听见了就会来抓他。他想来想去，想出了一个「聪明」的办法。", "他把自己的两只耳朵紧紧捂住，然后拿起锤子去敲钟。他心想：「我把耳朵捂住了，就听不见钟声了，别人也一定听不见。」", "钟声还是传了出去，邻居们听见了，跑过来把他抓住了。", "这个故事告诉我们：自己欺骗自己，以为别人也会上当，这是最愚蠢的做法。"], "collectWords": ["搬不动", "捂住", "愚蠢", "敲碎", "聪明", "上当"], "quiz": [{"q": "这个人想偷什么？", "opts": ["一口大钟", "一只铃铛", "一块金子"], "ans": 0, "why": "原文第1段写道：「从前有个人想偷一口大钟……」"}, {"q": "他为什么搬不动钟？", "opts": ["因为钟被锁住了", "因为钟太大太重", "因为他力气小"], "ans": 1, "why": "原文第1段写道：「可钟太大太重，他搬不动。」"}, {"q": "他用什么方法「防止」别人听见钟声？", "opts": ["在夜里偷", "捂住自己的耳朵", "把钟包起来"], "ans": 1, "why": "原文第3段写道：「他把自己的两只耳朵紧紧捂住……」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["钟声很大", "自己骗自己以为别人也上当是最愚蠢的", "偷东西不好"], "ans": 1, "why": "原文最后一段写道：「自己欺骗自己，以为别人也会上当，这是最愚蠢的做法。」"}]}, {"id": "M31", "title": "彩虹是怎么形成的", "theme": "科普", "paras": ["夏天雨后，天空中有时会出现一道美丽的彩虹，有红、橙、黄、绿、蓝、靛、紫七种颜色。彩虹是怎么来的呢？", "原来，太阳光看起来是白色的，其实是由七种颜色的光混合在一起的。当阳光穿过空气中的小水滴时，会发生一种叫做「折射」的现象。", "不同颜色的光折射的角度不一样，白光就被分解成七种颜色，像一把彩色的扇子一样展开。", "光在水滴里还会反射一下，所以我们看到的彩虹是圆弧形的。彩虹总是出现在太阳的反方向，所以背对着太阳最容易看到它。", "如果你想自己制造彩虹，可以背对着太阳，含一口水喷成水雾，说不定就能看到小小的彩虹哦！"], "collectWords": ["彩虹", "折射", "分解", "弧形", "混合", "水雾"], "quiz": [{"q": "彩虹有几种颜色？", "opts": ["五种", "七种", "十种"], "ans": 1, "why": "原文第1段写道：「有红、橙、黄、绿、蓝、靛、紫七种颜色。」"}, {"q": "白光穿过水滴时会发生什么现象？", "opts": ["反射", "折射", "消失"], "ans": 1, "why": "原文第2段写道：「当阳光穿过空气中的小水滴时，会发生一种叫做「折射」的现象。」"}, {"q": "为什么彩虹是圆弧形的？", "opts": ["因为太阳是圆的", "因为光在水滴里反射了一下", "因为天空是圆的"], "ans": 1, "why": "原文第4段写道：「光在水滴里还会反射一下，所以我们看到的彩虹是圆弧形的。」"}, {"q": "怎么自己制造彩虹？", "opts": ["对着太阳喷水", "背对着太阳喷水雾", "下雨天出去看"], "ans": 1, "why": "原文第5段写道：「可以背对着太阳，含一口水喷成水雾，说不定就能看到小小的彩虹哦！」"}]}, {"id": "M32", "title": "为什么天空是蓝色的", "theme": "科普", "paras": ["白天我们抬头看天空，大多数时候看到的是蓝色。可你有没有想过，天空本来是没有颜色的，为什么看起来是蓝的呢？", "这是因为太阳光由很多种颜色的光组成。这些光穿过地球周围的大气层时，会遇到空气中的气体分子和小颗粒。", "太阳光中的蓝光波长比较短，遇到空气分子时更容易被散射到四面八方。于是蓝光就充满了整个天空，我们抬头看天就看到了蓝色。", "而红光波长长，不容易被散射，大多直接穿过大气层照到地面。所以太阳本身看起来是白色或偏黄的。", "到了日落时，阳光要穿过更厚的大气层，蓝光被散射得差不多了，剩下的红光和橙光更多，所以晚霞常常是红色的。"], "collectWords": ["散射", "波长", "大气层", "四面八方", "晚霞", "颗粒"], "quiz": [{"q": "太阳光由什么组成？", "opts": ["只有白光", "很多种颜色的光", "只有蓝光和红光"], "ans": 1, "why": "原文第2段写道：「这是因为太阳光由很多种颜色的光组成。」"}, {"q": "什么颜色的光最容易被散射？", "opts": ["红光", "蓝光", "绿光"], "ans": 1, "why": "原文第3段写道：「太阳光中的蓝光波长比较短，遇到空气分子时更容易被散射到四面八方。」"}, {"q": "为什么太阳本身看起来是白色或偏黄的？", "opts": ["因为蓝光被散射了", "因为红光波长长，大多直接穿过大气层", "因为太阳就是黄色的"], "ans": 1, "why": "原文第4段写道：「而红光波长长，不容易被散射，大多直接穿过大气层照到地面。所以太阳本身看起来是白色或偏黄的。」"}, {"q": "晚霞为什么常常是红色的？", "opts": ["因为太阳变红了", "因为蓝光被散射得差不多了，剩下红光和橙光", "因为云是红色的"], "ans": 1, "why": "原文第5段写道：「蓝光被散射得差不多了，剩下的红光和橙光更多，所以晚霞常常是红色的。」"}]}, {"id": "M33", "title": "蜜蜂为什么要跳八字舞", "theme": "科普", "paras": ["蜜蜂不仅会采蜜，还会「跳舞」给同伴看。这种舞蹈可不是为了好玩，而是告诉伙伴们花蜜在哪里。", "当蜜蜂发现了一片不错的花丛，飞回蜂巢后，它会在蜂巢上跳起「八字舞」。舞蹈的路线就像一个「8」字。", "八字舞的中间那条直线的方向，表示花丛相对于太阳的方向。如果直线朝上，说明朝着太阳飞；如果朝下，说明背对着太阳飞。", "蜜蜂跳舞时摇摆身体的快慢和次数，表示花丛有多远。摇摆得越快、次数越多，说明花丛越远。", "其他蜜蜂看着舞蹈，就能知道往哪个方向飞、飞多远，就能找到花丛了。蜜蜂的舞蹈真是一种聪明的「地图语言」！"], "collectWords": ["八字舞", "花蜜", "蜂巢", "摇摆", "相对于", "地图语言"], "quiz": [{"q": "蜜蜂跳舞是为了什么？", "opts": ["为了好玩", "告诉同伴花蜜在哪里", "为了锻炼身体"], "ans": 1, "why": "原文第1段写道：「而是告诉伙伴们花蜜在哪里。」"}, {"q": "八字舞的路线像什么形状？", "opts": ["圆形", "八字形", "直线"], "ans": 1, "why": "原文第2段写道：「舞蹈的路线就像一个「8」字。」"}, {"q": "直线朝上表示什么？", "opts": ["背对着太阳飞", "朝着太阳飞", "花丛在左边"], "ans": 1, "why": "原文第3段写道：「如果直线朝上，说明朝着太阳飞……」"}, {"q": "蜜蜂跳舞时什么表示花丛的距离？", "opts": ["舞蹈的方向", "摇摆身体的快慢和次数", "舞蹈的大小"], "ans": 1, "why": "原文第4段写道：「蜜蜂跳舞时摇摆身体的快慢和次数，表示花丛有多远。」"}]}, {"id": "M34", "title": "树叶秋天为什么会变黄", "theme": "科普", "paras": ["春天和夏天，树叶大多是绿色的。可一到秋天，很多树叶就变成了黄色、橙色或者红色。这是为什么呢？", "原来，树叶里有一种绿色的东西叫「叶绿素」。叶绿素能利用阳光、水和空气制造养料，让树长大。夏天阳光充足，叶绿素很多，所以叶子看起来是绿色的。", "秋天到了，天气变冷，阳光变弱，树木的养分运输也变慢了。叶绿素会慢慢分解消失。", "叶绿素消失后，树叶里原本就存在的黄色和橙色的「类胡萝卜素」就显现出来了。有些树叶还会产生红色的「花青素」，所以叶子就变成了红黄相间的美丽颜色。", "最后，树叶和树枝连接的地方长出一层特殊的细胞，像一把小刀把树叶割断。树叶就飘飘悠悠地落下来了。"], "collectWords": ["叶绿素", "类胡萝卜素", "花青素", "养分", "分解", "飘飘悠悠"], "quiz": [{"q": "夏天树叶为什么是绿色的？", "opts": ["因为阳光是绿的", "因为树叶里有叶绿素", "因为雨水是绿的"], "ans": 1, "why": "原文第2段写道：「树叶里有一种绿色的东西叫「叶绿素」……所以叶子看起来是绿色的。」"}, {"q": "秋天叶绿素怎么了？", "opts": ["变多了", "慢慢分解消失", "变成红色了"], "ans": 1, "why": "原文第3段写道：「叶绿素会慢慢分解消失。」"}, {"q": "叶绿素消失后，什么颜色显现出来？", "opts": ["蓝色和紫色", "黄色和橙色", "黑色和白色"], "ans": 1, "why": "原文第4段写道：「树叶里原本就存在的黄色和橙色的「类胡萝卜素」就显现出来了。」"}, {"q": "树叶是怎么从树枝上掉下来的？", "opts": ["被风吹断的", "连接处长出一层特殊细胞把树叶割断", "自己变轻飘下来的"], "ans": 1, "why": "原文最后一段写道：「树叶和树枝连接的地方长出一层特殊的细胞，像一把小刀把树叶割断。」"}]}, {"id": "M35", "title": "仙人掌的刺是叶子变的", "theme": "科普", "paras": ["仙人掌生活在沙漠里，那里又干又热，雨水很少。为了在这么恶劣的环境里活下来，仙人掌想出了很多办法。", "你注意过吗？仙人掌身上没有普通的叶子，只有尖尖的刺。其实这些刺就是叶子变的！", "普通植物的叶子又大又薄，水分很容易从叶子上蒸发掉。沙漠里本来就缺水，如果仙人掌有大叶子，很快就会干死。", "于是仙人掌把叶子变成了细细的刺。刺的表面积很小，水分就不容易跑掉了。而且刺还能保护仙人掌，不被沙漠里的动物吃掉。", "仙人掌的绿色茎干里有厚厚的水分储存组织，像一个小水库。即使没有雨水，它也能靠储存的水活很长时间。"], "collectWords": ["沙漠", "恶劣", "蒸发", "表面积", "储存", "水库"], "quiz": [{"q": "仙人掌生活在哪里？", "opts": ["森林里", "沙漠里", "草原上"], "ans": 1, "why": "原文第1段写道：「仙人掌生活在沙漠里……」"}, {"q": "仙人掌的刺是什么变的？", "opts": ["根", "叶子", "茎"], "ans": 1, "why": "原文第2段写道：「其实这些刺就是叶子变的！」"}, {"q": "仙人掌为什么要把叶子变成刺？", "opts": ["为了好看", "为了减少水分蒸发", "为了扎人"], "ans": 1, "why": "原文第3、4段说明，大叶子容易蒸发水分，刺表面积小，水分不容易跑掉。"}, {"q": "仙人掌储存水分的地方在哪里？", "opts": ["刺里", "根里", "绿色茎干里"], "ans": 2, "why": "原文最后一段写道：「仙人掌的绿色茎干里有厚厚的水分储存组织，像一个小水库。」"}]}, {"id": "M36", "title": "为什么先看见闪电后听到雷声", "theme": "科普", "paras": ["夏天打雷的时候，我们总是先看到一道明亮的闪电，然后才听到轰隆隆的雷声。你知道为什么吗？", "这是因为光和声音传播的速度不一样。光跑得特别快，每秒钟能跑大约三十万公里，相当于一秒钟绕地球七圈半！", "而声音就慢多了。每秒钟只传播三百多米，比光慢了一百万倍。", "闪电和雷声其实是同时发生的，但光先到我们的眼睛，声音要晚一点才能到耳朵。所以我们先看到闪电，后听到雷声。", "如果你数一数从看到闪电到听到雷声过了几秒，就能算出雷电离你有多远。每过三秒钟，大约就是一千米的距离。"], "collectWords": ["传播", "闪电", "雷声", "大约", "轰隆隆", "同时发生"], "quiz": [{"q": "闪电和雷声哪个传播更快？", "opts": ["闪电", "雷声", "一样快"], "ans": 0, "why": "原文第2、3段说明，光每秒约三十万公里，声音每秒三百多米，光比声音快得多。"}, {"q": "光和声音是同时发生的吗？", "opts": ["是", "不是", "有时候是"], "ans": 0, "why": "原文第4段写道：「闪电和雷声其实是同时发生的……」"}, {"q": "为什么我们先看到闪电后听到雷声？", "opts": ["因为眼睛比耳朵灵敏", "因为光比声音传播快", "因为闪电先发生"], "ans": 1, "why": "原文第4段写道：「但光先到我们的眼睛，声音要晚一点才能到耳朵。所以我们先看到闪电，后听到雷声。」"}, {"q": "从看到闪电到听到雷声过了三秒，雷电大约离你多远？", "opts": ["一百米", "一千米", "三千米"], "ans": 1, "why": "原文最后一段写道：「每过三秒钟，大约就是一千米的距离。」"}]}, {"id": "M37", "title": "企鹅为什么不怕冷", "theme": "科普", "paras": ["企鹅生活在南极，那里到处都是冰雪，气温常常在零下几十度。企鹅穿着一身「燕尾服」，但它为什么不怕冷呢？", "企鹅身上有三层「保暖衣」。最外面是一层又密又防水的羽毛，像一件雨衣，能挡住风和海水。", "羽毛下面是一层厚厚的脂肪，就像穿着一件羽绒服，能把身体的热量锁住，不让热量跑掉。", "最里面是一层绒毛，软软的、暖暖的，贴着企鹅的皮肤。这三层保护让企鹅在冰天雪地里也能保持体温。", "企鹅还会挤在一起取暖，几百只企鹅紧紧靠在一起，中间的温度比外面高很多。轮流站在外圈的企鹅就不会一直挨冻了。"], "collectWords": ["南极", "防水", "脂肪", "锁住", "燕尾服", "体温"], "quiz": [{"q": "企鹅生活在哪里？", "opts": ["北极", "南极", "赤道"], "ans": 1, "why": "原文第1段写道：「企鹅生活在南极……」"}, {"q": "企鹅身上有几层保暖衣？", "opts": ["一层", "两层", "三层"], "ans": 2, "why": "原文第2段开头写道：「企鹅身上有三层「保暖衣」。」"}, {"q": "最外面一层羽毛有什么作用？", "opts": ["好看", "挡住风和海水", "储存热量"], "ans": 1, "why": "原文第2段写道：「最外面是一层又密又防水的羽毛，像一件雨衣，能挡住风和海水。」"}, {"q": "企鹅们怎么一起取暖？", "opts": ["挤在一起", "互相啄羽毛", "钻到雪里"], "ans": 0, "why": "原文最后一段写道：「企鹅还会挤在一起取暖，几百只企鹅紧紧靠在一起……」"}]}, {"id": "M38", "title": "人为什么会做梦", "theme": "科普", "paras": ["每个人晚上睡觉时都会做梦，有的梦很美好，有的梦很吓人。人为什么会做梦呢？", "我们的大脑即使在睡觉时也没有完全休息。有一部分脑细胞还在活跃地工作，整理白天看到、听到、想到的事情。", "白天我们经历了很多事，大脑会把重要的记下来，不重要的忘掉。这个过程有时候会在睡眠中继续，就形成了梦。", "科学家还发现，做梦的时候我们的眼球会快速转动，这个阶段叫做「快速眼动睡眠」。这时候大脑活动很活跃，大多数梦就发生在这个阶段。", "做梦对大脑是有好处的。它能帮助我们整理记忆、消化情绪，有时候还能激发创造力。所以做梦其实是大脑在「加班整理房间」呢！"], "collectWords": ["做梦", "活跃", "整理", "快速眼动", "情绪", "激发"], "quiz": [{"q": "睡觉时大脑完全休息了吗？", "opts": ["完全休息了", "有一部分脑细胞还在活跃工作", "只有一半休息"], "ans": 1, "why": "原文第2段写道：「我们的大脑即使在睡觉时也没有完全休息。有一部分脑细胞还在活跃地工作……」"}, {"q": "做梦时眼球会怎么样？", "opts": ["不动", "快速转动", "慢慢转动"], "ans": 1, "why": "原文第4段写道：「做梦的时候我们的眼球会快速转动，这个阶段叫做「快速眼动睡眠」。」"}, {"q": "大多数梦发生在哪个阶段？", "opts": ["刚睡着时", "快速眼动睡眠阶段", "快要醒来时"], "ans": 1, "why": "原文第4段写道：「大多数梦就发生在这个阶段。」这里的「这个阶段」指的就是快速眼动睡眠阶段。"}, {"q": "做梦对大脑有什么好处？", "opts": ["让大脑更累", "帮助整理记忆、消化情绪", "让人睡不着"], "ans": 1, "why": "原文最后一段写道：「它能帮助我们整理记忆、消化情绪，有时候还能激发创造力。」"}]}, {"id": "M39", "title": "为什么冰块会浮在水上", "theme": "科普", "paras": ["把一块冰放进水里，冰总是浮在水面上，不会沉下去。很多很重的东西都会沉到水底，为什么冰反而能浮起来呢？", "这和水的「脾气」有关。大多数东西都是热胀冷缩的，温度越低，体积越小，密度越大。但水有点特别。", "当水的温度降到四摄氏度以下时，它不但不收缩，反而开始膨胀。变成冰的时候，体积比同样重量的水大了大约十分之一。", "体积变大，密度就变小了。冰的密度比水小，所以冰就浮在了水面上。这就像油比水轻，会浮在水上一样。", "这个特性对自然界非常重要。冬天湖面结冰时，冰浮在上面，像一层被子盖住了下面的水，水底的鱼就不会被冻死了。"], "collectWords": ["浮", "膨胀", "密度", "热胀冷缩", "体积", "被子"], "quiz": [{"q": "冰放进水里会怎么样？", "opts": ["沉下去", "浮在水面上", "化掉"], "ans": 1, "why": "原文第1段写道：「冰总是浮在水面上，不会沉下去。」"}, {"q": "水变成冰时体积怎么变化？", "opts": ["变小", "变大", "不变"], "ans": 1, "why": "原文第3段写道：「变成冰的时候，体积比同样重量的水大了大约十分之一。」"}, {"q": "冰为什么能浮起来？", "opts": ["因为冰是空的", "因为冰的密度比水小", "因为水在推它"], "ans": 1, "why": "原文第4段写道：「冰的密度比水小，所以冰就浮在了水面上。」"}, {"q": "冰浮在水面上对鱼有什么好处？", "opts": ["鱼可以站在冰上", "冰像被子盖住下面的水，鱼不会被冻死", "鱼可以吃到冰"], "ans": 1, "why": "原文最后一段写道：「冰浮在上面，像一层被子盖住了下面的水，水底的鱼就不会被冻死了。」"}]}, {"id": "M40", "title": "蜻蜓为什么要点水", "theme": "科普", "paras": ["夏天，我们经常看到蜻蜓在水面上飞来飞去，尾巴轻轻点一下水面，又飞走了。人们说蜻蜓在「点水」，它到底在干什么呢？", "其实蜻蜓不是在喝水，也不是在玩。它在产卵——把卵产在水里。", "蜻蜓的幼虫叫做「水虿」，它们要在水里生活好几年，吃水里的小虫子长大。所以蜻蜓妈妈必须把卵产在水里或水边的植物上。", "点水的时候，蜻蜓把腹部末端伸进水里，一次产下几颗卵。有的蜻蜓直接把卵撒在水面上，有的则把卵产在水草的茎里。", "水虿长大后，会爬到水面的植物上，蜕去外壳，变成一只漂亮的蜻蜓飞上天空。从水里到天上，蜻蜓的一生真神奇！"], "collectWords": ["产卵", "水虿", "幼虫", "蜕去", "腹部", "水面"], "quiz": [{"q": "蜻蜓点水是在做什么？", "opts": ["在喝水", "在产卵", "在玩"], "ans": 1, "why": "原文第2段写道：「其实蜻蜓不是在喝水，也不是在玩。它在产卵——把卵产在水里。」"}, {"q": "蜻蜓的幼虫叫什么？", "opts": ["毛毛虫", "水虿", "蝌蚪"], "ans": 1, "why": "原文第3段写道：「蜻蜓的幼虫叫做「水虿」……」"}, {"q": "水虿生活在哪里？", "opts": ["树上", "土里", "水里"], "ans": 2, "why": "原文第3段写道：「它们要在水里生活好几年……」"}, {"q": "水虿长大后怎么变成蜻蜓？", "opts": ["直接长大", "爬到水面植物上蜕去外壳", "在水里变化"], "ans": 1, "why": "原文最后一段写道：「会爬到水面的植物上，蜕去外壳，变成一只漂亮的蜻蜓飞上天空。」"}]}, {"id": "M41", "title": "为什么脱毛衣时会冒火花", "theme": "科普", "paras": ["冬天脱毛衣的时候，有时候黑暗中会听到「噼啪」声，还能看到小小的火花。这是怎么回事呢？", "这种现象叫做「静电」。我们身体、衣服和其他东西都是由很小的微粒组成的，这些微粒有的带正电，有的带负电。", "正常情况下，正负电荷是平衡的，不会有什么现象。但当两件衣服互相摩擦时，一些电荷会从一件衣服跑到另一件上。", "脱毛衣时，毛衣和内衣快速摩擦，电荷不平衡了。当电荷积累到一定程度，就会突然跳回到原来的地方，同时发出小火花和「噼啪」的声音。", "干燥的天气更容易产生静电，因为空气里的水蒸气能帮助电荷散走。冬天空气干燥，所以静电现象更明显。"], "collectWords": ["静电", "摩擦", "电荷", "微粒", "噼啪", "积累"], "quiz": [{"q": "脱毛衣冒火花的现象叫什么？", "opts": ["雷电", "静电", "摩擦热"], "ans": 1, "why": "原文第2段写道：「这种现象叫做「静电」。」"}, {"q": "静电是怎么产生的？", "opts": ["衣服湿了", "两件衣服互相摩擦，电荷不平衡", "衣服太旧了"], "ans": 1, "why": "原文第3、4段说明，摩擦时电荷从一个物体跑到另一个，导致不平衡，积累到一定程度就产生火花。"}, {"q": "什么天气更容易产生静电？", "opts": ["潮湿的天气", "干燥的天气", "下雨天"], "ans": 1, "why": "原文最后一段写道：「干燥的天气更容易产生静电……冬天空气干燥，所以静电现象更明显。」"}, {"q": "空气里的水蒸气对静电有什么作用？", "opts": ["帮助电荷散走", "增加静电", "没有作用"], "ans": 0, "why": "原文最后一段写道：「空气里的水蒸气能帮助电荷散走。」"}]}, {"id": "M42", "title": "蝙蝠为什么倒挂着睡觉", "theme": "科普", "paras": ["蝙蝠是唯一会飞的哺乳动物。它们睡觉的时候，总是头朝下倒挂在树枝、洞穴顶或者屋檐下。为什么要这样呢？", "蝙蝠的前肢进化成了翅膀，后腿又短又小，力气也不大。如果像鸟一样站着睡觉，想飞起来会很困难。", "倒挂着就方便多了。蝙蝠的后腿有个特殊的构造，只要挂上去，爪子就会自动收紧，不用费力就能牢牢抓住。", "想飞的时候，蝙蝠只需要松开爪子，翅膀一张，借助重力就能立刻起飞。这就像跳水运动员从跳台上跳下去一样轻松。", "而且倒挂还能帮蝙蝠躲避地上的敌人。遇到危险时，它们马上就能飞走，比从地面起飞快得多。"], "collectWords": ["哺乳动物", "进化", "构造", "收紧", "借助", "躲避"], "quiz": [{"q": "蝙蝠是唯一会飞的什么动物？", "opts": ["鸟类", "哺乳动物", "昆虫"], "ans": 1, "why": "原文第1段写道：「蝙蝠是唯一会飞的哺乳动物。」"}, {"q": "蝙蝠的后腿有什么特点？", "opts": ["很长", "又短又小，力气不大", "很强壮"], "ans": 1, "why": "原文第2段写道：「后腿又短又小，力气也不大。」"}, {"q": "蝙蝠倒挂时爪子怎么抓住树枝？", "opts": ["用力握紧", "挂上去爪子自动收紧", "用胶水粘住"], "ans": 1, "why": "原文第3段写道：「蝙蝠的后腿有个特殊的构造，只要挂上去，爪子就会自动收紧……」"}, {"q": "倒挂对蝙蝠躲避敌人有什么好处？", "opts": ["可以伪装成果实", "遇到危险松开爪子立刻能飞走", "倒挂时敌人看不见"], "ans": 1, "why": "原文最后一段写道：「遇到危险时，它们马上就能飞走，比从地面起飞快得多。」"}]}, {"id": "M43", "title": "为什么面包里有很多小洞", "theme": "科普", "paras": ["吃面包的时候掰开一看，里面有很多密密麻麻的小洞。这些小洞是怎么来的呢？", "做面包的时候，师傅会在面团里加入一种叫做「酵母」的小生物。酵母是一种非常小的真菌，肉眼根本看不见。", "酵母在面团里会「吃」掉面粉中的糖分，然后产生一种气体——二氧化碳。这种气体在面团里形成了很多小气泡。", "面团放进烤箱加热后，里面的气泡受热膨胀，就把面团撑开了。烤好后，气泡的位置就变成了一个个小洞。", "这些小洞让面包变得又松又软。如果没有酵母，面团烤出来就像一块硬硬的饼干，咬都咬不动。"], "collectWords": ["酵母", "真菌", "二氧化碳", "气泡", "膨胀", "密密麻麻"], "quiz": [{"q": "做面包时加入面团里的小生物叫什么？", "opts": ["细菌", "酵母", "蘑菇"], "ans": 1, "why": "原文第2段写道：「师傅会在面团里加入一种叫做「酵母」的小生物。」"}, {"q": "酵母属于什么？", "opts": ["细菌", "真菌", "植物"], "ans": 1, "why": "原文第2段写道：「酵母是一种非常小的真菌……」"}, {"q": "酵母产生的气体叫什么？", "opts": ["氧气", "二氧化碳", "氢气"], "ans": 1, "why": "原文第3段写道：「然后产生一种气体——二氧化碳。」"}, {"q": "如果没有酵母，面包会怎么样？", "opts": ["更甜", "像硬硬的饼干", "没有味道"], "ans": 1, "why": "原文最后一段写道：「如果没有酵母，面团烤出来就像一块硬硬的饼干，咬都咬不动。」"}]}, {"id": "M44", "title": "蚂蚁为什么不会迷路", "theme": "科普", "paras": ["蚂蚁小小的身体，却能从很远的地方找到回家的路，从来不会迷路。它们是怎么做到的呢？", "原来蚂蚁会分泌一种特殊的气味，叫做「信息素」。当蚂蚁出门找食物时，一路上都会留下这种气味痕迹。", "信息素就像蚂蚁的「气味路标」。其他蚂蚁闻到这种气味，就知道这条路有人走过，前面可能有食物。", "找到食物后，蚂蚁会沿着原来的气味路标返回巢穴，同时留下新的气味，让路标更加清晰。", "就算气味被风吹散了，蚂蚁还能记住路上的景色和太阳的位置来辨别方向。小小的蚂蚁，竟然有这么厉害的「导航系统」！"], "collectWords": ["分泌", "信息素", "气味", "路标", "巢穴", "辨别"], "quiz": [{"q": "蚂蚁分泌的特殊气味叫什么？", "opts": ["香水", "信息素", "激素"], "ans": 1, "why": "原文第2段写道：「原来蚂蚁会分泌一种特殊的气味，叫做「信息素」。」"}, {"q": "信息素对蚂蚁来说像什么？", "opts": ["食物", "气味路标", "危险信号"], "ans": 1, "why": "原文第3段写道：「信息素就像蚂蚁的「气味路标」。」"}, {"q": "找到食物后蚂蚁怎么做？", "opts": ["直接吃掉", "沿着气味路标返回并留下新路标", "叫别的蚂蚁来"], "ans": 1, "why": "原文第4段写道：「找到食物后，蚂蚁会沿着原来的气味路标返回巢穴，同时留下新的气味，让路标更加清晰。」"}, {"q": "气味被风吹散后蚂蚁还怎么找路？", "opts": ["问别的动物", "记住路上的景色和太阳位置", "靠运气"], "ans": 1, "why": "原文最后一段写道：「蚂蚁还能记住路上的景色和太阳的位置来辨别方向。」"}]}, {"id": "M45", "title": "为什么煮熟的虾会变红", "theme": "科普", "paras": ["活的虾大多是青色或灰色的，可放进锅里一煮，就变成了鲜艳的红色。这是怎么回事呢？", "虾的身体里有一种红色的物质，叫做「虾青素」。但活的虾你看不见红色，因为虾青素被一种蛋白质包裹着。", "这种蛋白质和虾青素结合在一起时，颜色看起来就是青灰色的。就像蓝色的颜料和黄色的颜料混在一起会变成绿色一样。", "当虾被加热时，高温会破坏蛋白质的结构，蛋白质就和虾青素分开了。于是虾青素本来的红色就显现出来。", "不只是虾，螃蟹和龙虾煮熟后也会变红，因为它们身体里也有虾青素。大自然里的颜色变化真奇妙！"], "collectWords": ["虾青素", "蛋白质", "包裹", "高温", "鲜艳", "破坏"], "quiz": [{"q": "活的虾是什么颜色的？", "opts": ["红色", "青色或灰色", "黄色"], "ans": 1, "why": "原文第1段写道：「活的虾大多是青色或灰色的……」"}, {"q": "虾身体里红色的物质叫什么？", "opts": ["胡萝卜素", "虾青素", "花青素"], "ans": 1, "why": "原文第2段写道：「虾的身体里有一种红色的物质，叫做「虾青素」。」"}, {"q": "活的虾为什么看不见红色？", "opts": ["因为没有虾青素", "因为虾青素被蛋白质包裹着", "因为虾太小了"], "ans": 1, "why": "原文第2段写道：「但活的虾你看不见红色，因为虾青素被一种蛋白质包裹着。」"}, {"q": "煮熟后蛋白质怎么了？", "opts": ["变多了", "和虾青素分开了", "消失了"], "ans": 1, "why": "原文第4段写道：「高温会破坏蛋白质的结构，蛋白质就和虾青素分开了。」"}]}, {"id": "M46", "title": "卧薪尝胆", "theme": "成语", "paras": ["春秋时期，越国被吴国打败，越王勾践被迫到吴国当奴仆。他穿破衣、吃粗粮，受尽屈辱，但心里一直想着复国。", "三年后，勾践终于回到越国。为了不忘耻辱，他每天晚上睡在柴草上，还在屋里挂了一个苦胆。每天早上起床后，都要先尝一尝苦胆的味道。", "他亲自下地耕种，让妻子织布。吃饭时不吃肉，穿衣服不华丽，和百姓一起吃苦。", "越国在勾践的带领下越来越强大。又过了几年，越国终于打败了吴国，勾践成为春秋时期最后一位霸主。", "「卧薪尝胆」这个成语就是形容人刻苦自励、发愤图强，为了目标能忍受一切艰难困苦。"], "collectWords": ["卧薪尝胆", "屈辱", "复国", "发愤图强", "自励", "霸主"], "quiz": [{"q": "勾践是哪个国家的国王？", "opts": ["吴国", "越国", "楚国"], "ans": 1, "why": "原文第1段写道：「越国被吴国打败，越王勾践被迫到吴国当奴仆。」"}, {"q": "勾践为了不忘耻辱，晚上睡在哪里？", "opts": ["床上", "柴草上", "地上"], "ans": 1, "why": "原文第2段写道：「他每天晚上睡在柴草上……」"}, {"q": "勾践每天早上起床后先做什么？", "opts": ["去耕种", "尝一尝苦胆", "上朝"], "ans": 1, "why": "原文第2段写道：「每天早上起床后，都要先尝一尝苦胆的味道。」"}, {"q": "「卧薪尝胆」形容什么样的人？", "opts": ["喜欢吃苦的人", "刻苦自励、发愤图强的人", "当国王的人"], "ans": 1, "why": "原文最后一段写道：「形容人刻苦自励、发愤图强，为了目标能忍受一切艰难困苦。」"}]}, {"id": "M47", "title": "负荆请罪", "theme": "成语", "paras": ["战国时期，赵国有两位大臣，一位是廉颇，一位是蔺相如。蔺相如因为功劳大，被赵王封为上卿，地位比廉颇还高。", "廉颇很不服气，到处说：「我立下那么多战功，蔺相如只会耍嘴皮子，凭什么比我地位高？」", "蔺相如知道后，故意避开廉颇，不跟他正面冲突。他的门客不解，蔺相如说：「秦国不敢攻打赵国，是因为有我和廉颇。如果我们不和，赵国就危险了。」", "廉颇听到这话，羞愧不已。他脱去上衣，背着荆条到蔺相如家请罪，说：「我是个粗人，太糊涂了，请您用荆条打我吧！」", "蔺相如连忙扶起他，两人从此成为好朋友，一起保卫赵国。「负荆请罪」后来用来形容主动向人认错道歉。"], "collectWords": ["负荆请罪", "不服气", "上卿", "请罪", "羞愧", "冲突"], "quiz": [{"q": "廉颇和蔺相如都是哪个国家的大臣？", "opts": ["秦国", "赵国", "齐国"], "ans": 1, "why": "原文第1段写道：「赵国有两位大臣，一位是廉颇，一位是蔺相如。」"}, {"q": "廉颇为什么不服气？", "opts": ["因为他觉得自己功劳大", "因为蔺相如欺负他", "因为赵王对他不好"], "ans": 0, "why": "原文第2段写道：「我立下那么多战功，蔺相如只会耍嘴皮子，凭什么比我地位高？」"}, {"q": "廉颇是怎么向蔺相如认错的？", "opts": ["写信道歉", "背着荆条上门请罪", "请赵王帮忙说情"], "ans": 1, "why": "原文第4段写道：「他脱去上衣，背着荆条到蔺相如家请罪……」"}, {"q": "「负荆请罪」是什么意思？", "opts": ["背着荆条走路", "主动向人认错道歉", "向别人挑战"], "ans": 1, "why": "原文最后一段写道：「「负荆请罪」后来用来形容主动向人认错道歉。」"}]}, {"id": "M48", "title": "纸上谈兵", "theme": "成语", "paras": ["战国时期，赵国有个将军叫赵奢，他的儿子赵括从小熟读兵书，谈起兵法来头头是道，连父亲也辩不过他。", "赵奢却对妻子说：「赵括只会纸上谈兵，不是真正的将才。将来赵国不要用他为将才好。」", "后来赵奢去世，秦国攻打赵国。赵王听信谗言，让赵括代替老将廉颇带兵。", "赵括到了前线，完全改变了廉颇的防守策略，贸然进攻。结果中了秦军的埋伏，四十万赵军被围，赵括自己也被乱箭射死。", "「纸上谈兵」这个成语，就是讽刺那些只会空谈理论，没有实际经验，办不成事的人。"], "collectWords": ["纸上谈兵", "兵书", "头头是道", "埋伏", "将才", "贸然"], "quiz": [{"q": "赵括是谁的儿子？", "opts": ["赵王", "赵奢", "廉颇"], "ans": 1, "why": "原文第1段写道：「赵国有个将军叫赵奢，他的儿子赵括……」"}, {"q": "赵括从小熟读什么？", "opts": ["历史书", "兵书", "诗经"], "ans": 1, "why": "原文第1段写道：「赵括从小熟读兵书……」"}, {"q": "赵括是怎么死的？", "opts": ["病死", "被乱箭射死", "被秦军俘虏"], "ans": 1, "why": "原文第4段写道：「赵括自己也被乱箭射死。」"}, {"q": "「纸上谈兵」讽刺什么样的人？", "opts": ["不会写字的人", "只会空谈理论没有实际经验的人", "不爱读书的人"], "ans": 1, "why": "原文最后一段写道：「就是讽刺那些只会空谈理论，没有实际经验，办不成事的人。」"}]}, {"id": "M49", "title": "完璧归赵", "theme": "成语", "paras": ["战国时期，赵王得到了一块绝世美玉——和氏璧。秦王听说了，派人送信给赵王，说愿意用十五座城池来换这块玉。", "赵王和大臣们左右为难：给了玉怕秦王赖账不给城，不给又怕秦国出兵攻打。", "蔺相如挺身而出，带着和氏璧去了秦国。秦王拿到玉后，只字不提城池的事，还想把玉骗到手。", "蔺相如机智地说：「这块玉有一点瑕疵，请让我指给您看。」秦王把玉递给他，蔺相如抱着玉退到柱子旁，怒发冲冠地说：「您若逼我，我就和玉一起撞碎在这柱子上！」", "秦王怕他真的撞碎玉，只好让他回去。蔺相如最终把和氏璧完好无损地带回了赵国。「完璧归赵」比喻把原物完好地归还本人。"], "collectWords": ["完璧归赵", "左右为难", "挺身而出", "瑕疵", "怒发冲冠", "完好无损"], "quiz": [{"q": "和氏璧是什么？", "opts": ["一座城", "一块绝世美玉", "一个人"], "ans": 1, "why": "原文第1段写道：「赵王得到了一块绝世美玉——和氏璧。」"}, {"q": "秦王说用什么换和氏璧？", "opts": ["黄金", "十五座城池", "十五匹马"], "ans": 1, "why": "原文第1段写道：「说愿意用十五座城池来换这块玉。」"}, {"q": "蔺相如用什么借口把玉拿了回来？", "opts": ["说玉有瑕疵要指给秦王看", "说玉是假的", "说玉太重了"], "ans": 0, "why": "原文第4段写道：「这块玉有一点瑕疵，请让我指给您看。」"}, {"q": "「完璧归赵」比喻什么？", "opts": ["把玉摔碎", "把原物完好地归还本人", "去秦国旅游"], "ans": 1, "why": "原文最后一段写道：「「完璧归赵」比喻把原物完好地归还本人。」"}]}, {"id": "M50", "title": "三顾茅庐", "theme": "成语", "paras": ["东汉末年，刘备听说诸葛亮非常有才华，想请他出山帮助自己打天下。他带着关羽和张飞，亲自去隆中拜访。", "第一次去，诸葛亮不在家。刘备只好留下姓名，失望地回去了。", "第二次去，诸葛亮又出门了。刘备留下一封信，表达了自己求贤若渴的心情。", "第三次去的时候，诸葛亮正在午睡。刘备不让通报，静静站在门外等了一个多时辰。诸葛亮醒来后，被刘备的诚意打动，终于答应出山。", "后来诸葛亮辅佐刘备建立了蜀汉王朝。「三顾茅庐」比喻真心诚意、一再邀请有才能的人。"], "collectWords": ["三顾茅庐", "求贤若渴", "辅佐", "诚意", "才华", "拜访"], "quiz": [{"q": "刘备为什么要拜访诸葛亮？", "opts": ["因为他想买房子", "想请他出山帮忙打天下", "因为他是亲戚"], "ans": 1, "why": "原文第1段写道：「刘备听说诸葛亮非常有才华，想请他出山帮助自己打天下。」"}, {"q": "刘备带了谁一起去？", "opts": ["赵云和马超", "关羽和张飞", "黄忠和魏延"], "ans": 1, "why": "原文第1段写道：「他带着关羽和张飞，亲自去隆中拜访。」"}, {"q": "第三次去的时候诸葛亮在做什么？", "opts": ["读书", "午睡", "出门"], "ans": 1, "why": "原文第4段写道：「第三次去的时候，诸葛亮正在午睡。」"}, {"q": "「三顾茅庐」比喻什么？", "opts": ["去三次", "真心诚意一再邀请有才能的人", "拜访朋友"], "ans": 1, "why": "原文最后一段写道：「「三顾茅庐」比喻真心诚意、一再邀请有才能的人。」"}]}, {"id": "M51", "title": "曹冲称象", "theme": "成语", "paras": ["三国时期，曹操得到了一头大象。他想知道这头大象有多重，就问大臣们有没有什么办法。", "大臣们议论纷纷。有人说造一杆巨大的秤来称，可没那么大的秤；有人说把大象杀了切成块来称，曹操又不舍得。", "曹操的小儿子曹冲当时才七岁，他站出来说：「我有办法。」", "曹冲让人把大象牵到一艘大船上，船身沉下去一些。他在船舷上刻了一个记号，然后把大象牵上岸。", "接着，他让人往船上装石头，直到船沉到刻记号的位置。最后称一称所有石头的重量加起来，就是大象的重量了。曹操高兴极了，连连夸奖曹冲聪明。"], "collectWords": ["议论纷纷", "船舷", "刻记号", "不舍得", "连连夸奖", "沉下去"], "quiz": [{"q": "曹操想知道什么？", "opts": ["大象有多高", "大象有多重", "大象有多老"], "ans": 1, "why": "原文第1段写道：「他想知道这头大象有多重……」"}, {"q": "曹冲当时几岁？", "opts": ["五岁", "七岁", "十岁"], "ans": 1, "why": "原文第3段写道：「曹操的小儿子曹冲当时才七岁……」"}, {"q": "曹冲在船舷上刻记号是为了什么？", "opts": ["做个装饰", "记住船下沉的位置", "测量船的长度"], "ans": 1, "why": "原文第4段说明，刻记号是为了记住大象上船后船身下沉的位置。"}, {"q": "曹冲用什么代替大象来称重？", "opts": ["石头", "水", "沙子"], "ans": 0, "why": "原文第5段写道：「他让人往船上装石头，直到船沉到刻记号的位置。最后称一称所有石头的重量加起来，就是大象的重量了。」"}]}, {"id": "M52", "title": "司马光砸缸", "theme": "成语", "paras": ["北宋时期，有个叫司马光的小男孩，他从小就非常聪明好学。", "一天，司马光和几个小伙伴在院子里玩捉迷藏。一个小伙伴爬上了院子里的水缸，一不小心掉了进去。", "水缸又高又大，里面装满了水。小伙伴在水里拼命挣扎，其他的孩子都吓呆了，有的跑去找大人，有的吓得哭起来。", "司马光没有慌张。他看见地上有一块石头，急中生智，抱起石头用力朝水缸砸去。", "「砰」的一声，水缸被砸破了，水哗啦哗啦流了出来，小伙伴也顺着水流出来了。大家都夸司马光勇敢又机智。"], "collectWords": ["水缸", "拼命挣扎", "吓呆", "急中生智", "慌张", "勇敢"], "quiz": [{"q": "司马光是什么朝代的人？", "opts": ["唐朝", "北宋", "南宋"], "ans": 1, "why": "原文第1段写道：「北宋时期，有个叫司马光的小男孩……」"}, {"q": "小伙伴是怎么掉进水缸的？", "opts": ["被推下去的", "爬上去一不小心掉进去的", "自己跳进去的"], "ans": 1, "why": "原文第2段写道：「一个小伙伴爬上了院子里的水缸，一不小心掉了进去。」"}, {"q": "其他孩子看到小伙伴掉进水缸后怎么做？", "opts": ["都吓呆了", "一起砸缸", "把小伙伴拉上来"], "ans": 0, "why": "原文第3段写道：「其他的孩子都吓呆了，有的跑去找大人，有的吓得哭起来。」"}, {"q": "司马光用什么砸破了水缸？", "opts": ["砖头", "石头", "锤子"], "ans": 1, "why": "原文第4段写道：「他看见地上有一块石头，急中生智，抱起石头用力朝水缸砸去。」"}]}, {"id": "M53", "title": "铁杵磨成针", "theme": "成语", "paras": ["唐朝诗人李白小时候很聪明，但不喜欢读书，经常逃学出去玩。", "有一天，他又逃学了，来到一条小溪边。他看见一位白发苍苍的老奶奶，正蹲在一块大石头上，手里拿着一根粗粗的铁棒，在石头上磨来磨去。", "李白好奇地问：「老奶奶，您在干什么呀？」老奶奶说：「我要把这根铁棒磨成一根绣花针。」", "李白吃惊地说：「这么粗的铁棒，怎么可能磨成细细的针呢？」老奶奶笑着说：「只要功夫深，铁杵磨成针。我每天磨，总有一天会磨成的。」", "李白听了很惭愧，从此发奋读书，后来成为了中国历史上最伟大的诗人之一。"], "collectWords": ["铁杵磨成针", "白发苍苍", "逃学", "绣花针", "惭愧", "发奋"], "quiz": [{"q": "李白小时候怎么样？", "opts": ["很喜欢读书", "不喜欢读书，经常逃学", "没有上过学"], "ans": 1, "why": "原文第1段写道：「李白小时候很聪明，但不喜欢读书，经常逃学出去玩。」"}, {"q": "老奶奶在磨什么？", "opts": ["木棒", "铁棒", "石头"], "ans": 1, "why": "原文第2段写道：「手里拿着一根粗粗的铁棒，在石头上磨来磨去。」"}, {"q": "老奶奶想把铁棒磨成什么？", "opts": ["一根筷子", "一根绣花针", "一把刀"], "ans": 1, "why": "原文第3段老奶奶说：「我要把这根铁棒磨成一根绣花针。」"}, {"q": "这个故事告诉我们什么道理？", "opts": ["铁棒很有用", "只要功夫深，坚持就能成功", "老奶奶力气很大"], "ans": 1, "why": "原文第4段老奶奶说：「只要功夫深，铁杵磨成针。」说明坚持就能成功。"}]}, {"id": "M54", "title": "围魏救赵", "theme": "成语", "paras": ["战国时期，魏国派大将庞涓率军攻打赵国，把赵国的都城邯郸团团围住。赵国急忙向齐国求救。", "齐王派田忌为将、孙膑为军师，带兵去救赵国。田忌想直接去邯郸和魏军交战，孙膑却摇摇头。", "孙膑说：「魏国的精锐部队都在赵国，国内一定空虚。我们不去赵国，直接去攻打魏国的都城大梁。庞涓听说老巢被攻，一定会撤军回救。」", "田忌听从了孙膑的计策，率军直奔大梁。庞涓果然慌了，连忙从邯郸撤军回救。", "魏军在回国的路上，经过桂陵时遭到齐军伏击，大败而归。赵国因此得救。「围魏救赵」就是攻击敌人后方，迫使敌人撤兵的计策。"], "collectWords": ["围魏救赵", "精锐", "空虚", "撤军", "军师", "伏击"], "quiz": [{"q": "魏国攻打的是哪个国家？", "opts": ["齐国", "赵国", "楚国"], "ans": 1, "why": "原文第1段写道：「魏国派大将庞涓率军攻打赵国……」"}, {"q": "孙膑是什么身份？", "opts": ["大将", "军师", "国王"], "ans": 1, "why": "原文第2段写道：「齐王派田忌为将、孙膑为军师……」"}, {"q": "孙膑建议去攻打哪里？", "opts": ["邯郸", "大梁", "桂陵"], "ans": 1, "why": "原文第3段写道：「我们不去赵国，直接去攻打魏国的都城大梁。」"}, {"q": "「围魏救赵」是什么意思？", "opts": ["围住魏国救出赵国", "攻击敌人后方迫使撤兵", "和赵国会师"], "ans": 1, "why": "原文最后一段写道：「「围魏救赵」就是攻击敌人后方，迫使敌人撤兵的计策。」"}]}, {"id": "M55", "title": "郑人买履", "theme": "成语", "paras": ["从前有个郑国人，想去买一双新鞋。他先在家里量好了自己脚的尺寸，把尺码写在一张纸条上。", "到了集市，他看中了一双鞋，正要付钱，忽然发现纸条忘带了。他对卖鞋的人说：「我忘记带尺码了，等我回家取来再买。」", "卖鞋的人说：「你为什么不直接用脚试穿一下呢？」他说：「我宁愿相信尺码，也不相信自己的脚。」", "等他跑回家拿了纸条再赶回集市，集市已经散了，鞋铺也关门了。他最终没有买到鞋。", "「郑人买履」讽刺那些墨守成规、迷信教条而不相信实际的人。"], "collectWords": ["郑人买履", "尺码", "集市", "墨守成规", "迷信教条", "试穿"], "quiz": [{"q": "郑国人要去买什么？", "opts": ["衣服", "鞋子", "帽子"], "ans": 1, "why": "原文第1段写道：「想去买一双新鞋。」"}, {"q": "他把尺码写在哪里？", "opts": ["手上", "一张纸条上", "脑子里"], "ans": 1, "why": "原文第1段写道：「把尺码写在一张纸条上。」"}, {"q": "卖鞋的人建议他怎么做？", "opts": ["回家取尺码", "直接用脚试穿", "量一下脚"], "ans": 1, "why": "原文第3段卖鞋的人说：「你为什么不直接用脚试穿一下呢？」"}, {"q": "郑国人最后买到鞋了吗？", "opts": ["买到了", "没有买到", "买了别的鞋"], "ans": 1, "why": "原文第4段写道：「集市已经散了，鞋铺也关门了。他最终没有买到鞋。」"}]}, {"id": "M56", "title": "囊萤映雪", "theme": "成语", "paras": ["古时候读书是一件很奢侈的事，因为很多穷人家里连灯油都买不起，晚上没法看书。", "晋朝有个叫车胤的孩子，家里很穷。夏天晚上，他看见萤火虫一闪一闪地飞，灵机一动，捉了很多萤火虫装在薄纱袋里。", "萤火虫发出的光虽然微弱，但几十只聚在一起，就像一盏小灯。车胤借着这光，每天晚上读到深夜。", "同一时期，还有个叫孙康的孩子，也是穷得买不起灯油。冬天夜里，他看见雪地反射月光，把整个院子照得亮堂堂的。", "孙康立刻拿出书来，坐在雪地里借着雪光读书。后来车胤和孙康都成为了有名的学者。「囊萤映雪」形容在艰苦的条件下勤奋读书。"], "collectWords": ["囊萤映雪", "萤火虫", "薄纱", "微弱", "反射", "奢侈"], "quiz": [{"q": "车胤用什么来照明读书？", "opts": ["蜡烛", "萤火虫", "火把"], "ans": 1, "why": "原文第2、3段说明，车胤捉了很多萤火虫装在薄纱袋里，借萤光读书。"}, {"q": "孙康用什么来照明读书？", "opts": ["月光", "雪光", "星光"], "ans": 1, "why": "原文第4段写道：「他看见雪地反射月光……孙康立刻拿出书来，坐在雪地里借着雪光读书。」"}, {"q": "车胤和孙康都是哪个朝代的？", "opts": ["汉朝", "晋朝", "唐朝"], "ans": 1, "why": "原文第2段写道：「晋朝有个叫车胤的孩子……」第4段也提到「同一时期」。"}, {"q": "「囊萤映雪」形容什么？", "opts": ["晚上捉萤火虫", "在艰苦条件下勤奋读书", "下雪天出去玩"], "ans": 1, "why": "原文最后一段写道：「「囊萤映雪」形容在艰苦的条件下勤奋读书。」"}]}, {"id": "M57", "title": "指鹿为马", "theme": "成语", "paras": ["秦朝末年，丞相赵野心勃勃，想篡夺皇位。他想看看朝中大臣有多少人听自己的话，于是想了一个狡猾的办法。", "一天，赵高牵着一只鹿来到秦二世面前，说：「陛下，我献给您一匹好马。」秦二世笑着说：「丞相弄错了吧，这明明是一只鹿啊。」", "赵高转过头问身边的大臣：「你们说这是鹿还是马？」有的大臣害怕赵高，沉默不语；有的为了讨好赵高，跟着说：「是马，是马！」", "只有几个正直的大臣坚持说：「这就是鹿。」赵高暗暗记下了这些人的名字。", "后来，赵高找借口把那些说「鹿」的大臣都杀害了。「指鹿为马」就是故意颠倒黑白、混淆是非的意思。"], "collectWords": ["指鹿为马", "篡夺", "野心勃勃", "狡猾", "讨好", "混淆是非"], "quiz": [{"q": "赵高是什么身份？", "opts": ["皇帝", "丞相", "将军"], "ans": 1, "why": "原文第1段写道：「秦朝末年，丞相赵高……」"}, {"q": "赵高把鹿说成什么？", "opts": ["羊", "马", "狗"], "ans": 1, "why": "原文第2段赵高说：「陛下，我献给您一匹好马。」"}, {"q": "说「是马」的大臣为什么这样说？", "opts": ["因为他们真以为是马", "为了讨好赵高", "他们眼睛不好"], "ans": 1, "why": "原文第3段写道：「有的为了讨好赵高，跟着说：「是马，是马！」"}, {"q": "「指鹿为马」是什么意思？", "opts": ["认错动物", "故意颠倒黑白、混淆是非", "很喜欢鹿"], "ans": 1, "why": "原文最后一段写道：「「指鹿为马」就是故意颠倒黑白、混淆是非的意思。」"}]}, {"id": "M58", "title": "望梅止渴", "theme": "成语", "paras": ["三国时期，曹操率领大军去打仗。夏天天气炎热，士兵们又累又渴，行军速度越来越慢。", "附近找不到水源，士兵们嗓子都快冒烟了，有人甚至晕倒在地上。曹操很着急，怕耽误战机。", "他想了想，骑在马上大声说：「前面不远有一片梅林，梅子又大又酸，大家到了那里就可以吃梅子解渴了！」", "士兵们一听，嘴里不自觉地分泌出口水，感觉没那么渴了。大家打起精神，加快了脚步往前赶。", "虽然前面并没有梅林，但曹操用这个方法鼓舞了士气。后来「望梅止渴」就用来比喻用空想或假象来安慰自己。"], "collectWords": ["望梅止渴", "鼓舞", "分泌", "耽误", "士气", "假象"], "quiz": [{"q": "曹操的军队遇到了什么困难？", "opts": ["迷路了", "又累又渴找不到水", "敌人太多了"], "ans": 1, "why": "原文第1段写道：「夏天天气炎热，士兵们又累又渴……」第2段写道：「附近找不到水源……」"}, {"q": "曹操对士兵们说了什么？", "opts": ["前面有水源", "前面有一片梅林可以吃梅子", "前面可以休息"], "ans": 1, "why": "原文第3段写道：「前面不远有一片梅林，梅子又大又酸，大家到了那里就可以吃梅子解渴了！」"}, {"q": "士兵们听了之后怎么了？", "opts": ["立刻找到了水", "嘴里分泌出口水，没那么渴了", "都去吃梅子了"], "ans": 1, "why": "原文第4段写道：「士兵们一听，嘴里不自觉地分泌出口水，感觉没那么渴了。」"}, {"q": "「望梅止渴」比喻什么？", "opts": ["吃梅子", "用空想或假象来安慰自己", "带兵打仗"], "ans": 1, "why": "原文最后一段写道：「后来「望梅止渴」就用来比喻用空想或假象来安慰自己。」"}]}, {"id": "M59", "title": "破釜沉舟", "theme": "成语", "paras": ["秦朝末年，项羽率领楚军渡过漳河，去救援被秦军围困的赵国。楚军只有几万人，而秦军有四十万，力量悬殊。", "项羽深知这一仗必须赢，否则就没有退路了。他下令让士兵们渡过河后，把渡河的船全部凿沉，把做饭的锅全部砸破，把帐篷全部烧掉。", "士兵们都很吃惊。项羽说：「我们只有三天的粮食，此战不胜，就只有死路一条！大家必须拼命作战！」", "楚军士兵知道没有退路了，个个奋勇杀敌，以一当十。经过九次激战，楚军终于大败秦军，解了赵国之围。", "「破釜沉舟」比喻下定决心，不顾一切地干到底，不留任何退路。"], "collectWords": ["破釜沉舟", "悬殊", "凿沉", "帐篷", "奋勇", "退路"], "quiz": [{"q": "项羽是哪个军队的首领？", "opts": ["秦军", "楚军", "赵军"], "ans": 1, "why": "原文第1段写道：「项羽率领楚军渡过漳河……」"}, {"q": "项羽下令把船和锅怎么样？", "opts": ["送给百姓", "全部凿沉砸破", "藏起来"], "ans": 1, "why": "原文第2段写道：「把渡河的船全部凿沉，把做饭的锅全部砸破……」"}, {"q": "楚军士兵为什么个个奋勇杀敌？", "opts": ["因为粮草充足", "因为没有退路了", "因为敌人很弱"], "ans": 1, "why": "原文第3、4段说明，项羽告诉士兵「此战不胜就只有死路一条」，所以「楚军士兵知道没有退路了，个个奋勇杀敌」。"}, {"q": "「破釜沉舟」比喻什么？", "opts": ["做饭", "下定决心不留退路干到底", "过河"], "ans": 1, "why": "原文最后一段写道：「「破釜沉舟」比喻下定决心，不顾一切地干到底，不留任何退路。」"}]}, {"id": "M60", "title": "凿壁偷光", "theme": "成语", "paras": ["西汉时期，有个叫匡衡的孩子，他非常喜欢读书，但家里太穷了，连蜡烛都买不起。", "邻居家比较富裕，每天晚上都点着蜡烛读书到很晚。匡衡很想借光看书，可不好意思开口求人。", "一天晚上，匡衡发现墙壁上有道缝隙，透过缝隙能看到邻居家的烛光。他灵机一动，悄悄把缝隙凿大了一点。", "一束微弱的光透了过来。匡衡高兴极了，他捧着书，凑在墙缝旁，借着这点光认真地读了起来。", "匡衡就这样刻苦读书，后来成为了西汉有名的学者，还当上了丞相。「凿壁偷光」就是形容家境贫寒却刻苦读书的精神。"], "collectWords": ["凿壁偷光", "缝隙", "烛光", "刻苦", "贫寒", "丞相"], "quiz": [{"q": "匡衡是哪个朝代的人？", "opts": ["东汉", "西汉", "秦朝"], "ans": 1, "why": "原文第1段写道：「西汉时期，有个叫匡衡的孩子……」"}, {"q": "匡衡为什么买不起蜡烛？", "opts": ["因为蜡烛太贵了", "因为家里太穷", "因为买不到"], "ans": 1, "why": "原文第1段写道：「但家里太穷了，连蜡烛都买不起。」"}, {"q": "匡衡是怎么借到光的？", "opts": ["向邻居借蜡烛", "把墙壁上的缝隙凿大", "去门外看书"], "ans": 1, "why": "原文第3段写道：「他灵机一动，悄悄把缝隙凿大了一点。」"}, {"q": "「凿壁偷光」形容什么精神？", "opts": ["喜欢偷东西", "家境贫寒却刻苦读书", "善于修墙"], "ans": 1, "why": "原文最后一段写道：「「凿壁偷光」就是形容家境贫寒却刻苦读书的精神。」"}]}, {"id": "M61", "title": "为什么饭前要洗手", "theme": "生活", "paras": ["我们的双手每天都要摸很多东西：门把手、书本、玩具、还有各种各样的食物。这些东西上面常常藏着我们看不见的小坏蛋——细菌。", "细菌非常小，小到要用显微镜才能看见。它们虽然看不见，但是数量惊人。一只没洗过的手上，可能有几百万甚至几千万个细菌！", "如果不洗手就吃东西，这些细菌就会跟着食物一起跑进我们的肚子里。有些细菌会让肚子痛、拉肚子，严重的还会让我们生病发烧。", "用肥皂和流动的水洗手，可以把大部分的细菌冲走。洗手的时候要搓搓手心、手背、指缝和指甲，至少洗二十秒，也就是唱两遍《生日快乐》歌的时间。", "饭前洗手是一个简单的好习惯，但它能像一道小盾牌一样，保护我们的身体健康。"], "collectWords": ["细菌", "显微镜", "惊人", "拉肚子", "流动", "盾牌"], "quiz": [{"q": "手上藏着什么看不见的小坏蛋？", "opts": ["灰尘", "细菌", "虫子"], "ans": 1, "why": "原文第1段写道：「这些东西上面常常藏着我们看不见的小坏蛋——细菌。」"}, {"q": "一只没洗过的手上可能有多少细菌？", "opts": ["几十个", "几百个", "几百万甚至几千万个"], "ans": 2, "why": "原文第2段写道：「一只没洗过的手上，可能有几百万甚至几千万个细菌！」"}, {"q": "洗手至少要洗多长时间？", "opts": ["五秒", "十秒", "二十秒"], "ans": 2, "why": "原文第4段写道：「至少洗二十秒，也就是唱两遍《生日快乐》歌的时间。」"}, {"q": "饭前洗手有什么好处？", "opts": ["让手变香", "像小盾牌保护身体健康", "让食物更好吃"], "ans": 1, "why": "原文最后一段写道：「但它能像一道小盾牌一样，保护我们的身体健康。」"}]}, {"id": "M62", "title": "怎么区分生鸡蛋和熟鸡蛋", "theme": "生活", "paras": ["早上煮鸡蛋的时候，有时候会忘记哪个是生的、哪个是熟的。其实有一个很简单的方法可以区分它们。", "把鸡蛋放在桌子上，用手指轻轻一转。如果鸡蛋转得又快又稳，像一个小陀螺一样，那就是熟鸡蛋。", "如果鸡蛋转得摇摇晃晃，转几圈就停了，那就是生鸡蛋。这是因为生鸡蛋里面是液体，转动的时候里面的蛋黄和蛋白会晃来晃去，拖慢速度。", "熟鸡蛋的蛋白和蛋黄都凝固了，整个鸡蛋像一块固体，所以能转得又快又稳。", "这个办法不用打破鸡蛋就能知道生熟，是不是很方便？下次煮鸡蛋时试试看吧！"], "collectWords": ["区分", "陀螺", "摇摇晃晃", "凝固", "蛋黄", "蛋白"], "quiz": [{"q": "熟鸡蛋转起来像什么？", "opts": ["小球", "小陀螺", "不倒翁"], "ans": 1, "why": "原文第2段写道：「像一个小陀螺一样，那就是熟鸡蛋。」"}, {"q": "生鸡蛋转起来怎么样？", "opts": ["又快又稳", "摇摇晃晃，转几圈就停了", "根本转不动"], "ans": 1, "why": "原文第3段写道：「如果鸡蛋转得摇摇晃晃，转几圈就停了，那就是生鸡蛋。」"}, {"q": "为什么生鸡蛋转不稳？", "opts": ["因为它太重", "因为里面是液体，会晃来晃去", "因为蛋壳太滑"], "ans": 1, "why": "原文第3段写道：「这是因为生鸡蛋里面是液体，转动的时候里面的蛋黄和蛋白会晃来晃去，拖慢速度。」"}, {"q": "这个办法需要打破鸡蛋吗？", "opts": ["需要", "不需要", "有时候需要"], "ans": 1, "why": "原文第5段写道：「这个办法不用打破鸡蛋就能知道生熟……」"}]}, {"id": "M63", "title": "为什么打哈欠会传染", "theme": "生活", "paras": ["你有没有发现，当别人打哈欠的时候，你也忍不住想打哈欠？这种现象叫做「传染性打哈欠」，很多人都会这样。", "科学家研究发现，打哈欠传染和我们大脑里的一种特殊细胞有关，这种细胞叫做「镜像神经元」。它的作用就像一面镜子，让我们能「模仿」别人的动作和情绪。", "当别人打哈欠时，我们的镜像神经元看到了，就像自己也在打哈欠一样，于是我们也跟着打了起来。", "有趣的是，越亲近的人打哈欠，我们越容易跟着打。比如看到家人或好朋友打哈欠，比看到陌生人打哈欠更容易传染。", "打哈欠本身能让大脑获得更多氧气，帮助我们提神。 contagious yawning 可能是一种古老的社交信号，让一群人同时保持清醒。"], "collectWords": ["传染", "镜像神经元", "模仿", "情绪", "提神", "社交"], "quiz": [{"q": "打哈欠传染和大脑里的什么细胞有关？", "opts": ["记忆细胞", "镜像神经元", "红细胞"], "ans": 1, "why": "原文第2段写道：「和我们大脑里的一种特殊细胞有关，这种细胞叫做「镜像神经元」。」"}, {"q": "镜像神经元的作用像什么？", "opts": ["一台电脑", "一面镜子", "一本书"], "ans": 1, "why": "原文第2段写道：「它的作用就像一面镜子，让我们能「模仿」别人的动作和情绪。」"}, {"q": "谁打哈欠最容易传染给我们？", "opts": ["陌生人", "亲近的人", "老师"], "ans": 1, "why": "原文第4段写道：「越亲近的人打哈欠，我们越容易跟着打。」"}, {"q": "打哈欠本身有什么作用？", "opts": ["让大脑获得更多氧气，提神", "让人变困", "让嘴巴变大"], "ans": 0, "why": "原文第5段写道：「打哈欠本身能让大脑获得更多氧气，帮助我们提神。」"}]}, {"id": "M64", "title": "为什么切开洋葱会流泪", "theme": "生活", "paras": ["妈妈在厨房里切洋葱的时候，经常会一边切一边流眼泪。洋葱明明没有碰到眼睛，为什么会让人流泪呢？", "原来，洋葱的细胞里含有一种特殊的物质。当刀把洋葱切开时，细胞破裂了，这种物质就跑了出来。", "它遇到空气后，变成了一种有刺激性的气体。这种气体飘到眼睛里，会刺激眼睛的神经。", "眼睛受到刺激后，就会自动分泌眼泪，想把这种刺激物冲走。所以眼泪就止不住地流了出来。", "有一个小窍门可以减少流泪：切洋葱前把洋葱放进冰箱里冷藏一会儿，或者在水龙头下切，这样刺激性气体就不会那么容易被释放出来了。"], "collectWords": ["洋葱", "刺激性", "细胞", "破裂", "分泌", "窍门"], "quiz": [{"q": "洋葱细胞里含有什么？", "opts": ["糖分", "一种特殊的物质", "水"], "ans": 1, "why": "原文第2段写道：「洋葱的细胞里含有一种特殊的物质。」"}, {"q": "这种物质遇到空气后变成什么？", "opts": ["香味", "有刺激性的气体", "甜味"], "ans": 1, "why": "原文第3段写道：「它遇到空气后，变成了一种有刺激性的气体。」"}, {"q": "眼睛为什么会流泪？", "opts": ["因为伤心", "因为想冲走刺激物", "因为洋葱太辣了"], "ans": 1, "why": "原文第4段写道：「眼睛受到刺激后，就会自动分泌眼泪，想把这种刺激物冲走。」"}, {"q": "怎样可以减少切洋葱时流泪？", "opts": ["大声唱歌", "把洋葱冷藏一会儿再切", "闭着眼睛切"], "ans": 1, "why": "原文最后一段写道：「切洋葱前把洋葱放进冰箱里冷藏一会儿……这样刺激性气体就不会那么容易被释放出来了。」"}]}, {"id": "M65", "title": "彩虹糖溶解实验", "theme": "生活", "paras": ["你吃过彩虹糖吗？五颜六色的糖衣包裹着甜甜的糖果。其实彩虹糖还可以用来做一个小实验呢！", "在盘子里摆一圈彩虹糖，颜色要错开，比如红、黄、绿、紫这样间隔着放。然后往盘子中间慢慢倒一点温水。", "你会看到神奇的一幕：糖衣上的颜色慢慢溶解到水里，像一条条彩色的小河从糖果流向盘子中心。", "不同颜色的「小河」在水面上相遇，但不会马上混合在一起。这是因为每种颜色的糖密度差不多，扩散的速度也差不多。", "最后，盘子里会出现一个五彩缤纷的圆环。这是因为糖衣里的食用色素溶解在了水里。这个实验既好看又安全，你可以在家里试一试！"], "collectWords": ["溶解", "错开", "间隔", "五彩缤纷", "扩散", "密度"], "quiz": [{"q": "彩虹糖实验要在盘子里放什么？", "opts": ["冷水", "温水", "热水"], "ans": 1, "why": "原文第2段写道：「然后往盘子中间慢慢倒一点温水。」"}, {"q": "颜色要怎么摆放？", "opts": ["按顺序排", "错开间隔着放", "随便放"], "ans": 1, "why": "原文第2段写道：「颜色要错开，比如红、黄、绿、紫这样间隔着放。」"}, {"q": "颜色会像什么一样流向中心？", "opts": ["彩色的小河", "瀑布", "小溪"], "ans": 0, "why": "原文第3段写道：「像一条条彩色的小河从糖果流向盘子中心。」"}, {"q": "不同颜色的「小河」为什么不会马上混合？", "opts": ["因为它们互相排斥", "因为密度和扩散速度差不多", "因为水不够多"], "ans": 1, "why": "原文第4段写道：「这是因为每种颜色的糖密度差不多，扩散的速度也差不多。」"}]}, {"id": "M66", "title": "为什么吃饭不能太快", "theme": "生活", "paras": ["有的同学吃饭像比赛一样，三口两口就把一碗饭吃完了。其实吃饭太快对身体不好，我们应该细嚼慢咽。", "我们的牙齿和唾液是消化食物的第一步。牙齿把食物嚼碎，唾液里的酶帮助分解食物。如果嚼得太快太急，食物颗粒还很大就咽下去，胃就要花更多力气来消化。", "而且，我们的大脑需要大约二十分钟才能接收到「吃饱了」的信号。吃得太快，大脑还没反应过来，就已经吃撑了。", "长期吃得太快太多，容易发胖，还会引起消化不良、胃胀等不舒服的感觉。", "所以，每口饭最好嚼二十到三十下再咽下去。慢慢吃，不仅能品尝食物的味道，还能让身体更健康。"], "collectWords": ["细嚼慢咽", "消化", "酶", "信号", "发胖", "胃胀"], "quiz": [{"q": "牙齿和唾液在消化中起什么作用？", "opts": ["消化食物的第一步", "最后一步", "没有作用"], "ans": 0, "why": "原文第2段写道：「我们的牙齿和唾液是消化食物的第一步。」"}, {"q": "大脑多久才能接收到「吃饱了」的信号？", "opts": ["五分钟", "十分钟", "大约二十分钟"], "ans": 2, "why": "原文第3段写道：「我们的大脑需要大约二十分钟才能接收到「吃饱了」的信号。」"}, {"q": "吃得太快太多容易怎么样？", "opts": ["变瘦", "容易发胖", "没有影响"], "ans": 1, "why": "原文第4段写道：「长期吃得太快太多，容易发胖……」"}, {"q": "每口饭最好嚼多少下？", "opts": ["五到十下", "二十到三十下", "五十下"], "ans": 1, "why": "原文最后一段写道：「每口饭最好嚼二十到三十下再咽下去。」"}]}, {"id": "M67", "title": "冰箱里的霜是怎么来的", "theme": "生活", "paras": ["如果你家用的是老式冰箱，打开冷冻室，有时候会看到四壁结了一层白白的霜。这层霜是怎么来的呢？", "空气中总是有一些看不见的水蒸气。当我们打开冰箱门时，外面的热空气带着水蒸气跑进了冷冻室。", "冷冻室的温度非常低，通常在零下十八度左右。热空气一进去就被冷却了，里面的水蒸气遇冷变成了小冰晶。", "这些小冰晶一层一层地附着在冷冻室的内壁上，日积月累，就变成了白白的霜。", "霜太厚会占用空间，还会让冰箱更耗电。所以要定期除霜。现在的新式冰箱有自动除霜功能，就方便多了。"], "collectWords": ["霜", "水蒸气", "冷冻室", "冰晶", "附着", "日积月累"], "quiz": [{"q": "霜是在冰箱的哪个部分出现的？", "opts": ["冷藏室", "冷冻室", "门上"], "ans": 1, "why": "原文第1段写道：「打开冷冻室，有时候会看到四壁结了一层白白的霜。」"}, {"q": "空气中的什么跑进冷冻室会变成霜？", "opts": ["氧气", "水蒸气", "氮气"], "ans": 1, "why": "原文第2段写道：「外面的热空气带着水蒸气跑进了冷冻室。」"}, {"q": "水蒸气为什么变成冰晶？", "opts": ["因为冷冻室温度很低，水蒸气遇冷", "因为冰箱里有风", "因为水蒸气自己变的"], "ans": 0, "why": "原文第3段写道：「冷冻室的温度非常低……里面的水蒸气遇冷变成了小冰晶。」"}, {"q": "霜太厚有什么坏处？", "opts": ["没有坏处", "占用空间还让冰箱更耗电", "让食物变甜"], "ans": 1, "why": "原文最后一段写道：「霜太厚会占用空间，还会让冰箱更耗电。」"}]}, {"id": "M68", "title": "为什么运动后不能马上喝冰水", "theme": "生活", "paras": ["夏天跑完步，满头大汗，这时候来一杯冰凉的饮料，听起来特别舒服。但运动后马上喝冰水，其实对身体不好。", "运动的时候，我们的身体会产生很多热量，心跳加快，血液流动变快，全身的毛孔也张开了，用来出汗散热。", "如果这时候突然喝下冰水，就像给正在高速运转的身体浇了一盆冷水。肠胃受到刺激，血管会突然收缩，影响消化。", "而且，冰水会让喉咙和气管的血管迅速收缩，容易引起咳嗽或者肚子痛。严重的时候还会导致胃痉挛。", "运动后最好喝常温的水，小口小口地慢慢喝。等心跳和呼吸平稳下来，身体不那么热了，再适量喝点凉一点的饮料。"], "collectWords": ["运动", "毛孔", "收缩", "肠胃", "痉挛", "散热"], "quiz": [{"q": "运动时身体怎么散热？", "opts": ["吹风扇", "出汗", "喝冷水"], "ans": 1, "why": "原文第2段写道：「全身的毛孔也张开了，用来出汗散热。」"}, {"q": "运动后马上喝冰水，血管会怎么样？", "opts": ["扩张", "收缩", "不变"], "ans": 1, "why": "原文第3段写道：「肠胃受到刺激，血管会突然收缩……」"}, {"q": "喝冰水可能引起什么问题？", "opts": ["咳嗽或肚子痛", "让人更精神", "没有影响"], "ans": 0, "why": "原文第4段写道：「容易引起咳嗽或者肚子痛。严重的时候还会导致胃痉挛。」"}, {"q": "运动后最好喝什么水？", "opts": ["冰水", "热水", "常温的水"], "ans": 2, "why": "原文最后一段写道：「运动后最好喝常温的水，小口小口地慢慢喝。」"}]}, {"id": "M69", "title": "蚂蚁搬家要下雨", "theme": "生活", "paras": ["小时候老人常说：「蚂蚁搬家，天要下雨。」这是真的吗？蚂蚁真的能预报天气吗？", "原来，蚂蚁的家建在地下。下雨前，空气中的湿度会变大，也就是空气里含有很多水蒸气。", "地下蚁巢变得潮湿，蚂蚁能感觉到这种变化。如果雨下得很大，蚁巢可能会被水淹掉。", "所以蚂蚁们会提前行动，把卵、食物和重要物资搬到地势更高、更干燥的地方去。大家排着长队，忙忙碌碌地搬运，看起来就像「搬家」一样。", "看到蚂蚁搬家，虽然不能准确知道几点下雨，但可以大概判断：很快会有一场雨要来啦！"], "collectWords": ["湿度", "水蒸气", "蚁巢", "地势", "物资", "预报"], "quiz": [{"q": "蚂蚁的家建在哪里？", "opts": ["树上", "地下", "草丛里"], "ans": 1, "why": "原文第2段写道：「蚂蚁的家建在地下。」"}, {"q": "下雨前空气中的什么会变大？", "opts": ["温度", "湿度", "氧气"], "ans": 1, "why": "原文第2段写道：「下雨前，空气中的湿度会变大……」"}, {"q": "蚂蚁为什么搬家？", "opts": ["因为它们想旅游", "因为蚁巢可能变潮湿被淹", "因为它们喜欢新房子"], "ans": 1, "why": "原文第3、4段说明，下雨前地下蚁巢变潮湿，「如果雨下得很大，蚁巢可能会被水淹掉」，所以蚂蚁搬到更高的地方。"}, {"q": "看到蚂蚁搬家说明什么？", "opts": ["很快会下雨", "今天晴天", "要地震了"], "ans": 0, "why": "原文最后一段写道：「但可以大概判断：很快会有一场雨要来啦！」"}]}, {"id": "M70", "title": "露珠是从哪里来的", "theme": "生活", "paras": ["夏天的早晨，草叶上、花瓣上常常挂着一颗颗亮晶晶的露珠，像珍珠一样美丽。这些露珠是从哪里来的呢？", "白天，太阳把地面和植物晒热了，土壤和植物里的水分变成水蒸气，悄悄跑到空气中。", "到了夜里，气温慢慢下降。空气中的水蒸气遇到凉的草叶和花瓣，就冷却变成了小水滴。", "这些小水滴聚集在叶子的表面，就形成了我们看到的露珠。温度越低，露珠越多。秋天的早晨露珠比夏天还多。", "如果夜里气温降到零度以下，露珠还会结成白白的一层霜。露珠和霜都是大自然的杰作，让清晨的世界格外美丽。"], "collectWords": ["露珠", "水蒸气", "冷却", "聚集", "土壤", "杰作"], "quiz": [{"q": "白天土壤和植物里的水分变成什么跑到空气中？", "opts": ["露珠", "水蒸气", "云"], "ans": 1, "why": "原文第2段写道：「土壤和植物里的水分变成水蒸气，悄悄跑到空气中。」"}, {"q": "水蒸气为什么变成露珠？", "opts": ["因为太阳照射", "因为遇到凉的草叶冷却", "因为风吹"], "ans": 1, "why": "原文第3段写道：「空气中的水蒸气遇到凉的草叶和花瓣，就冷却变成了小水滴。」"}, {"q": "什么时候露珠最多？", "opts": ["夏天的中午", "秋天的早晨", "春天的下午"], "ans": 1, "why": "原文第4段写道：「秋天的早晨露珠比夏天还多。」"}, {"q": "气温降到零度以下，露珠会变成什么？", "opts": ["雨", "霜", "雪"], "ans": 1, "why": "原文最后一段写道：「如果夜里气温降到零度以下，露珠还会结成白白的一层霜。」"}]}, {"id": "M71", "title": "燕子低飞要下雨", "theme": "生活", "paras": ["你有没有注意过，快下雨的时候，燕子总是飞得很低，有时候甚至贴着地面飞。这是为什么呢？", "下雨前，空气中的湿度很大，水蒸气特别多。小虫子的翅膀沾了水汽，变得重重的，飞不高了。", "燕子最喜欢吃这些小虫子。虫子飞得低了，燕子也跟着低飞，这样才能捉到更多食物。", "另外，快下雨时气压会变低，燕子在高空飞行会感觉很闷、很累。低空的气压相对高一些，飞行更省力。", "所以当你看到燕子低飞捉虫的时候，很可能一场雨正在赶来的路上呢！"], "collectWords": ["燕子", "湿度", "气压", "沾了", "小虫子", "省力"], "quiz": [{"q": "快下雨时燕子为什么飞得低？", "opts": ["因为它们累了", "因为虫子飞得低，燕子要捉虫", "因为燕子喜欢低空"], "ans": 1, "why": "原文第2、3段说明，下雨前虫子翅膀沾水汽飞不高，燕子跟着低飞捉虫。"}, {"q": "小虫子为什么飞不高？", "opts": ["因为它们不想飞高", "翅膀沾了水汽变重", "因为没有风"], "ans": 1, "why": "原文第2段写道：「小虫子的翅膀沾了水汽，变得重重的，飞不高了。」"}, {"q": "快下雨时气压怎么变化？", "opts": ["变高", "变低", "不变"], "ans": 1, "why": "原文第4段写道：「快下雨时气压会变低……」"}, {"q": "燕子在高空飞行为什么会感觉闷和累？", "opts": ["因为气压变低", "因为风太大", "因为太阳太晒"], "ans": 0, "why": "原文第4段写道：「快下雨时气压会变低，燕子在高空飞行会感觉很闷、很累。」"}]}, {"id": "M72", "title": "年轮里的秘密", "theme": "生活", "paras": ["锯开一棵大树，你会看到一圈一圈的同心圆，就像唱片上的纹路一样。这些圈圈叫做「年轮」，里面藏着很多秘密。", "树木每年长一圈年轮。春天和夏天，雨水充足、阳光温暖，树木生长得快，形成的木质颜色较浅、质地较疏松。", "到了秋天，天气变冷，雨水减少，树木生长变慢，形成的木质颜色较深、质地较紧密。", "这样，一圈浅色的加上一圈深色的，就是完整的一年。数一数树桩上有多少圈年轮，就知道这棵树几岁了。", "年轮的宽窄还能告诉我们那一年的气候。年轮宽，说明那年雨水好、阳光足；年轮窄，说明那年可能干旱或者寒冷。"], "collectWords": ["年轮", "同心圆", "质地", "疏松", "紧密", "干旱"], "quiz": [{"q": "树木每年长几圈年轮？", "opts": ["一圈", "两圈", "很多圈"], "ans": 0, "why": "原文第2段写道：「树木每年长一圈年轮。」"}, {"q": "春天和夏天形成的木质有什么特点？", "opts": ["颜色较深、质地紧密", "颜色较浅、质地较疏松", "颜色黑色"], "ans": 1, "why": "原文第2段写道：「形成的木质颜色较浅、质地较疏松。」"}, {"q": "怎么知道一棵树几岁了？", "opts": ["量它的高度", "数年轮有几圈", "看叶子多少"], "ans": 1, "why": "原文第4段写道：「数一数树桩上有多少圈年轮，就知道这棵树几岁了。」"}, {"q": "年轮宽说明什么？", "opts": ["那年雨水好、阳光足", "那年很干旱", "那年很冷"], "ans": 0, "why": "原文最后一段写道：「年轮宽，说明那年雨水好、阳光足；年轮窄，说明那年可能干旱或者寒冷。」"}]}, {"id": "M73", "title": "仙人掌的刺是叶子变的", "theme": "生活", "paras": ["仙人掌生活在沙漠里，那里又干又热，雨水很少。为了在这么恶劣的环境里活下来，仙人掌想出了很多办法。", "你注意过吗？仙人掌身上没有普通的叶子，只有尖尖的刺。其实这些刺就是叶子变的！", "普通植物的叶子又大又薄，水分很容易从叶子上蒸发掉。沙漠里本来就缺水，如果仙人掌有大叶子，很快就会干死。", "于是仙人掌把
